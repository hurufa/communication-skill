6M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76M2 2l20 20\"/></svg>Teknis</h3><p>Sinyal lemah, kuota habis, mikrofon rusak.</p></div></div><div class=\"callout warn\" style=\"margin-top:.8em\">Kebanyakan salah paham melibatkan <b>lebih dari satu</b> hambatan sekaligus.</div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Fisik, fisiologis, psikologis, dan semantik: jenis <i>noise</i> menurut DeVito (2019). Hambatan budaya: Samovar dkk. (2017), dibahas di Pertemuan 11.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Studi kasus</span><span>UMKM · Sidoarjo</span></div><h2>Pesanan yang salah kirim</h2><div class=\"cols w\"><div><p><b>Bu Sari</b> menjual keripik tempe dari rumahnya di Sidoarjo. Sebagian besar pesanan masuk lewat WhatsApp. Suatu malam, pelanggan baru mengirim pesan.</p><p>Bu Sari mengirim <b>10 bungkus kecil rasa original</b>. Pelanggan kecewa: ia butuh <b>10 kg rasa pedas</b> untuk acara pengajian hari Sabtu.</p><p class=\"lead\" style=\"margin-top:.8em\">Tugas kelompok (3 orang, 10 menit):</p><ol><li>Sebutkan sender, message, channel, receiver, dan feedback.</li><li>Hambatan apa saja yang Anda temukan?</li><li>Tulis ulang pesan pelanggan agar jelas.</li></ol></div><div class=\"chat\" aria-label=\"Percakapan WhatsApp antara pelanggan dan Bu Sari\"><div class=\"who\">Keripik Tempe Bu Sari</div><div class=\"bub\">Assalamualaikum bu, pesan keripiknya 10 ya, kirim besok 🙏<small>20.15</small></div><div class=\"bub me\">Waalaikumsalam, siap kak 👍<small>20.40</small></div><div class=\"bub\">...<small>Jumat 09.10</small></div><div class=\"bub\">Lho bu kok cuma segini? Buat acara pengajian 😢<small>Jumat 11.02</small></div></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi</span></div><h2>Mari berdiskusi</h2><ol class=\"lead\"><li>Model mana (linear, interaksional, transaksional) yang paling menggambarkan kuliah daring? Mengapa?</li><li>Berikan satu contoh hambatan semantik dalam keseharian Anda, dalam bahasa Indonesia atau bahasa daerah.</li><li>Bagaimana mahasiswa bisa mengurangi <i>noise</i> saat mengirim pesan WhatsApp kepada dosen?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Komunikasi adalah proses menciptakan <b>makna bersama</b>.</li><li>Tujuh unsur: sender, message, channel, receiver, feedback, noise, context.</li><li>Model berkembang dari <b>linear</b> ke <b>interaksional</b> ke <b>transaksional</b>.</li><li>Kita tidak bisa <i>tidak</i> berkomunikasi, dan ucapan tidak bisa ditarik kembali.</li><li>Hambatan: fisik, fisiologis, psikologis, semantik, budaya, dan teknis.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Hambatan semantik: makna &quot;sebelum Jumat&quot; tidak sama bagi pengirim dan penerima.\"><p class=\"q\">Dosen berkata \"Kumpulkan sebelum Jumat.\" Mahasiswa mengumpulkan pada hari Jumat. Kata \"sebelum\" menimbulkan hambatan…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. fisik</button><button type=\"button\" data-o=\"b\">B. semantik</button><button type=\"button\" data-o=\"c\">C. teknis</button><button type=\"button\" data-o=\"d\">D. budaya</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Transaksional (Barnlund, 1970): kedua pihak menjadi pengirim sekaligus penerima.\"><p class=\"q\">Model mana yang menyatakan kedua pihak mengirim dan menerima pesan pada saat yang sama?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Linear</button><button type=\"button\" data-o=\"b\">B. Interaksional</button><button type=\"button\" data-o=\"c\">C. Transaksional</button><button type=\"button\" data-o=\"d\">D. Broadcast</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"&quot;One cannot not communicate&quot;: diam pun mengirim pesan.\"><p class=\"q\">Teman membaca pesan Anda lalu diam saja. Menurut Watzlawick dkk. (1967), hal ini…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. bukan komunikasi</button><button type=\"button\" data-o=\"b\">B. tetap komunikasi</button><button type=\"button\" data-o=\"c\">C. hanya noise</button><button type=\"button\" data-o=\"d\">D. hanya channel</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab pengantar komunikasi interpersonal dalam DeVito (2019), <i>The Interpersonal Communication Book</i> (edisi ke-15).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menganalisis</h3><p>Tulis satu kasus nyata hambatan komunikasi yang Anda alami atau lihat minggu ini (150–200 kata, bahasa Indonesia). Sebutkan unsur-unsurnya, jenis hambatannya, dan cara memperbaikinya. Bawa ke Pertemuan 2.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Communication</span></dt><dd>Proses menciptakan makna bersama melalui pesan, baik verbal maupun nonverbal. <i>(komunikasi)</i></dd></div><div><dt><span class=\"en\">Sender</span></dt><dd>Pihak yang memulai dan menyampaikan pesan; disebut juga source. <i>(pengirim / komunikator)</i></dd></div><div><dt><span class=\"en\">Message</span></dt><dd>Isi yang ingin disampaikan: kata-kata, nada suara, gerak tubuh, gambar, atau emoji. <i>(pesan)</i></dd></div><div><dt><span class=\"en\">Channel</span></dt><dd>Jalur yang dilalui pesan: tatap muka, telepon, WhatsApp, email. <i>(saluran / media)</i></dd></div><div><dt><span class=\"en\">Receiver</span></dt><dd>Pihak yang menerima lalu menafsirkan pesan. <i>(penerima / komunikan)</i></dd></div><div><dt><span class=\"en\">Feedback</span></dt><dd>Respons penerima yang menunjukkan bagaimana pesan dipahami. <i>(umpan balik)</i></dd></div><div><dt><span class=\"en\">Noise</span></dt><dd>Apa pun yang mengganggu pesan sehingga makna yang diterima berbeda dari yang dimaksud. <i>(gangguan)</i></dd></div><div><dt><span class=\"en\">Context</span></dt><dd>Situasi di sekitar komunikasi: tempat, waktu, budaya, dan hubungan antarpihak. <i>(konteks)</i></dd></div><div><dt><span class=\"en\">Encoding</span></dt><dd>Mengubah gagasan menjadi kata, simbol, atau tindakan. <i>(penyandian)</i></dd></div><div><dt><span class=\"en\">Decoding</span></dt><dd>Mengubah kata, simbol, atau tindakan kembali menjadi makna. <i>(penafsiran pesan)</i></dd></div><div><dt><span class=\"en\">Model</span></dt><dd>Gambaran sederhana tentang cara kerja suatu proses. <i>(model)</i></dd></div><div><dt><span class=\"en\">Irreversible</span></dt><dd>Tidak dapat ditarik kembali. Pesan yang sudah diterima tidak bisa dihapus dari ingatan penerima. <i>(tidak dapat ditarik kembali)</i></dd></div><div><dt><span class=\"en\">Jargon</span></dt><dd>Istilah khusus suatu kelompok atau bidang yang sering tidak dipahami orang luar. <i>(istilah teknis / bahasa khusus)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>DeVito, J. A. (2019). <i>The interpersonal communication book</i> (15th ed.). Pearson.</li><li>Shannon, C. E., &amp; Weaver, W. (1949). <i>The mathematical theory of communication</i>. University of Illinois Press.</li><li>Schramm, W. (1954). How communication works. Dalam W. Schramm (Ed.), <i>The process and effects of mass communication</i>. University of Illinois Press.</li><li>Barnlund, D. C. (1970). A transactional model of communication. Dalam K. K. Sereno &amp; C. D. Mortensen (Eds.), <i>Foundations of communication theory</i>. Harper &amp; Row.</li><li>Watzlawick, P., Beavin, J. H., &amp; Jackson, D. D. (1967). <i>Pragmatics of human communication: A study of interactional patterns, pathologies, and paradoxes</i>. W. W. Norton.</li><li>Samovar, L. A., Porter, R. E., McDaniel, E. R., &amp; Roy, C. S. (2017). <i>Communication between cultures</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Komunikasi Interpersonal (1)","subtitle":"Konsep diri, persepsi, mendengar aktif, dan empati","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Communication Skill · SI24W32</span></div><h1>Komunikasi Interpersonal (1)</h1><p class=\"lead\">Konsep diri, persepsi, mendengar aktif, dan empati</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Belajar + role-play</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menerapkan komunikasi interpersonal yang efektif: mendengar aktif, empati, verbal dan nonverbal, serta asertif (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 4)</span></h3><ol><li>Ketepatan melakukan parafrase dan klarifikasi saat mendengar aktif.</li><li>Keselarasan pesan verbal dan nonverbal. <span class=\"muted\">(Pertemuan 3)</span></li><li>Ketepatan memilih respons asertif dalam simulasi. <span class=\"muted\">(Pertemuan 3)</span></li><li>Kejujuran dan kesantunan dalam berkomunikasi.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menerapkan sikap jujur, amanah, taat norma, dan kolaboratif dalam komunikasi interpersonal, kerja tim, dan ruang digital.</dd><dt>CPL-1</dt><dd class=\"id\">Mampu mengintegrasikan sikap As Shidqu (kejujuran), Al Amanah Wal Wafa Bil Ahdi (bertanggung jawab), Al Adalah (selalu berpedoman pada norma dan peraturan yang berlaku) dan At Taawun (berkolaborasi) dalam perkembangan ilmu pengetahuan dan teknologi.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Praktik / Unjuk Kerja (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Sebutkan tujuh unsur komunikasi.</li><li>Apa beda model interaksional dan transaksional?</li><li>Berikan satu contoh hambatan semantik.</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span></div><h2>Apa itu komunikasi interpersonal?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Interpersonal communication is the verbal and nonverbal interaction between two (or sometimes more than two) interdependent people.\"</p><p class=\"tr\">\"Komunikasi interpersonal adalah interaksi verbal dan nonverbal antara dua (atau kadang lebih dari dua) orang yang saling bergantung.\"</p><div class=\"src\">DeVito (2019); terjemahan harfiah penyusun</div></blockquote><ul style=\"margin-top:.8em\"><li>Membangun dan mengubah <b>hubungan</b>.</li><li>Kedua pihak saling memengaruhi.</li><li>Bisa tatap muka atau daring.</li></ul></div><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Kampus</h3><p>Mahasiswa dan dosen wali</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Pesantren</h3><p>Santri dan musyrif</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>UMKM</h3><p>Admin toko daring dan pelanggan</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01\"/></svg>Rumah</h3><p>Anda dan orang tua</p></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bagian 1</span><span>Mengenal diri</span></div><h2>Konsep diri: cara Anda memandang diri</h2><div class=\"cols\"><div><p><button type=\"button\" class=\"term\" data-term=\"self-concept\">Self-concept</button> Anda membentuk cara Anda berbicara dan mendengar. Sumbernya <span class=\"cite\">(DeVito, 2019)</span>:</p><ul><li><b>Pandangan orang lain</b>: apa kata orang tua, guru, dan teman tentang Anda.</li><li><b>Perbandingan sosial</b>: membandingkan diri dengan orang lain.</li><li><b>Ajaran budaya</b>: nilai dari keluarga, pesantren, dan masyarakat.</li><li><b>Evaluasi diri</b>: cara Anda menilai perbuatan sendiri.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Mengapa penting?</h3><p><button type=\"button\" class=\"term\" data-term=\"self-esteem\">Self-esteem</button> yang rendah bisa membuat Anda diam di kelas, padahal punya ide bagus. Konsep diri yang sehat membantu Anda bicara jelas dan menerima masukan.</p><p class=\"muted\">Coba ganti \"Saya tidak bisa presentasi\" menjadi \"Saya <b>belum</b> terbiasa presentasi\". Kata <i>belum</i> mengubah pesan kepada diri sendiri.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Model</span><span>Johari Window</span></div><h2>Empat area diri</h2><div class=\"cols w\"><div><figure class=\"fig\"><svg viewBox=\"0 0 600 330\" role=\"img\" aria-label=\"Johari Window, kisi dua kali dua. Diketahui diri dan diketahui orang lain: area open. Tidak diketahui diri tetapi diketahui orang lain: area blind. Diketahui diri tetapi tidak diketahui orang lain: area hidden. Tidak diketahui keduanya: area unknown. Meminta feedback memperluas area open ke kanan; self-disclosure memperluasnya ke bawah.\"><defs><marker id=\"ar3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"250\" y=\"22\" text-anchor=\"middle\" class=\"s-hd\">DIKETAHUI DIRI</text><text x=\"454\" y=\"22\" text-anchor=\"middle\" class=\"s-hd\">TIDAK DIKETAHUI DIRI</text><text x=\"138\" y=\"92\" text-anchor=\"end\" class=\"s-hd\">DIKETAHUI</text><text x=\"138\" y=\"108\" text-anchor=\"end\" class=\"s-hd\">ORANG LAIN</text><text x=\"138\" y=\"226\" text-anchor=\"end\" class=\"s-hd\">TIDAK DIKETAHUI</text><text x=\"138\" y=\"242\" text-anchor=\"end\" class=\"s-hd\">ORANG LAIN</text><rect x=\"150\" y=\"34\" width=\"200\" height=\"130\" rx=\"10\" class=\"s-hl\"/><text x=\"250\" y=\"90\" text-anchor=\"middle\" class=\"s-ta\">OPEN</text><text x=\"250\" y=\"112\" text-anchor=\"middle\" style=\"fill:var(--accent-ink);font-size:12.5px;font-family:var(--font)\">nama, hobi saya</text><rect x=\"354\" y=\"34\" width=\"200\" height=\"130\" rx=\"10\" class=\"s-soft\"/><text x=\"454\" y=\"90\" text-anchor=\"middle\" class=\"s-t\">BLIND</text><text x=\"454\" y=\"112\" text-anchor=\"middle\" class=\"s-s\">saya bicara terlalu cepat</text><rect x=\"150\" y=\"168\" width=\"200\" height=\"130\" rx=\"10\" class=\"s-soft\"/><text x=\"250\" y=\"224\" text-anchor=\"middle\" class=\"s-t\">HIDDEN</text><text x=\"250\" y=\"246\" text-anchor=\"middle\" class=\"s-s\">saya gugup di kelas</text><rect x=\"354\" y=\"168\" width=\"200\" height=\"130\" rx=\"10\" class=\"s-box\"/><text x=\"454\" y=\"224\" text-anchor=\"middle\" class=\"s-t\">UNKNOWN</text><text x=\"454\" y=\"246\" text-anchor=\"middle\" class=\"s-s\">bakat yang belum ditemukan</text><line x1=\"300\" y1=\"146\" x2=\"392\" y2=\"146\" class=\"s-line\" marker-end=\"url(#ar3)\"/><text x=\"398\" y=\"150\" class=\"s-s\" style=\"font-weight:700\">feedback</text><line x1=\"176\" y1=\"138\" x2=\"176\" y2=\"194\" class=\"s-line\" marker-end=\"url(#ar3)\"/><text x=\"186\" y=\"196\" class=\"s-s\" style=\"font-weight:700\">self-disclosure</text></svg><figcaption>Johari Window (Luft &amp; Ingham, 1955). Meminta feedback memperluas area open ke kanan (mengecilkan area blind); self-disclosure memperluasnya ke bawah (mengecilkan area hidden).</figcaption></figure></div><div><p>Hubungan yang sehat memperluas <b>area open</b>.</p><ul><li><b>Minta <button type=\"button\" class=\"term\" data-term=\"feedback\">feedback</button></b> untuk mengetahui area blind Anda.</li><li>Lakukan <button type=\"button\" class=\"term\" data-term=\"self-disclosure\">self-disclosure</button> secara bertahap untuk membuka sebagian area hidden.</li><li>Bagikan sedikit demi sedikit, kepada orang yang Anda percaya.</li></ul><div class=\"callout\" style=\"margin-top:.8em\">Coba tanyakan kepada teman: \"Satu kebiasaan apa yang saya lakukan saat presentasi, yang mungkin tidak saya sadari?\"</div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bagian 2</span><span>Persepsi</span></div><h2>Bagaimana kita memaknai orang lain</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 200\" role=\"img\" aria-label=\"Lima tahap persepsi menurut DeVito: stimulation, organization, interpretation-evaluation, memory, recall, dengan contoh teman yang belum membalas pesan WhatsApp.\"><defs><marker id=\"ar4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"20\" width=\"148\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"84\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 1</text><text x=\"84\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Stimulation</text><line x1=\"160\" y1=\"62\" x2=\"178\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar4)\"/><text x=\"84\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">indra menangkap</text><text x=\"84\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">rangsang</text><text x=\"84\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">\"Dibaca. Tak dibalas.\"</text><rect x=\"182\" y=\"20\" width=\"148\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"256\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 2</text><text x=\"256\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Organization</text><line x1=\"332\" y1=\"62\" x2=\"350\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar4)\"/><text x=\"256\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">menyusun rangsang</text><text x=\"256\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">menjadi pola</text><text x=\"256\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">\"Tadi dia keluar call.\"</text><rect x=\"354\" y=\"20\" width=\"148\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"428\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 3</text><text x=\"428\" y=\"68\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Interpretation–</text><text x=\"428\" y=\"86\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">evaluation</text><line x1=\"504\" y1=\"62\" x2=\"522\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar4)\"/><text x=\"428\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">memberi makna</text><text x=\"428\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">dan menilai</text><text x=\"428\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">\"Dia marah padaku.\"</text><rect x=\"526\" y=\"20\" width=\"148\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"600\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 4</text><text x=\"600\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Memory</text><line x1=\"676\" y1=\"62\" x2=\"694\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar4)\"/><text x=\"600\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">kesan disimpan</text><text x=\"600\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">dalam ingatan</text><text x=\"600\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">\"Dia sedang marah.\"</text><rect x=\"698\" y=\"20\" width=\"148\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"772\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 5</text><text x=\"772\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Recall</text><text x=\"772\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">kesan dipanggil</text><text x=\"772\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">saat dibutuhkan</text><text x=\"772\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">\"Besok aku menjauh.\"</text></svg><figcaption>Lima tahap persepsi menurut DeVito (2019). Tafsiran yang keliru di tahap 3 ikut tersimpan (tahap 4) dan muncul lagi (tahap 5), sehingga memengaruhi komunikasi berikutnya. Cek dulu sebelum menyimpulkan.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Waspada</span><span>Kesalahan persepsi</span></div><h2>Kesalahan persepsi yang sering terjadi</h2><div class=\"cols\"><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Stereotip</h3><p>\"Mahasiswa dari daerah X pasti malas.\" <button type=\"button\" class=\"term\" data-term=\"stereotype\">Stereotype</button> mengabaikan individu.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Kesan pertama</h3><p><button type=\"button\" class=\"term\" data-term=\"primacy\">Primacy effect</button>: menilai orang hanya dari pertemuan pertama.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Bias melayani diri</h3><p><button type=\"button\" class=\"term\" data-term=\"self-serving\">Self-serving bias</button>: \"Saya gagal karena soalnya sulit; dia gagal karena malas.\"</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Ramalan diri</h3><p><button type=\"button\" class=\"term\" data-term=\"self-fulfilling\">Self-fulfilling prophecy</button>: \"Dia pasti tidak suka saya\", lalu kita bersikap dingin dan dugaan itu jadi nyata.</p></div></div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg><button type=\"button\" class=\"term\" data-term=\"perception-checking\">Cek persepsi</button></h3><ol><li><b>Gambarkan</b> apa yang Anda lihat: \"Tadi kamu keluar dari call lebih awal.\"</li><li><b>Tawarkan dua kemungkinan</b>: \"Mungkin kamu sibuk, atau mungkin kamu kesal.\"</li><li><b>Tanyakan</b>: \"Yang mana, ya?\"</li></ol><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(DeVito, 2019)</span></p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bagian 3</span><span>Mendengarkan</span></div><h2>Mendengar belum tentu menyimak</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0\"/><path d=\"M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4\"/></svg><button type=\"button\" class=\"term\" data-term=\"hearing\">Hearing</button></h3><p>Fisik. Bunyi masuk ke telinga. Terjadi otomatis.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"listening\">Listening</button></h3><p>Mental. Anda memilih untuk memperhatikan, memahami, dan merespons. Butuh usaha.</p></div></div><figure class=\"fig\"><svg viewBox=\"0 0 860 200\" role=\"img\" aria-label=\"Lima tahap listening berurutan: receiving, understanding, remembering, evaluating, responding. Responding kembali ke receiving.\"><defs><marker id=\"ar5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"148\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"84\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Receiving</text><text x=\"84\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">menerima</text><line x1=\"160\" y1=\"70\" x2=\"178\" y2=\"70\" class=\"s-line\" marker-end=\"url(#ar5)\"/><rect x=\"182\" y=\"30\" width=\"148\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"256\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Understanding</text><text x=\"256\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">memahami</text><line x1=\"332\" y1=\"70\" x2=\"350\" y2=\"70\" class=\"s-line\" marker-end=\"url(#ar5)\"/><rect x=\"354\" y=\"30\" width=\"148\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"428\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Remembering</text><text x=\"428\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">mengingat</text><line x1=\"504\" y1=\"70\" x2=\"522\" y2=\"70\" class=\"s-line\" marker-end=\"url(#ar5)\"/><rect x=\"526\" y=\"30\" width=\"148\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"600\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Evaluating</text><text x=\"600\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">menilai</text><line x1=\"676\" y1=\"70\" x2=\"694\" y2=\"70\" class=\"s-line\" marker-end=\"url(#ar5)\"/><rect x=\"698\" y=\"30\" width=\"148\" height=\"80\" rx=\"12\" class=\"s-acc\"/><text x=\"772\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Responding</text><text x=\"772\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">merespons</text><path d=\"M772 112 C772 180 84 180 84 114\" class=\"s-line\" marker-end=\"url(#ar5)\"/><text x=\"430\" y=\"166\" text-anchor=\"middle\" class=\"s-s\">pembicara melanjutkan, Anda menyimak lagi</text></svg><figcaption>Lima tahap listening menurut DeVito (2019). Hearing hanya tahap pertama; listening memerlukan kelima tahap.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Keterampilan</span><span>Active listening</span></div><h2>Empat teknik <button type=\"button\" class=\"term\" data-term=\"active-listening\">active listening</button></h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Teknik</th><th>Yang Anda lakukan</th><th>Contoh kalimat</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"paraphrase\">Paraphrase</button></b></td><td>Ungkapkan kembali gagasan dengan kata-kata sendiri</td><td><span class=\"phrase\">Jadi maksudnya…</span> <span class=\"phrase\">Kalau saya tangkap…</span></td></tr><tr><td><b>Klarifikasi</b></td><td>Tanyakan bagian yang belum jelas</td><td><span class=\"phrase\">Maksudnya … itu bagaimana?</span> <span class=\"phrase\">Boleh contohnya?</span></td></tr><tr><td><b>Meringkas</b></td><td>Kumpulkan poin-poin utama</td><td><span class=\"phrase\">Sejauh ini ada tiga hal…</span></td></tr><tr><td><b>Menunjukkan perhatian</b></td><td>Kontak mata, mengangguk, menghadap pembicara, letakkan ponsel</td><td><span class=\"phrase\">Oh, begitu.</span> <span class=\"phrase\">Terus?</span></td></tr></tbody></table></div><div style=\"margin-top:.6em\"><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Most people do not listen with the intent to understand; they listen with the intent to reply.\"</p><p class=\"tr\">\"Kebanyakan orang tidak mendengarkan dengan niat untuk memahami; mereka mendengarkan dengan niat untuk membalas.\"</p><div class=\"src\">Covey (1989); terjemahan harfiah penyusun</div></blockquote></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Keterampilan</span><span>Empati</span></div><h2>Empati, bukan sekadar simpati</h2><p class=\"lead\">Seorang teman berkata: <i>\"Aku gagal kuis. Padahal sudah belajar semalaman.\"</i></p><div class=\"cols c3\" style=\"margin-top:.6em\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Mengabaikan</h3><p>\"Cuma kuis. Santai saja.\"</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg><button type=\"button\" class=\"term\" data-term=\"sympathy\">Sympathy</button></h3><p>\"Kasihan banget kamu.\"</p></div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg><button type=\"button\" class=\"term\" data-term=\"empathy\">Empathy</button></h3><p>\"Kamu sudah belajar keras tapi nilainya belum sesuai. Pasti kecewa sekali, ya.\"</p></div></div><p style=\"margin-top:.8em\">Empati = memahami perasaan <b>dari sudut pandang mereka</b>, lalu menunjukkannya lewat kata-kata <span class=\"cite\">(DeVito, 2019)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Nilai</span><span>As Shidqu · kejujuran</span></div><h2>Jujur saat mendengar, jujur saat bicara</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"ar\" lang=\"ar\" dir=\"rtl\">مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ</p><p class=\"quote\">\"Barangsiapa beriman kepada Allah dan hari akhir, maka hendaklah dia mengucapkan perkataan yang baik atau diam.\"</p><div class=\"src\">HR. Muslim no. 47 (Lidwa no. 67); juga HR. al-Bukhari no. 6018. Terjemahan: Ensiklopedi Hadits Lidwa Pusaka</div></blockquote><p style=\"margin-top:.8em\">Dalam komunikasi interpersonal, <button type=\"button\" class=\"term\" data-term=\"as-shidqu\">As Shidqu</button> berarti:</p><ul><li>Tidak pura-pura mendengarkan sambil melihat ponsel.</li><li>Berkata \"saya belum paham\" daripada sekadar mengangguk.</li><li>Tidak menyebarkan cerita setengah benar tentang orang lain.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Refleksi</h3><p>Kapan terakhir kali Anda berkata \"iya, paham\" padahal belum benar-benar paham? Apa yang terjadi setelahnya?</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Role-play berpasangan · 25 menit</span></div><h2>Latihan mendengar aktif</h2><div class=\"cols\"><div><p><b>Cara kerja</b> (dua pasangan bergabung menjadi satu grup berempat):</p><ul><li><b>Pasangan A</b> bermain peran: satu sebagai <b>pembicara</b> (menceritakan masalah 2 menit), satu sebagai <b>pendengar</b> (memakai empat teknik dan empati).</li><li><b>Pasangan B</b> menjadi <b>pengamat</b> dan mengisi daftar periksa di slide berikutnya.</li><li>Tukar peran sampai semua orang pernah menjadi pendengar.</li></ul><p class=\"muted\">Gunakan bahasa Indonesia yang santun.</p></div><div class=\"grid4\" style=\"grid-template-columns:1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Skenario A · Pesantren</h3><p>Santri baru bercerita kepada musyrif bahwa ia rindu rumah dan sulit tidur.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Skenario B · UMKM</h3><p>Pelanggan mengeluh kepada admin toko daring: pesanannya terlambat 4 hari.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Skenario C · Kampus</h3><p>Teman sekelas cemas karena anggota kelompok Tugas 1 tidak merespons di grup.</p></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar periksa pengamat</span><span>Umpan balik sejawat</span></div><h2>Apakah pendengar sudah…?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Perilaku</th><th style=\"width:14%\">Ya</th><th style=\"width:14%\">Sebagian</th><th style=\"width:14%\">Belum</th></tr></thead><tbody><tr><td>Melakukan parafrase gagasan utama minimal sekali</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Mengajukan minimal satu pertanyaan klarifikasi</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Menjaga kontak mata dan menghadap pembicara</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Tidak memotong pembicaraan</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Menamai perasaan pembicara (empati)</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Tetap jujur dan santun (tidak pura-pura paham)</td><td>○</td><td>○</td><td>○</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em\">Sampaikan satu hal yang sudah baik dan satu hal yang bisa ditingkatkan. Spesifik dan santun.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Portofolio praktik kelompok</h2><div class=\"cols c3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2M12 19v3\"/></svg>Bagian 1 · Pertemuan 2–3</h3><p>Rekaman <i>role-play</i> komunikasi interpersonal.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Bagian 2 · Pertemuan 4–5</h3><p>Notulen simulasi rapat organisasi.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/></svg>Bagian 3 · Pertemuan 6–7</h3><p>Presentasi kelompok hasil observasi komunikasi di satu organisasi.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Hari ini: bentuk kelompok dan pilih satu organisasi untuk diamati (UMKM, instansi, atau pesantren). Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Komunikasi interpersonal membangun hubungan antara orang yang saling bergantung.</li><li>Konsep diri memengaruhi cara kita berkomunikasi; Johari Window menunjukkan cara memperluas area open.</li><li>Persepsi adalah tafsiran, bukan fakta. Cek dulu sebelum menilai.</li><li>Listening punya lima tahap. Gunakan parafrase, klarifikasi, meringkas, dan perhatian.</li><li>Empati memahami dari sudut pandang orang lain. Kejujuran (As Shidqu) menjaga kepercayaan.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Parafrase: mengungkapkan kembali gagasan pembicara dengan kata-kata sendiri untuk memastikan pemahaman.\"><p class=\"q\">\"Jadi maksudmu tenggatnya terlalu mepet untuk kelompokmu, ya?\" Respons ini adalah contoh…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. klarifikasi</button><button type=\"button\" data-o=\"b\">B. parafrase</button><button type=\"button\" data-o=\"c\">C. meringkas</button><button type=\"button\" data-o=\"d\">D. menilai</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Area blind. Meminta feedback membuat area ini mengecil.\"><p class=\"q\">Dalam Johari Window, hal yang diketahui orang lain tentang Anda tetapi tidak Anda sadari berada di area…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. open</button><button type=\"button\" data-o=\"b\">B. hidden</button><button type=\"button\" data-o=\"c\">C. blind</button><button type=\"button\" data-o=\"d\">D. unknown</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Empati menamai perasaan dari sudut pandang teman.\"><p class=\"q\">Teman: \"Laptopku rusak sehari sebelum deadline.\" Respons mana yang menunjukkan empati?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. \"Pinjam saja punya orang.\"</button><button type=\"button\" data-o=\"b\">B. \"Kasihan banget kamu.\"</button><button type=\"button\" data-o=\"c\">C. \"Pas mau deadline, pasti panik banget ya.\"</button><button type=\"button\" data-o=\"d\">D. \"Laptopku juga pernah rusak tahun lalu.\"</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Jurnal refleksi komunikasi</h3><p>Selama 5 hari, tulis 2–3 kalimat per hari: satu momen ketika Anda mendengarkan dengan baik, dan satu momen ketika tidak. Apa bedanya? Teknik apa yang Anda pakai atau lupakan?</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok</h3><p>Pastikan anggota kelompok dan organisasi yang akan diamati untuk Tugas 1. Mulai susun naskah <i>role-play</i> untuk direkam setelah Pertemuan 3.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Interpersonal communication</span></dt><dd>Interaksi verbal dan nonverbal antara dua orang (atau sedikit lebih) yang saling bergantung. <i>(komunikasi antarpribadi)</i></dd></div><div><dt><span class=\"en\">Self-concept</span></dt><dd>Gambaran yang Anda miliki tentang siapa diri Anda. <i>(konsep diri)</i></dd></div><div><dt><span class=\"en\">Self-esteem</span></dt><dd>Penilaian Anda tentang seberapa berharga diri Anda. <i>(harga diri)</i></dd></div><div><dt><span class=\"en\">Self-disclosure</span></dt><dd>Mengungkapkan informasi tentang diri sendiri yang sebelumnya tidak diketahui orang lain. <i>(pengungkapan diri)</i></dd></div><div><dt><span class=\"en\">Johari Window</span></dt><dd>Model empat area kesadaran diri: open, blind, hidden, dan unknown. <i>(Jendela Johari)</i></dd></div><div><dt><span class=\"en\">Perception</span></dt><dd>Proses memilih, menata, dan menafsirkan apa yang kita lihat dan dengar. <i>(persepsi)</i></dd></div><div><dt><span class=\"en\">Perception checking</span></dt><dd>Memastikan tafsiran kita dengan menggambarkan apa yang diamati lalu menanyakannya langsung. <i>(pengecekan persepsi)</i></dd></div><div><dt><span class=\"en\">Stereotype</span></dt><dd>Gambaran yang tetap dan disederhanakan tentang seluruh anggota suatu kelompok. <i>(stereotip)</i></dd></div><div><dt><span class=\"en\">Primacy effect</span></dt><dd>Kecenderungan informasi yang datang pertama paling kuat memengaruhi penilaian kita. <i>(efek kesan pertama)</i></dd></div><div><dt><span class=\"en\">Self-serving bias</span></dt><dd>Kecenderungan mengaitkan keberhasilan dengan diri sendiri dan kegagalan dengan faktor luar. <i>(bias melayani diri)</i></dd></div><div><dt><span class=\"en\">Self-fulfilling prophecy</span></dt><dd>Dugaan yang menjadi kenyataan karena kita bertindak seolah-olah dugaan itu sudah benar. <i>(ramalan yang memenuhi dirinya sendiri)</i></dd></div><div><dt><span class=\"en\">Active listening</span></dt><dd>Mendengarkan dengan perhatian penuh dan menunjukkan kepada pembicara bahwa Anda memahaminya. <i>(mendengar aktif)</i></dd></div><div><dt><span class=\"en\">Paraphrase</span></dt><dd>Mengungkapkan kembali gagasan pembicara dengan kata-kata sendiri untuk memastikan pemahaman. <i>(parafrase)</i></dd></div><div><dt><span class=\"en\">Empathy</span></dt><dd>Memahami perasaan orang lain dari sudut pandang orang itu. <i>(empati)</i></dd></div><div><dt><span class=\"en\">As Shidqu</span></dt><dd>Kejujuran dalam ucapan dan perbuatan; salah satu nilai inti Unusida (CPL-1). <i>(kejujuran)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>DeVito, J. A. (2019). <i>The interpersonal communication book</i> (15th ed.). Pearson.</li><li>Luft, J., &amp; Ingham, H. (1955). The Johari window, a graphic model of interpersonal awareness. Dalam <i>Proceedings of the Western Training Laboratory in Group Development</i>. University of California, Los Angeles.</li><li>Covey, S. R. (1989). <i>The 7 habits of highly effective people</i>. Simon &amp; Schuster.</li><li>Al-Bukhari, M. I. <i>Sahih al-Bukhari</i>, Kitab al-Adab, hadis no. 6018; Muslim ibn al-Hajjaj. <i>Sahih Muslim</i>, Kitab al-Iman, hadis no. 47.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 3.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":3,"title":"Komunikasi Interpersonal (2)","subtitle":"Pesan verbal dan nonverbal; gaya pasif, agresif, asertif","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 3</span><span>Communication Skill · SI24W32</span></div><h1>Komunikasi Interpersonal (2)</h1><p class=\"lead\">Pesan verbal dan nonverbal; gaya pasif, agresif, asertif</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Belajar + role-play asertif</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menerapkan komunikasi interpersonal yang efektif: mendengar aktif, empati, verbal dan nonverbal, serta asertif (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 2, 3, dan 4)</span></h3><ol><li>Ketepatan melakukan parafrase dan klarifikasi saat mendengar aktif. <span class=\"muted\">(Pertemuan 2)</span></li><li>Keselarasan pesan verbal dan nonverbal.</li><li>Ketepatan memilih respons asertif dalam simulasi.</li><li>Kejujuran dan kesantunan dalam berkomunikasi.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menerapkan sikap jujur, amanah, taat norma, dan kolaboratif dalam komunikasi interpersonal, kerja tim, dan ruang digital.</dd><dt>CPL-1</dt><dd class=\"id\">Mampu mengintegrasikan sikap As Shidqu (kejujuran), Al Amanah Wal Wafa Bil Ahdi (bertanggung jawab), Al Adalah (selalu berpedoman pada norma dan peraturan yang berlaku) dan At Taawun (berkolaborasi) dalam perkembangan ilmu pengetahuan dan teknologi.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Praktik / Unjuk Kerja (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 2 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Sebutkan lima tahap persepsi menurut DeVito (2019).</li><li>Apa beda parafrase dan klarifikasi?</li><li>Ubah respons ini menjadi empatik: \"Ya sudah, cuma kuis.\"</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · seluruh kelas</span></div><h2>Satu kata, banyak makna</h2><div class=\"cols w\"><div><p class=\"lead\">Ucapkan kata <b>\"Oke.\"</b> dengan empat cara:</p><ol><li>Setuju dengan senang hati</li><li>Terpaksa setuju</li><li>Kesal dan menyindir</li><li>Ragu, belum yakin</li></ol><p class=\"muted\">Kata-katanya sama. Apa yang membuat maknanya berbeda?</p></div><div class=\"chat\" aria-label=\"Contoh percakapan\"><div class=\"who\">Grup Kelompok Tugas 1</div><div class=\"bub\">Bagianmu dikumpulkan malam ini ya<small>19.02</small></div><div class=\"bub me\">Oke.<small>19.40</small></div><div class=\"bub\">Oke apa nih? 😅<small>19.41</small></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bagian 1</span><span>Pesan verbal</span></div><h2>Makna ada pada orang, bukan pada kata</h2><div class=\"cols\"><div><p><button type=\"button\" class=\"term\" data-term=\"verbal\">Pesan verbal</button> memakai kata-kata, lisan maupun tulisan. Tiga hal yang perlu diingat (DeVito, 2019):</p><ul><li><b>Makna ada pada orang.</b> Kata hanya pemicu; maknanya dibentuk oleh pengalaman penerima.</li><li><b>Denotasi dan konotasi.</b> <button type=\"button\" class=\"term\" data-term=\"denotation\">Denotasi</button> adalah makna kamus; <button type=\"button\" class=\"term\" data-term=\"connotation\">konotasi</button> adalah rasa dan penilaian yang menempel pada kata.</li><li><b>Tingkat abstraksi.</b> Kata abstrak (\"segera\", \"rapi\") ditafsirkan berbeda-beda; kata konkret lebih jelas.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Abstrak → konkret</h3><table class=\"t\"><tbody><tr><td>\"Kerjakan secepatnya.\"</td><td>\"Kirim draf sebelum Kamis pukul 20.00.\"</td></tr><tr><td>\"Presentasinya kurang menarik.\"</td><td>\"Slide 3–5 terlalu banyak teks; coba pakai satu gambar.\"</td></tr><tr><td>\"Tolong rapikan.\"</td><td>\"Samakan ukuran huruf judul menjadi 28.\"</td></tr></tbody></table></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bagian 2</span><span>Pesan nonverbal</span></div><h2>Saluran pesan <button type=\"button\" class=\"term\" data-term=\"nonverbal\">nonverbal</button></h2><div class=\"grid4\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01\"/></svg>Wajah</h3><p>Senyum, cemberut, alis terangkat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Mata</h3><p>Kontak mata, menunduk, melirik.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Gerak tubuh</h3><p>Anggukan, isyarat tangan, postur.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg><button type=\"button\" class=\"term\" data-term=\"haptics\">Sentuhan</button></h3><p>Bersalaman, salim, menepuk bahu.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 5 6 9H2v6h4l5 4V5Z\"/><path d=\"M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14\"/></svg><button type=\"button\" class=\"term\" data-term=\"paralanguage\">Paralinguistik</button></h3><p>Nada, volume, tempo, jeda, juga diam.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/></svg><button type=\"button\" class=\"term\" data-term=\"proxemics\">Ruang dan jarak</button></h3><p>Seberapa dekat kita berdiri atau duduk.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Artefak</h3><p>Pakaian, jas almamater, tata ruang, warna.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg><button type=\"button\" class=\"term\" data-term=\"chronemics\">Waktu</button></h3><p>Datang tepat waktu, lama membalas pesan.</p></div></div><p class=\"muted\" style=\"margin-top:.7em;font-size:.88em\">Pengelompokan saluran diadaptasi dari DeVito (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Model</span><span>Proksemik</span></div><h2>Empat zona jarak <span class=\"cite\">(Hall, 1966)</span></h2><figure class=\"fig\"><svg viewBox=\"0 0 830 190\" role=\"img\" aria-label=\"Empat zona jarak menurut Hall: intim nol sampai sekitar 45 sentimeter, personal sekitar 45 sentimeter sampai 1,2 meter, sosial 1,2 sampai 3,6 meter, publik lebih dari 3,6 meter, masing-masing dengan contoh situasi.\"><defs><marker id=\"ar6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><circle cx=\"44\" cy=\"58\" r=\"14\" class=\"s-soft\"/><path d=\"M24 108 Q44 70 64 108\" class=\"s-soft\"/><text x=\"44\" y=\"134\" text-anchor=\"middle\" class=\"s-s\">Anda</text><rect x=\"96\" y=\"40\" width=\"144\" height=\"70\" rx=\"10\" class=\"s-acc\"/><text x=\"168.0\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">INTIM</text><text x=\"168.0\" y=\"90\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">0 – ±45 cm</text><text x=\"168.0\" y=\"140\" text-anchor=\"middle\" class=\"s-s\">keluarga, sahabat dekat</text><rect x=\"246\" y=\"40\" width=\"164\" height=\"70\" rx=\"10\" class=\"s-soft\"/><text x=\"328.0\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">PERSONAL</text><text x=\"328.0\" y=\"90\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">±45 cm – 1,2 m</text><text x=\"328.0\" y=\"140\" text-anchor=\"middle\" class=\"s-s\">ngobrol dengan teman</text><rect x=\"416\" y=\"40\" width=\"204\" height=\"70\" rx=\"10\" class=\"s-soft\"/><text x=\"518.0\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">SOSIAL</text><text x=\"518.0\" y=\"90\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">1,2 – 3,6 m</text><text x=\"518.0\" y=\"140\" text-anchor=\"middle\" class=\"s-s\">konsultasi di meja dosen, rapat</text><rect x=\"626\" y=\"40\" width=\"184\" height=\"70\" rx=\"10\" class=\"s-box\"/><text x=\"718.0\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">PUBLIK</text><text x=\"718.0\" y=\"90\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">> 3,6 m</text><text x=\"718.0\" y=\"140\" text-anchor=\"middle\" class=\"s-s\">ceramah, kuliah umum</text><line x1=\"96\" y1=\"170\" x2=\"810\" y2=\"170\" class=\"s-line\" marker-end=\"url(#ar6)\"/><text x=\"452\" y=\"186\" text-anchor=\"middle\" class=\"s-s\">makin jauh, makin formal (tidak berskala)</text></svg><figcaption>Empat zona jarak menurut Hall (1966), sebagaimana dibahas DeVito (2019). Batas jarak dibulatkan dari satuan kaki; kebiasaan jarak bisa berbeda antarbudaya dan antardaerah.</figcaption></figure><div class=\"callout\" style=\"margin-top:.6em\">Jarak yang terlalu dekat bisa terasa mengancam; terlalu jauh bisa terasa dingin. Sesuaikan dengan hubungan dan situasi.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konteks Indonesia</span><span>Kampus · pesantren · masyarakat</span></div><h2>Nonverbal dalam budaya kita</h2><div class=\"cols\"><div><ul><li><b>Menunduk</b> saat berbicara dengan kiai, orang tua, atau dosen: tanda hormat, bukan tanda tidak percaya diri.</li><li><b>Tangan kanan</b> untuk memberi, menerima, dan menunjuk.</li><li><b>Membungkuk sambil mengulurkan tangan</b> saat lewat di depan orang yang lebih tua.</li><li><b>Salim</b> (mencium tangan) kepada guru dan orang tua.</li><li><b>Senyum</b> bisa berarti ramah, sungkan, bahkan menutupi malu.</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Perhatikan</h3><p>Di forum profesional atau dengan tamu asing, kontak mata yang wajar justru dibaca sebagai percaya diri dan jujur. Kenali konteksnya, lalu sesuaikan.</p><p class=\"muted\">Perbedaan budaya dibahas lebih dalam di Pertemuan 11.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep kunci</span><span>Indikator 2</span></div><h2>Enam hubungan verbal dan nonverbal</h2><div class=\"grid3\"><div class=\"card\"><h3>Menekankan</h3><p>Memberi tekanan pada kata tertentu: \"Kumpulkan <b>hari ini</b>,\" sambil mengetuk meja.</p></div><div class=\"card\"><h3>Melengkapi</h3><p>Menambah nuansa: minta maaf sambil wajah menyesal.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Bertentangan</h3><p>\"Saya tidak marah,\" dengan suara keras dan wajah tegang.</p></div><div class=\"card\"><h3>Mengatur</h3><p>Mengangkat tangan untuk meminta giliran bicara di rapat.</p></div><div class=\"card\"><h3>Mengulang</h3><p>\"Tiga hal,\" sambil mengacungkan tiga jari.</p></div><div class=\"card\"><h3>Menggantikan</h3><p>Mengangguk sebagai pengganti kata \"ya\".</p></div></div><p style=\"margin-top:.7em\">Pesan yang baik bersifat <button type=\"button\" class=\"term\" data-term=\"congruence\">selaras</button>: kata dan bahasa tubuh menyampaikan makna yang sama. Fungsi diadaptasi dari DeVito (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Berpikir kritis</span><span>Cek klaim populer</span></div><h2>Benarkah 93% komunikasi itu nonverbal?</h2><div class=\"cols w\"><div><p>Sering dikutip: <b>7%</b> kata-kata, <b>38%</b> nada suara, <b>55%</b> ekspresi wajah.</p><ul><li>Angka ini berasal dari eksperimen Mehrabian tentang pesan <b>perasaan suka atau tidak suka</b>, terutama ketika kata-kata <b>bertentangan</b> dengan nada dan ekspresi.</li><li>Mehrabian (1971) sendiri membatasi temuannya pada pesan tentang perasaan dan sikap.</li><li>Jadi angka itu <b>tidak</b> berlaku untuk semua komunikasi. Isi kata-kata tetap penting, mis. saat menjelaskan tenggat tugas.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Pelajaran</h3><p>Nonverbal sangat kuat saat menyampaikan perasaan. Tetapi jangan percaya angka populer tanpa mengecek sumber aslinya.</p><p class=\"muted\">Kebiasaan ini akan dilatih lagi di Pertemuan 9–10 (penulisan akademik dan sitasi).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan cepat</span><span>Berpasangan · 5 menit</span></div><h2>Selaras atau bertentangan?</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Situasi A · UMKM</h3><p>Admin toko daring menelepon pelanggan: \"Mohon maaf atas keterlambatannya, kak,\" dengan nada datar dan cepat sambil mengetik.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/></svg>Situasi B · Kampus</h3><p>Ketua kelompok membuka presentasi: \"Kami sangat antusias dengan proyek ini,\" sambil membaca slide dan tidak menatap audiens.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Situasi C · Pesantren</h3><p>Pengurus menyampaikan teguran kepada santri dengan suara pelan, duduk sejajar, dan menatap dengan tenang.</p></div></div><p class=\"lead\" style=\"margin-top:.8em\">Untuk tiap situasi: selaras atau bertentangan? Isyarat mana yang perlu diubah?</p><p class=\"muted\" style=\"font-size:.85em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bagian 3</span><span>Gaya komunikasi · indikator 3</span></div><h2>Pasif, agresif, atau asertif?</h2><p>Situasi: teman sekelompok belum mengerjakan bagiannya, padahal tenggat besok.</p><div class=\"tw\"><table class=\"t\"><thead><tr><th>Gaya</th><th>Ciri</th><th>Contoh kalimat</th><th>Dampak</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"passive\">Pasif</button></b></td><td>Memendam, mengalah, menghindar</td><td>\"Nggak apa-apa, biar aku saja yang kerjakan.\"</td><td>Beban menumpuk, kesal dipendam</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"aggressive\">Agresif</button></b></td><td>Menyerang pribadi, menyalahkan, memaksa</td><td>\"Kamu memang nggak bisa diandalkan!\"</td><td>Hubungan rusak, masalah tidak selesai</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"assertive\">Asertif</button></b></td><td>Jujur, jelas, santun, menghormati</td><td>\"Bagian analisis belum masuk. Aku khawatir kita telat. Bisa selesai jam 9 malam ini?\"</td><td>Masalah dibahas, hubungan terjaga</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.88em\">DeVito (2019) membahas gaya ini sebagai tingkat keasertifan pesan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Keterampilan</span><span>Menyusun pesan asertif</span></div><h2>Empat langkah pesan asertif</h2><div class=\"cols w\"><div><ol><li><b>Gambarkan</b> faktanya tanpa menuduh: \"Bagian analisis belum masuk ke folder.\"</li><li><b>Sampaikan dampaknya</b> dengan <button type=\"button\" class=\"term\" data-term=\"i-message\">pesan-saya</button>: \"Saya khawatir kita tidak sempat menggabungkan.\"</li><li><b>Usulkan solusi</b>: \"Bisa dikirim jam 9 malam ini? Kalau ada kendala, kita bagi lagi.\"</li><li><b>Pastikan pemahaman</b>: \"Bagaimana menurutmu?\"</li></ol><p class=\"muted\" style=\"font-size:.88em\">Diadaptasi dari langkah komunikasi asertif dalam DeVito (2019).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Pesan-kamu → pesan-saya</h3><table class=\"t\"><tbody><tr><td>\"Kamu selalu telat!\"</td><td>\"Saya jadi menunggu 30 menit dan rapat molor.\"</td></tr><tr><td>\"Kamu nggak pernah baca grup.\"</td><td>\"Saya bingung karena pesanku belum dijawab.\"</td></tr></tbody></table></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Nilai</span><span>Qaulan sadida · qaulan layyina</span></div><h2>Tegas dalam isi, lembut dalam cara</h2><div class=\"cols\"><div><blockquote class=\"callout qt\"><p class=\"ar\" lang=\"ar\" dir=\"rtl\">يٰٓاَيُّهَا الَّذِيْنَ اٰمَنُوا اتَّقُوا اللّٰهَ وَقُوْلُوْا قَوْلًا سَدِيْدًاۙ</p><p class=\"quote\">\"Wahai orang-orang yang beriman, bertakwalah kamu kepada Allah dan ucapkanlah perkataan yang benar.\"</p><div class=\"src\">QS. Al-Ahzab [33]: 70 · Terjemahan Kemenag RI (2019)</div></blockquote><blockquote class=\"callout qt\"><p class=\"ar\" lang=\"ar\" dir=\"rtl\">فَقُوْلَا لَهٗ قَوْلًا لَّيِّنًا لَّعَلَّهٗ يَتَذَكَّرُ اَوْ يَخْشٰى</p><p class=\"quote\">\"Berbicaralah kamu berdua kepadanya (Fir‘aun) dengan perkataan yang lemah lembut, mudah-mudahan dia sadar atau takut.\"</p><div class=\"src\">QS. Taha [20]: 44 · Terjemahan Kemenag RI (2019)</div></blockquote></div><div><ul><li><b>Perkataan yang benar</b> (<i>qaulan sadida</i>): jujur menyampaikan keberatan, tidak memendam atau berpura-pura setuju (sejalan dengan <button type=\"button\" class=\"term\" data-term=\"as-shidqu\">As Shidqu</button>).</li><li><b>Perkataan yang lembut</b> (<i>qaulan layyina</i>): bahkan kepada Fir'aun, Nabi Musa dan Harun diperintahkan berbicara lembut.</li><li>Kepada dosen, kiai, atau atasan: tetap asertif, tetapi pilih waktu dan tempat yang tepat, sebaiknya empat mata.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Role-play berpasangan · 25 menit</span></div><h2>Latihan respons asertif</h2><div class=\"cols\"><div><p><b>Cara kerja</b> (dua pasangan menjadi satu grup berempat, seperti Pertemuan 2):</p><ul><li><b>Pasangan A</b>: satu orang menyampaikan keberatan secara <b>asertif</b> (empat langkah), satu orang menjadi lawan bicara yang realistis (boleh membela diri).</li><li><b>Pasangan B</b> mengamati dan mengisi daftar periksa di slide berikutnya.</li><li>Tukar peran sampai semua orang pernah menyampaikan keberatan.</li></ul><p class=\"muted\">Perhatikan juga nada, wajah, dan postur Anda.</p></div><div class=\"grid4\" style=\"grid-template-columns:1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Skenario A · Kampus</h3><p>Teman sekelompok untuk kedua kalinya tidak hadir rapat kelompok Tugas 1 tanpa kabar.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/></svg>Skenario B · Instansi</h3><p>Saat magang di kantor desa, Anda terus diminta mengetik surat sehingga tugas utama (merapikan data penduduk) tertunda.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Skenario C · Pesantren</h3><p>Santri senior sering meminjam kitab Anda tanpa izin dan mengembalikannya terlambat.</p></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar periksa pengamat</span><span>Umpan balik sejawat</span></div><h2>Apakah pembicara sudah…?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Perilaku</th><th style=\"width:14%\">Ya</th><th style=\"width:14%\">Sebagian</th><th style=\"width:14%\">Belum</th></tr></thead><tbody><tr><td>Menggambarkan fakta tanpa menuduh</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Memakai pesan-saya untuk menyampaikan dampak</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Mengusulkan solusi yang jelas</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Memastikan pemahaman lawan bicara</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Nada, wajah, dan postur selaras dengan kata-kata</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Tetap tenang dan santun saat lawan bicara membela diri</td><td>○</td><td>○</td><td>○</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em\">Sampaikan satu hal yang sudah baik dan satu hal yang bisa ditingkatkan, dengan pesan-saya.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1 · Bagian 1</span><span>Rekaman role-play · 10%</span></div><h2>Apa yang harus terlihat dalam rekaman?</h2><div class=\"cols w\"><div><ol><li><b>Mendengar aktif</b>: parafrase dan klarifikasi.</li><li><b>Empati</b>: menamai perasaan lawan bicara.</li><li><b>Keselarasan</b>: kata, nada, wajah, dan postur sejalan.</li><li><b>Respons asertif</b>: empat langkah dan pesan-saya.</li><li><b>Kejujuran dan kesantunan</b> sepanjang percakapan.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2M12 19v3\"/></svg>Persiapan</h3><p>Pilih situasi dari organisasi yang diamati kelompok Anda (UMKM, instansi, atau pesantren). Susun naskah kasar, tetapi jangan dibaca saat merekam.</p><p class=\"muted\">Durasi, format, tenggat, dan rubrik ada di lembar tugas yang dibagikan terpisah.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Makna ada pada orang. Gunakan kata konkret dan perhatikan konotasi.</li><li>Pesan nonverbal mengalir lewat wajah, mata, tubuh, sentuhan, suara, jarak, artefak, dan waktu.</li><li>Nonverbal bisa menekankan, melengkapi, mengatur, mengulang, menggantikan, atau bertentangan. Usahakan selalu selaras.</li><li>Gaya asertif: jujur dan jelas tanpa menyerang. Pakai empat langkah dan pesan-saya.</li><li>Tegas dalam isi (<i>qaulan sadida</i>), lembut dalam cara (<i>qaulan layyina</i>).</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Paralinguistik: cara sesuatu diucapkan, bukan apa yang diucapkan.\"><p class=\"q\">Nada, volume, tempo, dan jeda saat berbicara termasuk saluran…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. proksemik</button><button type=\"button\" data-o=\"b\">B. paralinguistik</button><button type=\"button\" data-o=\"c\">C. haptik</button><button type=\"button\" data-o=\"d\">D. artefak</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Agresif: menyerang pribadi dan memakai kata &quot;nggak pernah&quot; yang memicu pembelaan diri.\"><p class=\"q\">\"Kamu memang nggak pernah bisa diandalkan!\" Kalimat ini termasuk gaya…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. pasif</button><button type=\"button\" data-o=\"b\">B. asertif</button><button type=\"button\" data-o=\"c\">C. agresif</button><button type=\"button\" data-o=\"d\">D. empatik</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Bertentangan: isyarat nonverbal membawa makna berlawanan dengan kata-kata, dan penerima cenderung memercayai isyaratnya.\"><p class=\"q\">Mahasiswa berkata \"Saya senang bergabung di tim ini\" sambil cemberut dan melipat tangan. Hubungan nonverbal dengan verbalnya adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. menekankan</button><button type=\"button\" data-o=\"b\">B. melengkapi</button><button type=\"button\" data-o=\"c\">C. bertentangan</button><button type=\"button\" data-o=\"d\">D. menggantikan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols c3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Latihan skenario asertif</h3><p>Pilih dua situasi nyata dari pengalaman Anda. Untuk masing-masing, tulis tiga respons: pasif, agresif, dan asertif (empat langkah). Bahasa Indonesia, maksimal satu halaman.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Jurnal refleksi</h3><p>Lanjutkan jurnal sampai 5 hari. Tambahkan catatan: kapan bahasa tubuh Anda tidak selaras dengan kata-kata?</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2M12 19v3\"/></svg>Tugas 1 · Bagian 1</h3><p>Bersama kelompok, rekam role-play sesuai lembar tugas.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Verbal message</span></dt><dd>Pesan yang memakai kata-kata, baik lisan maupun tulisan. <i>(pesan verbal)</i></dd></div><div><dt><span class=\"en\">Nonverbal message</span></dt><dd>Pesan tanpa kata: ekspresi wajah, tatapan, gerak tubuh, nada suara, jarak, sentuhan, penampilan, dan waktu. <i>(pesan nonverbal)</i></dd></div><div><dt><span class=\"en\">Denotation</span></dt><dd>Makna kamus sebuah kata yang relatif sama bagi semua orang. <i>(makna denotatif)</i></dd></div><div><dt><span class=\"en\">Connotation</span></dt><dd>Makna emosional atau penilaian yang melekat pada kata, bisa berbeda antarorang. <i>(makna konotatif)</i></dd></div><div><dt><span class=\"en\">Paralanguage</span></dt><dd>Cara sesuatu diucapkan: nada, volume, tempo, jeda, dan penekanan. <i>(paralinguistik)</i></dd></div><div><dt><span class=\"en\">Proxemics</span></dt><dd>Kajian tentang penggunaan jarak dan ruang dalam berkomunikasi. <i>(proksemik / jarak komunikasi)</i></dd></div><div><dt><span class=\"en\">Haptics</span></dt><dd>Komunikasi melalui sentuhan, mis. bersalaman. <i>(haptik / komunikasi sentuhan)</i></dd></div><div><dt><span class=\"en\">Chronemics</span></dt><dd>Makna yang muncul dari penggunaan waktu, mis. ketepatan waktu. <i>(kronemik / komunikasi waktu)</i></dd></div><div><dt><span class=\"en\">Congruence</span></dt><dd>Keselarasan antara pesan verbal dan nonverbal sehingga keduanya membawa makna yang sama. <i>(keselarasan pesan)</i></dd></div><div><dt><span class=\"en\">Passive style</span></dt><dd>Gaya yang memendam pendapat dan kebutuhan sendiri demi menghindari konflik. <i>(gaya pasif)</i></dd></div><div><dt><span class=\"en\">Aggressive style</span></dt><dd>Gaya yang memaksakan kehendak dan mengabaikan hak serta perasaan orang lain. <i>(gaya agresif)</i></dd></div><div><dt><span class=\"en\">Assertive style</span></dt><dd>Gaya yang menyampaikan pendapat dan kebutuhan secara jujur, jelas, dan santun sambil menghormati orang lain. <i>(gaya asertif)</i></dd></div><div><dt><span class=\"en\">I-message</span></dt><dd>Kalimat yang dimulai dari pengalaman dan perasaan diri (\"saya merasa…\"), bukan menuduh (\"kamu selalu…\"). <i>(pesan-saya)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>DeVito, J. A. (2019). <i>The interpersonal communication book</i> (15th ed.). Pearson.</li><li>Hall, E. T. (1966). <i>The hidden dimension</i>. Doubleday.</li><li>Mehrabian, A. (1971). <i>Silent messages</i>. Wadsworth.</li><li>Kementerian Agama Republik Indonesia. (2019). <i>Al-Qur'an dan terjemahannya</i> (Edisi penyempurnaan 2019). Lajnah Pentashihan Mushaf Al-Qur'an.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 4.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":4,"title":"Komunikasi Kelompok & Rapat","subtitle":"Peran dalam tim; agenda, notulen, tindak lanjut","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOG
