O__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 4</span><span>Communication Skill · SI24W32</span></div><h1>Komunikasi Kelompok &amp; Rapat</h1><p class=\"lead\">Peran dalam tim; agenda, notulen, tindak lanjut</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Belajar + simulasi rapat</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu berkomunikasi dalam kelompok secara kolaboratif, termasuk rapat, musyawarah, dan penyelesaian konflik (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1, 2, dan 4)</span></h3><ol><li>Keaktifan dan kualitas kontribusi dalam diskusi kelompok.</li><li>Kelengkapan agenda dan notulen rapat.</li><li>Ketepatan strategi penyelesaian konflik. <span class=\"muted\">(Pertemuan 5)</span></li><li>Kejelasan pembagian peran dan tanggung jawab.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menerapkan sikap jujur, amanah, taat norma, dan kolaboratif dalam komunikasi interpersonal, kerja tim, dan ruang digital.</dd><dt>CPL-1</dt><dd class=\"id\">Mampu mengintegrasikan sikap As Shidqu (kejujuran), Al Amanah Wal Wafa Bil Ahdi (bertanggung jawab), Al Adalah (selalu berpedoman pada norma dan peraturan yang berlaku) dan At Taawun (berkolaborasi) dalam perkembangan ilmu pengetahuan dan teknologi.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Observasi (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 3 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Sebutkan empat langkah pesan asertif.</li><li>Apa yang terjadi bila pesan verbal dan nonverbal bertentangan?</li><li>Ubah menjadi pesan-saya: \"Kamu nggak pernah datang rapat!\"</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Rapat yang melelahkan</h2><div class=\"cols w\"><div><p class=\"lead\">Ingat satu rapat (organisasi, kelas, pesantren, atau RT) yang terasa sia-sia.</p><ol><li>Apa yang membuatnya melelahkan?</li><li>Apakah ada agenda dan keputusan yang jelas?</li><li>Setelah rapat, apakah ada yang benar-benar dikerjakan?</li></ol><p class=\"muted\">Ceritakan kepada pasangan. Lalu 2–3 pasangan berbagi.</p></div><div class=\"chat\" aria-label=\"Contoh percakapan grup\"><div class=\"who\">Grup Panitia Seminar HIMA</div><div class=\"bub\">Nanti malam rapat ya, jam 8 😊<small>15.10</small></div><div class=\"bub me\">Bahas apa kak?<small>15.12</small></div><div class=\"bub\">Pokoknya seminar 🙏<small>15.40</small></div><div class=\"bub\">… (rapat selesai 22.30)<small>22.31</small></div><div class=\"bub me\">Jadi tugasku apa ya?<small>22.45</small></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span></div><h2>Kelompok belum tentu tim</h2><div class=\"cols wr\"><div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg><button type=\"button\" class=\"term\" data-term=\"small-group\">Kelompok kecil</button></h3><p>Sekitar 3–12 orang yang berinteraksi untuk tujuan bersama dan saling memengaruhi.</p><p class=\"muted\" style=\"font-size:.85em\">Definisi kerja mata kuliah ini</p></div><div class=\"callout\" style=\"margin-top:.8em\">Kelompok Tugas 1 Anda baru menjadi <b>tim</b> bila setiap anggota merasa ikut bertanggung jawab atas nilai kelompok, bukan hanya atas bagiannya sendiri.</div></div><div><h3 class=\"qh\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"team\">Tim</button></h3><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A team is a small number of people with complementary skills who are committed to a common purpose, performance goals, and approach for which they hold themselves mutually accountable.\"</p><p class=\"tr\">\"Tim adalah sejumlah kecil orang dengan keterampilan yang saling melengkapi yang berkomitmen pada tujuan bersama, sasaran kinerja, dan pendekatan yang untuknya mereka menganggap diri mereka saling bertanggung jawab.\"</p><div class=\"src\">Katzenbach &amp; Smith (1993); terjemahan harfiah penyusun</div></blockquote></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Model</span><span>Perkembangan kelompok</span></div><h2>Lima tahap <button type=\"button\" class=\"term\" data-term=\"group-development\">perkembangan kelompok</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 860 200\" role=\"img\" aria-label=\"Lima tahap perkembangan kelompok: forming, storming, norming, performing, adjourning, dengan contoh kelompok Tugas 1.\"><defs><marker id=\"ar7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"20\" width=\"148\" height=\"84\" rx=\"10\" class=\"s-soft\"/><text x=\"84\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 1</text><text x=\"84\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Forming</text><line x1=\"160\" y1=\"62\" x2=\"178\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar7)\"/><text x=\"84\" y=\"134\" text-anchor=\"middle\" class=\"s-s\">saling mengenal</text><text x=\"84\" y=\"164\" text-anchor=\"middle\" class=\"s-s\" style=\"font-style:italic\"><tspan x=\"84\">“Kenalan di</tspan><tspan x=\"84\" dy=\"20\">grup WA.”</tspan></text><rect x=\"182\" y=\"20\" width=\"148\" height=\"84\" rx=\"10\" class=\"s-acc\"/><text x=\"256\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 2</text><text x=\"256\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Storming</text><line x1=\"332\" y1=\"62\" x2=\"350\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar7)\"/><text x=\"256\" y=\"134\" text-anchor=\"middle\" class=\"s-s\">beda pendapat muncul</text><text x=\"256\" y=\"164\" text-anchor=\"middle\" class=\"s-s\" style=\"font-style:italic\"><tspan x=\"256\">“Rebutan</tspan><tspan x=\"256\" dy=\"20\">bagian tugas.”</tspan></text><rect x=\"354\" y=\"20\" width=\"148\" height=\"84\" rx=\"10\" class=\"s-soft\"/><text x=\"428\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 3</text><text x=\"428\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Norming</text><line x1=\"504\" y1=\"62\" x2=\"522\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar7)\"/><text x=\"428\" y=\"134\" text-anchor=\"middle\" class=\"s-s\">aturan disepakati</text><text x=\"428\" y=\"164\" text-anchor=\"middle\" class=\"s-s\" style=\"font-style:italic\"><tspan x=\"428\">“Sepakat jadwal</tspan><tspan x=\"428\" dy=\"20\">& peran.”</tspan></text><rect x=\"526\" y=\"20\" width=\"148\" height=\"84\" rx=\"10\" class=\"s-soft\"/><text x=\"600\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 4</text><text x=\"600\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Performing</text><line x1=\"676\" y1=\"62\" x2=\"694\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar7)\"/><text x=\"600\" y=\"134\" text-anchor=\"middle\" class=\"s-s\">bekerja efektif</text><text x=\"600\" y=\"164\" text-anchor=\"middle\" class=\"s-s\" style=\"font-style:italic\"><tspan x=\"600\">“Notulen &</tspan><tspan x=\"600\" dy=\"20\">rekaman jadi.”</tspan></text><rect x=\"698\" y=\"20\" width=\"148\" height=\"84\" rx=\"10\" class=\"s-soft\"/><text x=\"772\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 5</text><text x=\"772\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Adjourning</text><text x=\"772\" y=\"134\" text-anchor=\"middle\" class=\"s-s\">selesai & evaluasi</text><text x=\"772\" y=\"164\" text-anchor=\"middle\" class=\"s-s\" style=\"font-style:italic\"><tspan x=\"772\">“Refleksi usai</tspan><tspan x=\"772\" dy=\"20\">presentasi.”</tspan></text></svg><figcaption>Tahap perkembangan kelompok menurut Tuckman (1965); tahap adjourning ditambahkan oleh Tuckman &amp; Jensen (1977). Contoh di baris bawah adalah ilustrasi kelompok Tugas 1.</figcaption></figure><div class=\"callout\" style=\"margin-top:.5em\">Tahap <b>storming</b> itu wajar. Yang berbahaya adalah kelompok yang tidak pernah membicarakan perbedaannya.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peran fungsional</span><span>Benne &amp; Sheats (1948)</span></div><h2>Tiga jenis peran dalam kelompok</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"task-roles\">Peran tugas</button></h3><p>Membantu menyelesaikan pekerjaan.</p><ul><li>Pemberi usul</li><li>Pencari informasi</li><li>Perangkum</li><li>Pencatat</li></ul></div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg><button type=\"button\" class=\"term\" data-term=\"maintenance-roles\">Peran pemeliharaan</button></h3><p>Menjaga hubungan dan suasana.</p><ul><li>Penyemangat</li><li>Penengah</li><li>Penjaga giliran bicara</li><li>Pencari jalan tengah</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg><button type=\"button\" class=\"term\" data-term=\"individual-roles\">Peran individual</button></h3><p>Mementingkan diri, menghambat kelompok.</p><ul><li>Pendominasi</li><li>Penghalang (asal menolak)</li><li>Pencari perhatian</li><li>\"Penumpang\" pasif</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Indikator 4</span><span>Peran dan tanggung jawab</span></div><h2>Bagi peran secara jelas</h2><div class=\"cols w\"><div><div class=\"tw\"><table class=\"t\"><thead><tr><th>Peran formal</th><th>Tanggung jawab utama</th></tr></thead><tbody><tr><td><b>Koordinator</b></td><td>Memimpin rapat (<button type=\"button\" class=\"term\" data-term=\"facilitator\">fasilitator</button>), memantau progres</td></tr><tr><td><b>Notulis</b></td><td>Mencatat keputusan dan tindak lanjut, membagikan notulen</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"timekeeper\">Pengatur waktu</button></b></td><td>Menjaga agenda tepat waktu</td></tr><tr><td><b>Penghubung mitra</b></td><td>Berkomunikasi dengan organisasi yang diamati</td></tr><tr><td><b>Penanggung jawab berkas</b></td><td>Menyimpan dan menggabungkan dokumen kelompok</td></tr></tbody></table></div></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Pembagian yang baik</h3><ul><li>Tertulis dan disepakati bersama</li><li>Setiap tugas punya satu penanggung jawab</li><li>Ada tenggat yang jelas</li><li>Beban kerja kira-kira seimbang</li></ul><p class=\"muted\">Peran boleh dirotasi antarpertemuan.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Indikator 1</span><span>Kualitas kontribusi</span></div><h2>Kontribusi yang berkualitas</h2><div class=\"cols\"><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Lakukan</h3><ul><li>Sampaikan usul <b>beserta alasannya</b></li><li>Bangun ide orang lain: \"Menambahkan usul Rina…\"</li><li>Ajukan pertanyaan klarifikasi</li><li>Rangkum bila diskusi melebar</li><li>Ajak anggota yang diam untuk bicara</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Hindari</h3><ul><li>Mendominasi pembicaraan</li><li>Diam sepanjang rapat lalu protes di grup</li><li>Ngobrol sendiri atau sibuk dengan ponsel</li><li>Menyerang orang, bukan gagasannya</li><li>Mengulang usul yang sudah ditolak tanpa alasan baru</li></ul></div></div><p class=\"muted\" style=\"margin-top:.6em\">Keterampilan Pertemuan 2–3 (mendengar aktif, asertif) dipakai lagi di sini.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rapat efektif</span><span>Tiga fase</span></div><h2>Rapat dimulai sebelum rapat</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 200\" role=\"img\" aria-label=\"Siklus rapat efektif dalam tiga fase: sebelum rapat (tujuan, agenda, undangan), selama rapat (tepat waktu, ikuti agenda, catat keputusan), sesudah rapat (kirim notulen, pantau tindak lanjut, evaluasi).\"><defs><marker id=\"ar8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"240\" height=\"160\" rx=\"10\" class=\"s-soft\"/><text x=\"140\" y=\"46\" text-anchor=\"middle\" class=\"s-hd\">SEBELUM</text><text x=\"140\" y=\"72\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Persiapan</text><text x=\"140\" y=\"104\" text-anchor=\"middle\" class=\"s-s\">tentukan tujuan rapat</text><text x=\"140\" y=\"128\" text-anchor=\"middle\" class=\"s-s\">susun agenda + waktu</text><text x=\"140\" y=\"152\" text-anchor=\"middle\" class=\"s-s\">undang peserta yang tepat</text><line x1=\"264\" y1=\"100\" x2=\"301\" y2=\"100\" class=\"s-line\" marker-end=\"url(#ar8)\"/><rect x=\"305\" y=\"20\" width=\"240\" height=\"160\" rx=\"10\" class=\"s-soft\"/><text x=\"425\" y=\"46\" text-anchor=\"middle\" class=\"s-hd\">SELAMA</text><text x=\"425\" y=\"72\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Pelaksanaan</text><text x=\"425\" y=\"104\" text-anchor=\"middle\" class=\"s-s\">buka tepat waktu</text><text x=\"425\" y=\"128\" text-anchor=\"middle\" class=\"s-s\">ikuti agenda, atur giliran</text><text x=\"425\" y=\"152\" text-anchor=\"middle\" class=\"s-s\">catat keputusan</text><line x1=\"549\" y1=\"100\" x2=\"586\" y2=\"100\" class=\"s-line\" marker-end=\"url(#ar8)\"/><rect x=\"590\" y=\"20\" width=\"240\" height=\"160\" rx=\"10\" class=\"s-acc\"/><text x=\"710\" y=\"46\" text-anchor=\"middle\" class=\"s-hd\">SESUDAH</text><text x=\"710\" y=\"72\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Tindak lanjut</text><text x=\"710\" y=\"104\" text-anchor=\"middle\" class=\"s-s\">kirim notulen segera</text><text x=\"710\" y=\"128\" text-anchor=\"middle\" class=\"s-s\">pantau butir tindak lanjut</text><text x=\"710\" y=\"152\" text-anchor=\"middle\" class=\"s-s\">evaluasi jalannya rapat</text></svg><figcaption>Siklus rapat efektif, diadaptasi dari pembahasan rapat produktif dalam Bovée &amp; Thill (2021).</figcaption></figure><div class=\"callout\" style=\"margin-top:.5em\">Bila tujuannya hanya membagikan informasi, pertimbangkan cukup lewat pesan atau dokumen bersama, tanpa rapat.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Alat 1</span><span>Agenda</span></div><h2>Contoh <button type=\"button\" class=\"term\" data-term=\"agenda\">agenda</button> rapat</h2><div class=\"cols w\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg>Rapat Panitia Pelatihan Canva untuk UMKM · HIMA SI</h3><p class=\"muted\" style=\"font-size:.85em\">Kamis, 19.30–20.30 · Ruang 2.1 · Tujuan: menetapkan tanggal, pemateri, dan pembagian tugas</p><div class=\"tw\"><table class=\"t\"><thead><tr><th>Butir</th><th>Waktu</th><th>Pemandu</th></tr></thead><tbody><tr><td>1. Pembukaan, cek kehadiran</td><td>5 menit</td><td>Ketua</td></tr><tr><td>2. Penetapan tanggal acara</td><td>15 menit</td><td>Ketua</td></tr><tr><td>3. Usulan pemateri</td><td>15 menit</td><td>Sie Acara</td></tr><tr><td>4. Anggaran konsumsi</td><td>15 menit</td><td>Bendahara</td></tr><tr><td>5. Pembagian tugas, penutup</td><td>10 menit</td><td>Ketua</td></tr></tbody></table></div></div><div><ul><li>Ada <b>tujuan</b> yang jelas.</li><li>Setiap butir punya <b>waktu</b> dan <b>pemandu</b>.</li><li>Dibagikan <b>sebelum</b> rapat agar peserta bersiap.</li><li>Butir yang perlu keputusan didahulukan.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Kasus ilustrasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Alat 2</span><span>Notulen · indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"minutes\">Notulen</button>: catat keputusan, bukan semua ucapan</h2><div class=\"cols\"><div><h3>Komponen notulen</h3><ol><li>Identitas: nama rapat, hari/tanggal, waktu, tempat</li><li>Peserta: hadir, izin, pemimpin rapat, notulis</li><li>Agenda yang dibahas</li><li>Pokok bahasan singkat per butir</li><li><b>Keputusan</b> per butir</li><li><b>Tindak lanjut</b>: siapa, apa, kapan</li></ol></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Contoh satu butir</h3><p><b>Butir 2. Tanggal acara</b><br>Dibahas: dua usulan, 8 atau 15 November. Tanggal 8 bentrok dengan kegiatan kampus.<br><b>Keputusan:</b> acara Sabtu, 15 November.<br><b>Tindak lanjut:</b> Dina mengajukan peminjaman aula paling lambat Senin.</p><p class=\"muted\" style=\"font-size:.85em\">Kasus ilustrasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Alat 3</span><span>Tindak lanjut</span></div><h2>Siapa, apa, kapan</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Siapa</th><th>Apa</th><th>Kapan</th></tr></thead><tbody><tr><td>Dina</td><td>Ajukan peminjaman aula</td><td>Senin, 12.00</td></tr><tr><td>Fajar</td><td>Hubungi dua calon pemateri</td><td>Rabu</td></tr><tr><td>Salsa</td><td>Rincian anggaran konsumsi</td><td>Kamis, sebelum rapat</td></tr></tbody></table></div><div class=\"chat\" aria-label=\"Contoh pesan tindak lanjut di grup\"><div class=\"who\">Grup Panitia Pelatihan Canva</div><div class=\"bub me\">Assalamualaikum. Notulen rapat tadi terlampir. Tindak lanjut: (1) Dina, aula, Senin 12.00; (2) Fajar, pemateri, Rabu; (3) Salsa, anggaran, Kamis. Mohon konfirmasi 👍<small>21.05</small></div><div class=\"bub\">Siap, aula Senin 👍<small>21.07</small></div></div></div><p style=\"margin-top:.6em\">Setiap <button type=\"button\" class=\"term\" data-term=\"action-item\">butir tindak lanjut</button> harus punya <b>satu nama</b>, <b>pekerjaan yang konkret</b>, dan <b>tenggat</b>.</p><p class=\"muted\" style=\"font-size:.85em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Nilai</span><span>At Taawun · Al Amanah</span></div><h2>Bekerja sama dan menunaikan amanah</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"ar\" lang=\"ar\" dir=\"rtl\">…وَتَعَاوَنُوْا عَلَى الْبِرِّ وَالتَّقْوٰىۖ وَلَا تَعَاوَنُوْا عَلَى الْاِثْمِ وَالْعُدْوَانِ…</p><p class=\"quote\">\"…Tolong-menolonglah kamu dalam (mengerjakan) kebajikan dan takwa, dan jangan tolong-menolong dalam berbuat dosa dan permusuhan…\"</p><div class=\"src\">QS. Al-Ma'idah [5]: 2 (potongan) · Terjemahan Kemenag RI (2019)</div></blockquote><blockquote class=\"callout qt\"><p class=\"ar\" lang=\"ar\" dir=\"rtl\">اِنَّ اللّٰهَ يَأْمُرُكُمْ اَنْ تُؤَدُّوا الْاَمٰنٰتِ اِلٰٓى اَهْلِهَاۙ…</p><p class=\"quote\">\"Sesungguhnya Allah menyuruh kamu menyampaikan amanah kepada pemiliknya. …\"</p><div class=\"src\">QS. An-Nisa' [4]: 58 (potongan) · Terjemahan Kemenag RI (2019)</div></blockquote></div><div><ul><li><button type=\"button\" class=\"term\" data-term=\"at-taawun\">At Taawun</button>: membantu anggota yang tertinggal, berbagi informasi, bukan berlomba menonjolkan diri.</li><li>Tolong-menolong dalam kebaikan, <b>bukan</b> dalam keburukan: membantu mengerjakan bagian teman berbeda dengan menutupi teman yang tidak bekerja.</li><li><button type=\"button\" class=\"term\" data-term=\"al-amanah\">Al Amanah</button>: peran dan tugas dari rapat adalah titipan yang harus ditunaikan tepat waktu.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Simulasi rapat · 30 menit · kelompok 6–8 orang</span></div><h2>Simulasi rapat organisasi</h2><div class=\"cols\"><div><p><b>Pilih satu skenario:</b></p><div class=\"card\" style=\"margin-bottom:.6em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>A · Himpunan mahasiswa</h3><p>HIMA SI merencanakan pelatihan desain Canva untuk UMKM sekitar kampus. Tetapkan tanggal, pemateri, anggaran, dan pembagian tugas.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/></svg>B · Takmir masjid</h3><p>Takmir merencanakan kajian rutin remaja masjid dan pendaftarannya lewat formulir daring. Tetapkan jadwal, penanggung jawab, dan cara promosi.</p></div></div><div><p><b>Peran:</b></p><ul><li>Ketua rapat (fasilitator)</li><li>Notulis</li><li>Pengatur waktu</li><li>Peserta, masing-masing mendapat kartu peran fungsional rahasia (mis. penyemangat, pendominasi, penghalang)</li><li>1–2 pengamat dari kelompok lain</li></ul><p class=\"muted\">Langkah: 5 menit menyusun agenda → 20 menit rapat → 5 menit notulis membacakan keputusan dan tindak lanjut.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Lembar observasi</span><span>Untuk pengamat</span></div><h2>Apa yang diamati?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Perilaku yang diamati</th><th style=\"width:14%\">Ya</th><th style=\"width:14%\">Sebagian</th><th style=\"width:14%\">Belum</th></tr></thead><tbody><tr><td>Rapat dibuka dengan tujuan dan agenda yang jelas</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Setiap butir agenda selesai dengan keputusan</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Ketua memberi giliran bicara secara adil</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Peserta menyampaikan usul beserta alasannya</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Ada peserta yang menjalankan peran pemeliharaan (menengahi, menyemangati)</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Notulis mencatat keputusan dan tindak lanjut siapa-apa-kapan</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Peran dan tanggung jawab setelah rapat jelas</td><td>○</td><td>○</td><td>○</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em\">Sampaikan satu hal yang sudah baik dan satu yang bisa ditingkatkan, dengan pesan-saya.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1 · Bagian 2</span><span>Notulen simulasi rapat · 10%</span></div><h2>Notulen dan rencana kerja kelompok</h2><div class=\"cols c3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg>Notulen</h3><p>Notulen simulasi rapat organisasi dengan komponen lengkap, termasuk keputusan dan tindak lanjut siapa-apa-kapan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Rencana kerja</h3><p>Pembagian peran dan tanggung jawab kelompok Tugas 1 sampai presentasi di Pertemuan 6–7.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Observasi</h3><p>Dosen mengamati kontribusi dan peran Anda selama simulasi rapat di Pertemuan 4–5.</p></div></div><p class=\"muted\" style=\"margin-top:.8em\">Format, tenggat, dan rubrik ada di lembar tugas yang dibagikan terpisah.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Tim berbeda dari kelompok: anggotanya saling bertanggung jawab atas hasil bersama.</li><li>Kelompok berkembang lewat forming, storming, norming, performing, adjourning.</li><li>Kontribusi berkualitas mencakup peran tugas dan peran pemeliharaan; hindari peran individual.</li><li>Rapat efektif punya tiga fase: persiapan (agenda), pelaksanaan, dan tindak lanjut (notulen).</li><li>Setiap tindak lanjut: siapa, apa, kapan. Itu wujud At Taawun dan Al Amanah.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Storming: perbedaan pendapat dan perebutan peran muncul; wajar dan perlu dibicarakan.\"><p class=\"q\">Anggota berselisih soal pembagian tugas. Menurut Tuckman (1965), ini tahap…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. forming</button><button type=\"button\" data-o=\"b\">B. storming</button><button type=\"button\" data-o=\"c\">C. norming</button><button type=\"button\" data-o=\"d\">D. performing</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Peran pemeliharaan (penjaga giliran bicara): menjaga partisipasi dan suasana kelompok.\"><p class=\"q\">\"Kita dengar dulu pendapat Rina, yuk.\" Anggota ini menjalankan peran…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. tugas</button><button type=\"button\" data-o=\"b\">B. pemeliharaan</button><button type=\"button\" data-o=\"c\">C. individual</button><button type=\"button\" data-o=\"d\">D. notulis</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Notulen bukan transkrip. Keputusan dan tindak lanjut membuat semua orang tahu apa yang harus dikerjakan.\"><p class=\"q\">Bagian notulen terpenting bagi anggota yang tidak hadir adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. seluruh ucapan peserta</button><button type=\"button\" data-o=\"b\">B. keputusan dan tindak lanjut siapa-apa-kapan</button><button type=\"button\" data-o=\"c\">C. pendapat pribadi notulis</button><button type=\"button\" data-o=\"d\">D. daftar hadir saja</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols c3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Rapikan notulen</h3><p>Notulis tiap kelompok merapikan notulen simulasi hari ini dengan komponen lengkap. Anggota lain memeriksa dan memberi masukan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Rencana kerja Tugas 1</h3><p>Adakan rapat kelompok (tatap muka atau daring) dengan agenda tertulis. Hasilkan pembagian peran dan jadwal kerja sampai Pertemuan 7, lengkap dengan notulennya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian tentang rapat yang produktif dalam Bovée &amp; Thill (2021), <i>Business Communication Today</i>.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Small group</span></dt><dd>Sekumpulan kecil orang (sekitar 3–12) yang berinteraksi untuk tujuan bersama dan saling memengaruhi. <i>(kelompok kecil)</i></dd></div><div><dt><span class=\"en\">Team</span></dt><dd>Kelompok kecil dengan keahlian yang saling melengkapi, berkomitmen pada tujuan dan cara kerja bersama, serta saling bertanggung jawab atas hasilnya. <i>(tim)</i></dd></div><div><dt><span class=\"en\">Group development</span></dt><dd>Tahap-tahap yang dilalui kelompok dari saling mengenal sampai bekerja efektif: forming, storming, norming, performing, adjourning. <i>(perkembangan kelompok)</i></dd></div><div><dt><span class=\"en\">Task roles</span></dt><dd>Peran yang membantu kelompok menyelesaikan tugas, mis. memberi usul, mencari informasi, merangkum, mencatat. <i>(peran tugas)</i></dd></div><div><dt><span class=\"en\">Maintenance roles</span></dt><dd>Peran yang menjaga hubungan dan suasana kelompok, mis. menyemangati, menengahi, memberi giliran bicara. <i>(peran pemeliharaan)</i></dd></div><div><dt><span class=\"en\">Individual roles</span></dt><dd>Peran yang mementingkan diri sendiri dan menghambat kelompok, mis. mendominasi, menolak tanpa alasan, mencari perhatian. <i>(peran individual (penghambat))</i></dd></div><div><dt><span class=\"en\">Agenda</span></dt><dd>Daftar butir yang akan dibahas dalam rapat, lengkap dengan tujuan, urutan, dan perkiraan waktu. <i>(agenda / acara rapat)</i></dd></div><div><dt><span class=\"en\">Minutes</span></dt><dd>Catatan resmi rapat yang memuat peserta, pokok bahasan, keputusan, dan tindak lanjut. <i>(notulen / risalah rapat)</i></dd></div><div><dt><span class=\"en\">Action item</span></dt><dd>Tugas hasil rapat yang jelas siapa pelaksananya, apa yang dikerjakan, dan kapan tenggatnya. <i>(butir tindak lanjut)</i></dd></div><div><dt><span class=\"en\">Facilitator</span></dt><dd>Orang yang memimpin jalannya rapat agar sesuai agenda, adil dalam giliran bicara, dan sampai pada keputusan. <i>(pemimpin rapat / fasilitator)</i></dd></div><div><dt><span class=\"en\">Timekeeper</span></dt><dd>Anggota yang menjaga agar setiap butir agenda selesai sesuai waktu yang disepakati. <i>(pengatur waktu)</i></dd></div><div><dt><span class=\"en\">At Taawun</span></dt><dd>Sikap saling menolong dan bekerja sama dalam kebaikan; salah satu nilai inti Unusida (CPL-1). <i>(tolong-menolong / kolaborasi)</i></dd></div><div><dt><span class=\"en\">Al Amanah</span></dt><dd>Sikap dapat dipercaya dan menunaikan tanggung jawab yang diberikan; bagian dari nilai Al Amanah Wal Wafa Bil Ahdi (CPL-1). <i>(amanah / tanggung jawab)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Benne, K. D., &amp; Sheats, P. (1948). Functional roles of group members. <i>Journal of Social Issues, 4</i>(2), 41–49.</li><li>Bovée, C. L., &amp; Thill, J. V. (2021). <i>Business communication today</i> (15th ed.). Pearson.</li><li>Katzenbach, J. R., &amp; Smith, D. K. (1993). <i>The wisdom of teams: Creating the high-performance organization</i>. Harvard Business School Press.</li><li>Kementerian Agama Republik Indonesia. (2019). <i>Al-Qur'an dan terjemahannya</i> (Edisi penyempurnaan 2019). Lajnah Pentashihan Mushaf Al-Qur'an.</li><li>Tuckman, B. W. (1965). Developmental sequence in small groups. <i>Psychological Bulletin, 63</i>(6), 384–399.</li><li>Tuckman, B. W., &amp; Jensen, M. A. C. (1977). Stages of small-group development revisited. <i>Group &amp; Organization Studies, 2</i>(4), 419–427.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 5.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":5,"title":"Musyawarah & Manajemen Konflik","subtitle":"Gaya dan strategi konflik, tahap penyelesaian, musyawarah mufakat","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 5</span><span>Communication Skill · SI24W32</span></div><h1>Musyawarah &amp; Manajemen Konflik</h1><p class=\"lead\">Gaya dan strategi konflik, tahap penyelesaian, musyawarah mufakat</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Simulasi interaktif + musyawarah</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu berkomunikasi dalam kelompok secara kolaboratif, termasuk rapat, musyawarah, dan penyelesaian konflik (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: fokus indikator 3; 1, 2, 4 dipraktikkan di simulasi)</span></h3><ol><li>Keaktifan dan kualitas kontribusi dalam diskusi kelompok.</li><li>Kelengkapan agenda dan notulen rapat.</li><li><b>Ketepatan strategi penyelesaian konflik.</b></li><li>Kejelasan pembagian peran dan tanggung jawab.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menerapkan sikap jujur, amanah, taat norma, dan kolaboratif dalam komunikasi interpersonal, kerja tim, dan ruang digital.</dd><dt>CPL-1</dt><dd class=\"id\">Mampu mengintegrasikan sikap As Shidqu (kejujuran), Al Amanah Wal Wafa Bil Ahdi (bertanggung jawab), Al Adalah (selalu berpedoman pada norma dan peraturan yang berlaku) dan At Taawun (berkolaborasi) dalam perkembangan ilmu pengetahuan dan teknologi.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Observasi (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 4 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Pada tahap apa kelompok mulai berbeda pendapat dan berebut peran?</li><li>Sebutkan dua contoh peran pemeliharaan.</li><li>Perbaiki tindak lanjut ini: \"Nanti dibahas lagi soal anggarannya.\"</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Grup yang mendadak sepi</h2><div class=\"cols w\"><div class=\"chat\" aria-label=\"Contoh percakapan grup kelompok tugas\"><div class=\"who\">Kelompok 3 · Tugas 1</div><div class=\"bub\">Teman-teman, notulen kemarin aku yang ngetik lagi ya 🙂<small>19.02</small></div><div class=\"bub me\">Lho, kan kita sepakat gantian?<small>19.10</small></div><div class=\"bub\">Iya, tapi yang lain nggak gerak. Aku capek jadi tukang semua 😤<small>19.11</small></div><div class=\"bub\">Kok nyindir? Aku kan kerja juga 🙄<small>19.25</small></div><div class=\"bub\">…<small>(grup sepi tiga hari)</small></div></div><div><ol><li>Apa sebenarnya yang dipersoalkan?</li><li>Apa yang membuat percakapan memanas?</li><li>Apa akibatnya bila grup terus diam?</li></ol><p class=\"muted\">Diskusikan dengan pasangan, lalu 2–3 pasangan berbagi.</p><p class=\"muted\" style=\"font-size:.85em\">Kasus ilustrasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>DeVito (2019)</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"interpersonal-conflict\">konflik antarpribadi</button>?</h2><div class=\"callout\">Ketidaksepakatan antara orang-orang yang saling terhubung, misalnya rekan satu tim, tentang tujuan, gagasan, atau cara yang dirasa tidak bisa berjalan bersamaan. <span class=\"muted\" style=\"font-size:.85em\">Diadaptasi dari DeVito (2019).</span></div><div class=\"cols\" style=\"margin-top:.8em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg><button type=\"button\" class=\"term\" data-term=\"content-conflict\">Konflik isi</button></h3><p>Tentang fakta, rencana, atau keputusan.</p><p class=\"muted\" style=\"font-size:.88em\">\"Rotasi notulis tidak berjalan.\"</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg><button type=\"button\" class=\"term\" data-term=\"relationship-conflict\">Konflik hubungan</button></h3><p>Tentang dihargai atau tidak, siapa yang berwenang, kesetaraan.</p><p class=\"muted\" style=\"font-size:.88em\">\"Aku merasa disindir.\"</p></div></div><p style=\"margin-top:.7em\">Konflik bisa <b>merusak</b> (saling menyerang, menghindar) atau <b>produktif</b> (masalah menjadi jelas, muncul solusi baru). Yang menentukan adalah <b>cara mengelolanya</b>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Geser titik atau slider</span></div><h2>Lima gaya menghadapi konflik</h2><div class=\"sim sim-grid2\" data-sim=\"grid2\" data-cfg=\"{&quot;id&quot;:&quot;p5-gaya&quot;,&quot;aria&quot;:&quot;Simulasi gaya konflik. Sumbu mendatar perhatian pada kepentingan sendiri, sumbu tegak perhatian pada kepentingan orang lain. Lima zona: competing, avoiding, accommodating, collaborating, compromising.&quot;,&quot;x&quot;:{&quot;label&quot;:&quot;Perhatian pada kepentingan sendiri&quot;},&quot;y&quot;:{&quot;label&quot;:&quot;Perhatian pada kepentingan orang lain&quot;},&quot;init&quot;:[8,2],&quot;zones&quot;:[{&quot;k&quot;:&quot;cp&quot;,&quot;en&quot;:&quot;Compromising&quot;,&quot;name&quot;:&quot;Kompromi&quot;,&quot;tag&quot;:&quot;menang sebagian, kalah sebagian&quot;,&quot;r&quot;:[3,7,4,6],&quot;v&quot;:[2.6,7.4,3.6,6.4],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Jalan tengah: setiap pihak mendapat sebagian dan merelakan sebagian. Cepat dan terasa adil, tetapi bisa tidak ada yang puas sepenuhnya.&quot;,&quot;ex&quot;:&quot;\\&quot;Separuh kas untuk toilet, separuh untuk sound system.\\&quot;&quot;},{&quot;k&quot;:&quot;cl&quot;,&quot;en&quot;:&quot;Collaborating&quot;,&quot;name&quot;:&quot;Kolaborasi&quot;,&quot;tag&quot;:&quot;saya menang, kamu menang&quot;,&quot;r&quot;:[5,10,5,10],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Menggali kebutuhan kedua pihak lalu mencari solusi yang memenuhi keduanya. Butuh waktu dan keterbukaan; paling sejalan dengan musyawarah mufakat.&quot;,&quot;ex&quot;:&quot;\\&quot;Apa yang sebenarnya kita butuhkan masing-masing? Kita cari jalan yang memenuhi dua-duanya.\\&quot;&quot;},{&quot;k&quot;:&quot;co&quot;,&quot;en&quot;:&quot;Competing&quot;,&quot;name&quot;:&quot;Bersaing&quot;,&quot;tag&quot;:&quot;saya menang, kamu kalah&quot;,&quot;r&quot;:[5,10,0,5],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Mementingkan kebutuhan sendiri. Keputusan cepat, tetapi pihak lain merasa kalah dan hubungan bisa rusak.&quot;,&quot;ex&quot;:&quot;\\&quot;Pokoknya pakai usul saya, titik.\\&quot;&quot;},{&quot;k&quot;:&quot;ac&quot;,&quot;en&quot;:&quot;Accommodating&quot;,&quot;name&quot;:&quot;Mengalah&quot;,&quot;tag&quot;:&quot;saya kalah, kamu menang&quot;,&quot;r&quot;:[0,5,5,10],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Mengalah demi orang lain atau demi menjaga hubungan. Wajar untuk hal kecil, tetapi bila terus-menerus, kebutuhan sendiri terabaikan dan bisa menumpuk menjadi kesal.&quot;,&quot;ex&quot;:&quot;\\&quot;Ya sudah, terserah kalian saja.\\&quot;&quot;},{&quot;k&quot;:&quot;av&quot;,&quot;en&quot;:&quot;Avoiding&quot;,&quot;name&quot;:&quot;Menghindar&quot;,&quot;tag&quot;:&quot;saya kalah, kamu kalah&quot;,&quot;r&quot;:[0,5,0,5],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Persoalan tidak dibahas atau terus ditunda. Konflik tidak selesai dan biasanya muncul lagi lebih besar.&quot;,&quot;ex&quot;:&quot;Diam di rapat, lalu keluar dari grup WhatsApp.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Gaya konflik dan akibatnya, diadaptasi dari DeVito (2019) yang merujuk Blake &amp; Mouton. Posisi zona adalah penyederhanaan untuk simulasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Indikator 3</span><span>DeVito (2019)</span></div><h2>Strategi konflik: merusak atau produktif?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th style=\"width:36%\">Strategi tidak produktif</th><th style=\"width:36%\">Strategi produktif</th><th>Contoh di rapat</th></tr></thead><tbody><tr><td><b>Win-lose</b>: harus ada yang kalah</td><td><b><button type=\"button\" class=\"term\" data-term=\"win-win\">Win-win</button></b>: cari solusi untuk semua</td><td>Mencari dana tambahan agar dua usul terlaksana</td></tr><tr><td><b>Avoidance</b>: diam, pergi, menunda</td><td><b>Active fighting</b>: terlibat membahas</td><td>\"Kita selesaikan di rapat ini, ya.\"</td></tr><tr><td><b>Force</b>: memaksa, mengancam</td><td><b>Talk</b>: berbicara dan mendengar</td><td>Bukan \"Kalau nggak setuju, keluar saja!\"</td></tr><tr><td><b>Face-detracting</b>: merendahkan</td><td><b><button type=\"button\" class=\"term\" data-term=\"face-enhancing\">Face-enhancing</button></b>: menjaga harga diri</td><td>\"Usul Mas Fajar penting untuk remaja…\"</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"verbal-aggressiveness\">Verbal aggressiveness</button></b>: menyerang pribadi</td><td><b><button type=\"button\" class=\"term\" data-term=\"argumentativeness\">Argumentativeness</button></b>: membahas gagasan dengan alasan</td><td>Bukan \"Kamu kan anak baru\"</td></tr></tbody></table></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Model</span><span>Tekan Play atau klik tiap tahap</span></div><h2>Lima tahap manajemen konflik</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p5-tahap&quot;,&quot;ms&quot;:3200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Definisikan konflik&quot;,&quot;en&quot;:&quot;Define the conflict&quot;,&quot;d&quot;:&quot;Rumuskan persoalan secara spesifik dan pisahkan isi dari hubungan. Dengarkan sudut pandang setiap pihak; pakai pesan-saya, bukan tuduhan.&quot;,&quot;ex&quot;:&quot;\\&quot;Kas Rp12 juta hanya cukup untuk salah satu: renovasi tempat wudu (Rp10 juta) atau sound system (Rp9 juta).\\&quot;&quot;},{&quot;t&quot;:&quot;Telaah solusi&quot;,&quot;en&quot;:&quot;Examine possible solutions&quot;,&quot;d&quot;:&quot;Kumpulkan sebanyak mungkin alternatif, lalu timbang untung-rugi setiap alternatif bagi semua pihak.&quot;,&quot;ex&quot;:&quot;Wudu dulu, sound bulan depan; sewa sound saat kajian; galang dana khusus; minta bantuan alumni.&quot;},{&quot;t&quot;:&quot;Uji solusi&quot;,&quot;en&quot;:&quot;Test the solution&quot;,&quot;d&quot;:&quot;Coba solusi terpilih dalam praktik, sebaiknya dulu dalam skala kecil atau untuk jangka waktu tertentu.&quot;,&quot;ex&quot;:&quot;Renovasi wudu dikerjakan; selama sebulan kajian remaja memakai sound sewaan sambil galang dana.&quot;},{&quot;t&quot;:&quot;Evaluasi solusi&quot;,&quot;en&quot;:&quot;Evaluate the solution&quot;,&quot;d&quot;:&quot;Periksa apakah solusi benar-benar mengurangi persoalan dan apakah semua pihak dapat menerimanya.&quot;,&quot;ex&quot;:&quot;Rapat evaluasi sebulan kemudian: dana terkumpul 60%, remaja masjid tetap aktif.&quot;},{&quot;t&quot;:&quot;Terima atau tolak&quot;,&quot;en&quot;:&quot;Accept or reject the solution&quot;,&quot;d&quot;:&quot;Bila berhasil, tetapkan sebagai keputusan. Bila tidak, kembali ke tahap telaah solusi.&quot;,&quot;ex&quot;:&quot;Galang dana diteruskan dua bulan; dicatat di notulen dengan siapa-apa-kapan.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Tahap manajemen konflik menurut DeVito (2019). Contoh: kasus ilustrasi takmir masjid.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario interaktif</span><span>Anda koordinator kelompok</span></div><h2>Rapat daring yang memanas</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;p5-skenario&quot;,&quot;start&quot;:&quot;s1&quot;,&quot;ask&quot;:&quot;Apa respons Anda sebagai koordinator?&quot;,&quot;nodes&quot;:{&quot;s1&quot;:{&quot;text&quot;:&quot;Rapat kelompok Tugas 1 lewat Google Meet, tiga hari sebelum tenggat notulen.&quot;,&quot;say&quot;:[[&quot;Rina&quot;,&quot;Aku capek. Dari awal aku terus yang ngerjain. Andi bahkan nggak pernah buka dokumennya!&quot;],[&quot;Andi&quot;,&quot;Ya kalian nggak pernah bilang bagianku yang mana!&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;\\&quot;Sudah, jangan ribut. Sisanya biar saya saja yang kerjakan.\\&quot;&quot;,&quot;tag&quot;:&quot;Mengalah&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;e_alah&quot;,&quot;fb&quot;:&quot;Rapat tenang sesaat, tetapi persoalannya tidak dibahas. Beban pindah ke Anda, dan Rina serta Andi tetap saling kesal (accommodating sekaligus avoidance).&quot;},{&quot;t&quot;:&quot;\\&quot;Andi, kamu memang nggak bertanggung jawab.\\&quot;&quot;,&quot;tag&quot;:&quot;Menyerang pribadi&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;s_esk&quot;,&quot;fb&quot;:&quot;Ini verbal aggressiveness dan face-detracting. Andi merasa diserang di depan teman-temannya.&quot;},{&quot;t&quot;:&quot;\\&quot;Dua-duanya ada benarnya. Masalah kita: pembagian bagian belum jelas. Setuju kalau itu yang kita selesaikan dulu?\\&quot;&quot;,&quot;tag&quot;:&quot;Definisikan konflik&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;s_def&quot;,&quot;fb&quot;:&quot;Tepat. Anda mengakui perasaan kedua pihak (face-enhancing) dan merumuskan masalah isi secara spesifik: tahap 1 manajemen konflik.&quot;}]},&quot;s_esk&quot;:{&quot;text&quot;:&quot;Andi keluar dari ruang Meet.&quot;,&quot;say&quot;:[[&quot;Andi&quot;,&quot;Ya sudah, kerjain aja sendiri!&quot;],[&quot;Rina&quot;,&quot;Tuh kan.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Kirim pesan pribadi ke Andi: minta maaf atas kalimat tadi dan ajak bicara lagi besok.&quot;,&quot;tag&quot;:&quot;Memperbaiki hubungan&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;s_def&quot;,&quot;fb&quot;:&quot;Langkah baik untuk memperbaiki konflik hubungan. Esok harinya Andi bersedia ikut rapat lagi, dan Anda mulai dari merumuskan masalah.&quot;},{&quot;t&quot;:&quot;Biarkan saja; laporkan Andi ke dosen.&quot;,&quot;tag&quot;:&quot;Melapor tanpa bicara&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;e_lapor&quot;,&quot;fb&quot;:&quot;Melapor kadang perlu, tetapi tanpa mencoba berbicara langsung, Andi tidak pernah diberi kesempatan memperbaiki diri.&quot;}]},&quot;s_def&quot;:{&quot;text&quot;:&quot;Rina dan Andi mulai tenang.&quot;,&quot;say&quot;:[[&quot;Rina&quot;,&quot;Oke. Tapi aku nggak mau beban kerjanya timpang lagi.&quot;],[&quot;Andi&quot;,&quot;Aku mau kerja, asal jelas bagianku dan tenggatnya.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;\\&quot;Kita voting saja, siapa mengerjakan apa.\\&quot;&quot;,&quot;tag&quot;:&quot;Voting terlalu cepat&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;e_vote&quot;,&quot;fb&quot;:&quot;Voting sah bila mufakat tidak tercapai, tetapi di sini belum ada satu pun alternatif yang dibahas.&quot;},{&quot;t&quot;:&quot;\\&quot;Coba masing-masing usul satu cara membagi sisa tugas, lalu kita bandingkan.\\&quot;&quot;,&quot;tag&quot;:&quot;Telaah solusi&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;s_sol&quot;,&quot;fb&quot;:&quot;Tepat. Ini tahap 2: mengumpulkan alternatif sebelum memutuskan, sehingga semua merasa didengar.&quot;}]},&quot;s_sol&quot;:{&quot;text&quot;:&quot;Muncul dua usul: Andi mengerjakan wawancara mitra dan merapikan format, Rina menyusun isi notulen.&quot;,&quot;say&quot;:[[&quot;Andi&quot;,&quot;Wawancara aku yang pegang, sekalian aku yang hubungi narasumbernya.&quot;],[&quot;Rina&quot;,&quot;Setuju. Aku fokus isi notulen.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;\\&quot;Sip, berarti beres ya. Rapat selesai!\\&quot;&quot;,&quot;tag&quot;:&quot;Tanpa uji dan evaluasi&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;e_beres&quot;,&quot;fb&quot;:&quot;Ada solusi, tetapi tidak dicatat dan tidak ada waktu untuk mengecek apakah berjalan.&quot;},{&quot;t&quot;:&quot;\\&quot;Saya catat di notulen: siapa, apa, kapan. Jumat malam kita cek progresnya 15 menit.\\&quot;&quot;,&quot;tag&quot;:&quot;Uji dan evaluasi&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;e_baik&quot;,&quot;fb&quot;:&quot;Tepat. Solusi diuji dalam praktik dan dijadwalkan untuk dievaluasi: tahap 3–5.&quot;}]},&quot;e_alah&quot;:{&quot;end&quot;:&quot;Anda begadang menyelesaikan bagian Andi. Notulen jadi, tetapi Rina dan Andi masih saling diam, dan Anda mulai kesal kepada keduanya. Konflik akan muncul lagi di tugas berikutnya.&quot;,&quot;title&quot;:&quot;Akhir: masalah tertunda&quot;,&quot;k&quot;:&quot;bad&quot;},&quot;e_lapor&quot;:{&quot;end&quot;:&quot;Dosen meminta kelompok menyelesaikannya lebih dulu secara langsung. Waktu terbuang dua hari dan hubungan kelompok semakin renggang.&quot;,&quot;title&quot;:&quot;Akhir: konflik meluas&quot;,&quot;k&quot;:&quot;bad&quot;},&quot;e_vote&quot;:{&quot;end&quot;:&quot;Andi kalah suara dan mendapat bagian yang paling berat. Ia mengerjakannya dengan setengah hati. Tugas selesai, tetapi kelompok belum menjadi tim.&quot;,&quot;title&quot;:&quot;Akhir: selesai, tetapi rapuh&quot;,&quot;k&quot;:&quot;mid&quot;},&quot;e_beres&quot;:{&quot;end&quot;:&quot;Dua hari kemudian Andi lupa tenggat wawancara karena tidak tercatat. Kelompok kembali panik di malam terakhir.&quot;,&quot;title&quot;:&quot;Akhir: hampir berhasil&quot;,&quot;k&quot;:&quot;mid&quot;},&quot;e_baik&quot;:{&quot;end&quot;:&quot;Jumat malam semua bagian berjalan; Andi bahkan menawarkan diri mengecek ejaan notulen. Kelompok Anda bergerak dari storming ke norming.&quot;,&quot;title&quot;:&quot;Akhir: konflik menjadi produktif&quot;,&quot;k&quot;:&quot;good&quot;}}}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Nilai</span><span>Musyawarah · At Taawun</span></div><h2>Putuskan dengan musyawarah</h2><div class=\"cols wq\"><div><blockquote class=\"callout qt\"><p class=\"ar\" lang=\"ar\" dir=\"rtl\">…وَاَمْرُهُمْ شُوْرٰى بَيْنَهُمْۖ…</p><p class=\"quote\">\"…sedangkan urusan mereka (diputuskan) dengan musyawarah di antara mereka…\"</p><div class=\"src\">QS. Asy-Syura [42]: 38 (potongan) · Terjemahan Kemenag RI (2019)</div></blockquote><blockquote class=\"callout qt\"><p class=\"ar\" lang=\"ar\" dir=\"rtl\">…فَاعْفُ عَنْهُمْ وَاسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِى الْاَمْرِۚ فَاِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللّٰهِ…</p><p class=\"quote\">\"…Oleh karena itu, maafkanlah mereka, mohonkanlah ampunan untuk mereka, dan bermusyawarahlah dengan mereka dalam segala urusan (penting). Kemudian, apabila engkau telah membulatkan tekad, bertawakallah kepada Allah…\"</p><div class=\"src\">QS. Ali 'Imran [3]: 159 (potongan) · Terjemahan Kemenag RI (2019)</div></blockquote></div><div style=\"font-size:.92em\"><ul><li>Musyawarah bukan sekadar voting: semua pihak didengar lebih dulu.</li><li>QS 3:159: bermusyawarah disertai sikap memaafkan.</li><li>Sesudah diputuskan, dijalankan dengan tekad bulat.</li><li>Sila keempat Pancasila: \"Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan.\"</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemandu</span><span>Definisi kerja mata kuliah ini</span></div><h2>Langkah <button type=\"button\" class=\"term\" data-term=\"musyawarah-mufakat\">musyawarah mufakat</button> di rapat</h2><div class=\"cols w\"><ol class=\"lead\" style=\"font-size:1em\"><li><b>Buka</b>: ketua menyampaikan persoalan, tujuan, dan cara memutuskan bila mufakat tidak tercapai.</li><li><b>Dengar</b>: setiap pihak menyampaikan usul beserta alasan; ketua menjaga giliran bicara.</li><li><b>Cari titik temu</b>: apa kepentingan bersama? Adakah alternatif yang memenuhi semua?</li><li><b>Putuskan</b>: mufakat; bila tidak tercapai setelah dibahas, suara terbanyak sesuai kesepakatan awal.</li><li><b>Jalankan dan catat</b>: semua pihak menjalankan keputusan, termasuk yang kalah suara; notulis mencatat siapa-apa-kapan.</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Peran ketua rapat saat konflik</h3><ul><li>Pisahkan orang dari persoalan</li><li>Rangkum dua pendapat secara adil</li><li>Tanyakan kebutuhan di balik usul</li><li>Tawarkan jeda bila suasana memanas</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Simulasi musyawarah · 30 menit · kelompok 6–8 orang</span></div><h2>Simulasi musyawarah organisasi</h2><div class=\"cols\"><div><div class=\"card\" style=\"margin-bottom:.6em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/></svg>A · Takmir Masjid Al-Hidayah</h3><p>Kas Rp12 juta. Usulan: renovasi tempat wudu (Rp10 juta), sound system dan proyektor untuk kajian remaja (Rp9 juta), honor tambahan ustazah TPQ (Rp4 juta). Putuskan bersama.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>B · HIMA SI</h3><p>Dana kegiatan semester Rp8 juta. Usulan: seminar nasional AI (Rp7 juta), bakti sosial digital ke pesantren (Rp5 juta), lomba desain UI antarmahasiswa baru (Rp3 juta).</p></div><p class=\"muted\" style=\"font-size:.85em;margin-top:.5em\">Kasus ilustrasi.</p></div><div><p><b>Peran:</b></p><ul><li>Ketua rapat (fasilitator)</li><li>Notulis dan pengatur waktu</li><li>3 pengusul, masing-masing dengan kartu peran rahasia</li><li>Peserta lain</li><li>Pengamat: isi penilaian sejawat di slide berikutnya</li></ul><p class=\"muted\">5 menit agenda → 20 menit musyawarah → 5 menit notulis membacakan keputusan dan tindak lanjut.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Umpan balik untuk rekan</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;p5-sejawat&quot;,&quot;title&quot;:&quot;Penilaian sejawat · Simulasi musyawarah (Communication Skill P5)&quot;,&quot;levels&quot;:[&quot;Belum tampak&quot;,&quot;Mulai tampak&quot;,&quot;Tampak&quot;,&quot;Menonjol&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Rekan yang dinilai (nama/peran)&quot;,&quot;whoPh&quot;:&quot;mis. Dimas · ketua rapat&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik yang Anda lihat&quot;,&quot;tipLabel&quot;:&quot;Saran (pakai pesan-saya)&quot;,&quot;tipPh&quot;:&quot;\\&quot;Saya merasa… akan lebih baik bila…\\&quot;&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu banyak latihan&quot;},{&quot;min&quot;:8,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:11,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:14,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Kontribusi gagasan&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Hampir tidak menyampaikan usul atau pendapat.&quot;,&quot;Menyampaikan usul, tetapi tanpa alasan atau di luar agenda.&quot;,&quot;Menyampaikan usul yang relevan beserta alasannya.&quot;,&quot;Usul relevan dan beralasan, serta membangun gagasan rekan lain.&quot;]},{&quot;t&quot;:&quot;Mendengar dan memberi ruang&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Sering memotong atau sibuk sendiri.&quot;,&quot;Mendengarkan, tetapi kadang memotong atau mendominasi.&quot;,&quot;Mendengarkan sampai selesai dan menanggapi isinya.&quot;,&quot;Aktif memberi giliran kepada yang diam dan merangkum pendapat.&quot;]},{&quot;t&quot;:&quot;Penyelesaian konflik&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Menghindar terus atau menyerang pribadi.&quot;,&quot;Membela posisi sendiri tanpa mencari titik temu.&quot;,&quot;Fokus pada masalah, memakai pesan-saya, mau mencari jalan tengah.&quot;,&quot;Mendorong solusi menang-menang dan menjaga harga diri semua pihak.&quot;]},{&quot;t&quot;:&quot;Tanggung jawab peran&quot;,&quot;ind&quot;:&quot;Indikator 4&quot;,&quot;d&quot;:[&quot;Tidak menjalankan peran yang disepakati.&quot;,&quot;Menjalankan sebagian peran atau perlu sering diingatkan.&quot;,&quot;Menjalankan peran dengan baik.&quot;,&quot;Menjalankan peran dengan baik dan membantu rekan menunaikan tugasnya.&quot;]}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.5em\">Isian hanya tersimpan di perangkat Anda. Tekan Copy summary, lalu kirim ke rekan yang dinilai.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Konflik itu wajar; bedakan konflik isi dan konflik hubungan.</li><li>Lima gaya konflik punya akibat masing-masing; untuk keputusan penting, utamakan kolaborasi.</li><li>Pilih strategi produktif: win-win, active fighting, talk, face-enhancing, argumentativeness.</li><li>Ikuti tahap: definisikan, telaah solusi, uji, evaluasi, terima atau tolak.</li><li>Musyawarah: dengar semua pihak, cari titik temu, jalankan keputusan bersama (Al Amanah).</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · satu per satu</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p5-kuis&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Dua anggota berdebat apakah poster acara memakai warna hijau atau biru. Ini terutama konflik…&quot;,&quot;o&quot;:[&quot;isi&quot;,&quot;hubungan&quot;,&quot;nilai&quot;,&quot;antarbudaya&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Yang dipersoalkan adalah pilihan atau keputusan (warna), bukan hubungan antarpribadi.&quot;},{&quot;q&quot;:&quot;\\&quot;Ya sudah, terserah kalian saja,\\&quot; kata Rina, padahal ia tidak setuju. Gaya konfliknya…&quot;,&quot;o&quot;:[&quot;competing&quot;,&quot;avoiding&quot;,&quot;accommodating&quot;,&quot;collaborating&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Rina mengalah demi orang lain (saya kalah, kamu menang). Bila terus-menerus, kekesalannya bisa menumpuk.&quot;},{&quot;q&quot;:&quot;Menurut DeVito (2019), tahap pertama manajemen konflik adalah…&quot;,&quot;o&quot;:[&quot;examine possible solutions&quot;,&quot;define the conflict&quot;,&quot;test the solution&quot;,&quot;accept or reject the solution&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Masalah dirumuskan dulu secara spesifik sebelum membahas solusi.&quot;},{&quot;q&quot;:&quot;\\&quot;Usulmu nggak masuk akal, kamu kan anak baru.\\&quot; Kalimat ini contoh…&quot;,&quot;o&quot;:[&quot;argumentativeness&quot;,&quot;verbal aggressiveness&quot;,&quot;face-enhancing&quot;,&quot;active fighting&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Kalimat ini menyerang pribadi (status anak baru), bukan membahas gagasannya dengan alasan.&quot;},{&quot;q&quot;:&quot;Setelah semua alternatif dibahas, musyawarah belum mencapai mufakat dan waktu habis. Langkah paling tepat…&quot;,&quot;o&quot;:[&quot;Ketua memutuskan sendiri tanpa memberi tahu&quot;,&quot;Rapat ditunda tanpa batas waktu&quot;,&quot;Suara terbanyak sesuai kesepakatan awal, lalu dicatat di notulen&quot;,&quot;Pihak yang kalah suara boleh tidak menjalankan keputusan&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Suara terbanyak sah setelah musyawarah ditempuh; keputusannya mengikat semua pihak dan dicatat.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols c3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg>Notulen musyawarah</h3><p>Rapikan notulen simulasi hari ini: keputusan, cara konflik diselesaikan, dan tindak lanjut siapa-apa-kapan (Tugas 1 Bagian 2).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Rencana kerja final</h3><p>Rapat kelompok untuk menetapkan rencana kerja sampai presentasi Pertemuan 6–7, dengan notulen dan langkah musyawarah.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Persiapan Pertemuan 6: bab analisis audiens dalam Lucas (2020). Ulangi simulasi dan skenario di materi ini.</p></div></div><p class=\"muted\" style=\"margin-top:.8em\">Format, tenggat, dan rubrik ada di lembar tugas yang dibagikan terpisah.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Interpersonal conflict</span></dt><dd>Ketidaksepakatan antara orang-orang yang saling terhubung (mis. rekan satu tim) tentang tujuan, gagasan, atau cara. <i>(konflik antarpribadi)</i></dd></div><div><dt><span class=\"en\">Content conflict</span></dt><dd>Konflik tentang fakta, rencana, atau keputusan, mis. memilih tanggal acara. <i>(konflik isi)</i></dd></div><div><dt><span class=\"en\">Relationship conflict</span></dt><dd>Konflik tentang hubungan: dihargai atau tidak, siapa berwenang, kesetaraan. <i>(konflik hubungan)</i></dd></div><div><dt><span class=\"en\">Competing</span></dt><dd>Gaya konflik yang mementingkan kebutuhan sendiri dan kurang memedulikan orang lain (\"saya menang, kamu kalah\"). <i>(bersaing)</i></dd></div><div><dt><span class=\"en\">Avoiding</span></dt><dd>Gaya konflik yang kurang memedulikan kebutuhan sendiri maupun orang lain; persoalan dihindari atau ditunda. <i>(menghindar)</i></dd></div><div><dt><span class=\"en\">Accommodating</span></dt><dd>Gaya konflik yang mengalah demi kebutuhan orang lain atau demi menjaga hubungan (\"saya kalah, kamu menang\"). <i>(mengalah / mengakomodasi)</i></dd></div><div><dt><span class=\"en\">Collaborating</span></dt><dd>Gaya konflik yang memedulikan kebutuhan kedua pihak dan mencari solusi yang memenuhi keduanya (\"saya menang, kamu menang\"). <i>(berkolaborasi)</i></dd></div><div><dt><span class=\"en\">Compromising</span></dt><dd>Gaya konflik jalan tengah: masing-masing pihak mendapat sebagian dan merelakan sebagian. <i>(kompromi)</i></dd></div><div><dt><span class=\"en\">Win-win strategy</span></dt><dd>Strategi mencari solusi yang menguntungkan semua pihak, bukan hanya satu pihak. <i>(strategi menang-menang)</i></dd></div><div><dt><span class=\"en\">Face-enhancing</span></dt><dd>Menjaga harga diri lawan bicara, mis. mengakui usahanya; lawannya face-detracting. <i>(menjaga muka / harga diri)</i></dd></div><div><dt><span class=\"en\">Argumentativeness</span></dt><dd>Kesediaan memperdebatkan gagasan dengan alasan dan bukti, tanpa menyerang pribadi; lawan dari verbal aggressiveness. <i>(argumentatif (sehat))</i></dd></div><div><dt><span class=\"en\">Verbal aggressiveness</span></dt><dd>Menyerang pribadi lawan bicara (karakter, kemampuan, penampilan) alih-alih membahas gagasannya. <i>(agresivitas verbal)</i></dd></div><div><dt><span class=\"en\">Musyawarah mufakat</span></dt><dd>Pembahasan bersama untuk mencapai kesepakatan bulat; bila tidak tercapai, dapat dengan suara terbanyak. <i>(musyawarah untuk mufakat)</i></dd></div><div><dt><span class=\"en\">Peer assessment</span></dt><dd>Penilaian oleh rekan dengan kriteria jelas, untuk umpan balik dan refleksi. <i>(penilaian sejawat)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Bovée, C. L., &amp; Thill, J. V. (2021). <i>Business communication today</i> (15th ed.). Pearson.</li><li>DeVito, J. A. (2019). <i>The interpersonal communication book</i> (15th ed.). Pearson.</li><li>Kementerian Agama Republik Indonesia. (2019). <i>Al-Qur'an dan terjemahannya</i> (Edisi penyempurnaan 2019). Lajnah Pentashihan Mushaf Al-Qur'an.</li><li>Lucas, S. E. (2020). <i>The art of public speaking</i> (13th ed.). McGraw-Hill Education.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 6.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":6,"title":"Merancang Presentasi","subtitle":"Analisis audiens, struktur, storytelling, desain slide","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 6</span><span>Communication Skill · SI24W32</span></div><h1>Merancang Presentasi</h1><p class=\"lead\">Analisis audiens, struktur, storytelling, desain slide</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 6–7 · Sub-CPMK-4</div><div><b>Hari ini</b>Merancang + gladi kerangka</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-4 · Pertemuan 6–7</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu merancang dan menyampaikan presentasi lisan yang logis, sistematis, dan didukung media visual (C3–C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: 1–3)</span></h3><ol><li><b>Kejelasan struktur pembuka, isi, dan penutup.</b></li><li><b>Kelogisan argumen dan dukungan data.</b></li><li><b>Keterbacaan desain slide.</b></li><li>Penguasaan vokal, kontak mata, dan bahasa tubuh. <span class=\"muted\">(Pertemuan 7)</span></li><li>Ketepatan menjawab pertanyaan. <span class=\"muted\">(Pertemuan 7)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-2</dt><dd>Mahasiswa mampu menyusun dan menyampaikan pesan lisan dan tulisan secara logis, kritis, dan sistematis dengan memperhatikan keberagaman budaya audiens.</dd><dt>CPL-6</dt><dd class=\"id\">Mampu menerapkan pemikiran logis, kritis, sistematis, dan inovatif dalam pengembangan serta implementasi sistem informasi, dengan memperhatikan nilai humaniora dan keberagaman budaya.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Proyek (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 6–7</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 5 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa beda konflik isi dan konflik hubungan?</li><li>Sebutkan lima tahap manajemen konflik menurut DeVito (2019).</li><li>Dalam musyawarah, kapan suara terbanyak boleh dipakai?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Presentasi yang membuat mengantuk</h2><div class=\"cols w\"><div><p class=\"lead\">Ingat satu presentasi (kuliah, seminar, sambutan, ceramah) yang membuat Anda mengantuk, dan satu yang membuat Anda menyimak sampai akhir.</p><ol><li>Apa bedanya di bagian awal?</li><li>Apakah Anda tahu ke mana arah pembicaraannya?</li><li>Apa yang Anda ingat sampai sekarang?</li></ol><p class=\"muted\">Ceritakan kepada pasangan, lalu 2–3 pasangan berbagi.</p></div><div class=\"card\" style=\"font-size:.78em\"><div class=\"eyebrow\" style=\"margin:0 0 .4em\"><span class=\"chip\">Slide 2 dari 31</span></div><h3 style=\"margin:.1em 0 .3em\">HASIL OBSERVASI KOMUNIKASI DI ORGANISASI</h3><p style=\"margin:0;line-height:1.35\">Komunikasi adalah proses penyampaian pesan dari komunikator kepada komunikan melalui media tertentu sehingga menimbulkan efek tertentu. Dalam organisasi, komunikasi sangat penting karena organisasi terdiri atas banyak orang yang harus bekerja sama untuk mencapai tujuan. Berdasarkan hasil observasi yang dilakukan oleh kelompok kami pada tanggal … di … kami menemukan bahwa komunikasi yang terjadi masih kurang efektif karena berbagai faktor baik internal maupun eksternal yang akan kami jelaskan pada slide-slide berikutnya…</p><p class=\"muted\" style=\"margin:.4em 0 0;font-size:.85em\">Contoh slide yang perlu diperbaiki (ilustrasi).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Lucas (2020)</span></div><h2>Mulai dari audiens, bukan dari slide</h2><div class=\"cols w\"><div><p>Pembicara yang baik bersikap <button type=\"button\" class=\"term\" data-term=\"audience-centered\">berpusat pada audiens</button>: setiap keputusan (isi, contoh, bahasa, slide) diambil dengan memikirkan siapa yang mendengarkan.</p><p>Tiga pertanyaan saat merancang:</p><ol><li>Kepada <b>siapa</b> saya berbicara?</li><li>Apa yang saya ingin mereka <b>ketahui, yakini, atau lakukan</b>?</li><li>Bagaimana cara <b>paling efektif</b> menyampaikannya kepada mereka?</li></ol><p class=\"muted\" style=\"font-size:.85em\">Diadaptasi dari Lucas (2020).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg><button type=\"button\" class=\"term\" data-term=\"audience-analysis\">Analisis audiens</button></h3><p><b><button type=\"button\" class=\"term\" data-term=\"demographic-analysis\">Demografis</button></b>: usia, latar pendidikan, budaya, agama, keanggotaan kelompok.</p><p><b><button type=\"button\" class=\"term\" data-term=\"situational-analysis\">Situasional</button></b>: jumlah audiens, tempat, waktu, serta sikap audiens terhadap topik, pembicara, dan acara.</p><p class=\"muted\" style=\"font-size:.85em\">Audiens Tugas 1C: teman sekelas dan dosen.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Geser titik atau slider</span></div><h2>Menyesuaikan strategi dengan audiens</h2><div class=\"sim sim-grid2\" data-sim=\"grid2\" data-cfg=\"{&quot;id&quot;:&quot;p6-audiens&quot;,&quot;aria&quot;:&quot;Simulasi analisis audiens. Sumbu mendatar pengetahuan audiens tentang topik, sumbu tegak minat audiens. Empat zona dengan strategi berbeda.&quot;,&quot;x&quot;:{&quot;label&quot;:&quot;Pengetahuan audiens tentang topik&quot;},&quot;y&quot;:{&quot;label&quot;:&quot;Minat audiens pada topik&quot;},&quot;init&quot;:[2,2],&quot;zones&quot;:[{&quot;k&quot;:&quot;ll&quot;,&quot;en&quot;:&quot;Awam, enggan&quot;,&quot;name&quot;:&quot;Bangun minat, lalu jelaskan dasar&quot;,&quot;tag&quot;:&quot;mis. warga RT diajak memakai aplikasi lapor sampah&quot;,&quot;r&quot;:[0,5,0,5],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Tunjukkan dulu mengapa topik penting bagi mereka (manfaat, masalah sehari-hari). Pakai bahasa awam dan sedikit istilah. Satu contoh dekat lebih baik daripada banyak teori.&quot;,&quot;ex&quot;:&quot;Pembuka: \\&quot;Berapa kali sebulan sampah di depan rumah terlambat diangkut?\\&quot;&quot;},{&quot;k&quot;:&quot;lh&quot;,&quot;en&quot;:&quot;Awam, antusias&quot;,&quot;name&quot;:&quot;Jelaskan langkah demi langkah&quot;,&quot;tag&quot;:&quot;mis. mahasiswa baru di pengenalan sistem akademik&quot;,&quot;r&quot;:[0,5,5,10],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Audiens ingin tahu, tetapi belum punya dasar. Susun penjelasan berurutan, beri contoh dan visual, cek pemahaman, dan hindari loncatan.&quot;,&quot;ex&quot;:&quot;Pola kronologis: daftar KRS, cek tagihan, cetak KRS.&quot;},{&quot;k&quot;:&quot;hl&quot;,&quot;en&quot;:&quot;Paham, bosan&quot;,&quot;name&quot;:&quot;Beri sudut pandang baru&quot;,&quot;tag&quot;:&quot;mis. dosen mendengar presentasi topik yang sudah sering ia dengar&quot;,&quot;r&quot;:[5,10,0,5],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Jangan mengulang yang sudah mereka tahu. Langsung ke temuan, data, atau kasus baru yang membuat mereka melihat topik secara berbeda.&quot;,&quot;ex&quot;:&quot;\\&quot;Teorinya Anda sudah tahu. Yang belum: 9 dari 40 pesanan di UMKM ini salah paham karena satu kebiasaan kecil.\\&quot;&quot;},{&quot;k&quot;:&quot;hh&quot;,&quot;en&quot;:&quot;Paham, antusias&quot;,&quot;name&quot;:&quot;Masuk ke kedalaman&quot;,&quot;tag&quot;:&quot;mis. rapat tim teknis yang sedang menunggu hasil uji&quot;,&quot;r&quot;:[5,10,5,10],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Audiens siap untuk detail, data, dan diskusi. Ringkas pengantar, perbanyak bukti dan implikasi, siapkan diri untuk pertanyaan tajam.&quot;,&quot;ex&quot;:&quot;Tampilkan data lengkap dan bandingkan dua alternatif rekomendasi.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Pengetahuan dan minat sebagai bagian disposisi audiens terhadap topik, diadaptasi dari Lucas (2020). Pembagian empat zona adalah penyederhanaan untuk simulasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Indikator 2</span><span>Lucas (2020)</span></div><h2>Tujuan dan gagasan sentral</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th style=\"width:22%\">Unsur</th><th>Contoh Tugas 1C (kasus ilustrasi)</th></tr></thead><tbody><tr><td><b>Topik</b></td><td>Komunikasi pemesanan lewat WhatsApp di UMKM Keripik Tempe Bu Sari, Sidoarjo</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"general-purpose\">Tujuan umum</button></b></td><td>Menginformasikan (dengan rekomendasi)</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"specific-purpose\">Tujuan khusus</button></b></td><td>Agar audiens memahami penyebab salah paham pesanan di UMKM Bu Sari dan dua cara sederhana menguranginya.</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"central-idea\">Gagasan sentral</button></b></td><td>Salah paham pesanan di UMKM Bu Sari terutama terjadi karena pesan pelanggan tidak lengkap dan tidak dikonfirmasi ulang; format pesanan dan konfirmasi ulang dapat menguranginya.</td></tr></tbody></table></div><div class=\"cols\" style=\"ma
