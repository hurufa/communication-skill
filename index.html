const GLOSSARY={"communication":{"t":"Communication","d":"Proses menciptakan makna bersama melalui pesan, baik verbal maupun nonverbal.","id":"komunikasi"},"sender":{"t":"Sender","d":"Pihak yang memulai dan menyampaikan pesan; disebut juga source.","id":"pengirim / komunikator"},"receiver":{"t":"Receiver","d":"Pihak yang menerima lalu menafsirkan pesan.","id":"penerima / komunikan"},"message":{"t":"Message","d":"Isi yang ingin disampaikan: kata-kata, nada suara, gerak tubuh, gambar, atau emoji.","id":"pesan"},"channel":{"t":"Channel","d":"Jalur yang dilalui pesan: tatap muka, telepon, WhatsApp, email.","id":"saluran / media"},"feedback":{"t":"Feedback","d":"Respons penerima yang menunjukkan bagaimana pesan dipahami.","id":"umpan balik"},"noise":{"t":"Noise","d":"Apa pun yang mengganggu pesan sehingga makna yang diterima berbeda dari yang dimaksud.","id":"gangguan"},"context":{"t":"Context","d":"Situasi di sekitar komunikasi: tempat, waktu, budaya, dan hubungan antarpihak.","id":"konteks"},"encoding":{"t":"Encoding","d":"Mengubah gagasan menjadi kata, simbol, atau tindakan.","id":"penyandian"},"decoding":{"t":"Decoding","d":"Mengubah kata, simbol, atau tindakan kembali menjadi makna.","id":"penafsiran pesan"},"jargon":{"t":"Jargon","d":"Istilah khusus suatu kelompok atau bidang yang sering tidak dipahami orang luar.","id":"istilah teknis / bahasa khusus"},"model":{"t":"Model","d":"Gambaran sederhana tentang cara kerja suatu proses.","id":"model"},"irreversible":{"t":"Irreversible","d":"Tidak dapat ditarik kembali. Pesan yang sudah diterima tidak bisa dihapus dari ingatan penerima.","id":"tidak dapat ditarik kembali"},"interpersonal":{"t":"Interpersonal communication","d":"Interaksi verbal dan nonverbal antara dua orang (atau sedikit lebih) yang saling bergantung.","id":"komunikasi antarpribadi"},"self-concept":{"t":"Self-concept","d":"Gambaran yang Anda miliki tentang siapa diri Anda.","id":"konsep diri"},"self-esteem":{"t":"Self-esteem","d":"Penilaian Anda tentang seberapa berharga diri Anda.","id":"harga diri"},"self-disclosure":{"t":"Self-disclosure","d":"Mengungkapkan informasi tentang diri sendiri yang sebelumnya tidak diketahui orang lain.","id":"pengungkapan diri"},"johari":{"t":"Johari Window","d":"Model empat area kesadaran diri: open, blind, hidden, dan unknown.","id":"Jendela Johari"},"perception":{"t":"Perception","d":"Proses memilih, menata, dan menafsirkan apa yang kita lihat dan dengar.","id":"persepsi"},"perception-checking":{"t":"Perception checking","d":"Memastikan tafsiran kita dengan menggambarkan apa yang diamati lalu menanyakannya langsung.","id":"pengecekan persepsi"},"stereotype":{"t":"Stereotype","d":"Gambaran yang tetap dan disederhanakan tentang seluruh anggota suatu kelompok.","id":"stereotip"},"primacy":{"t":"Primacy effect","d":"Kecenderungan informasi yang datang pertama paling kuat memengaruhi penilaian kita.","id":"efek kesan pertama"},"self-serving":{"t":"Self-serving bias","d":"Kecenderungan mengaitkan keberhasilan dengan diri sendiri dan kegagalan dengan faktor luar.","id":"bias melayani diri"},"self-fulfilling":{"t":"Self-fulfilling prophecy","d":"Dugaan yang menjadi kenyataan karena kita bertindak seolah-olah dugaan itu sudah benar.","id":"ramalan yang memenuhi dirinya sendiri"},"hearing":{"t":"Hearing","d":"Proses fisik ketika bunyi masuk ke telinga. Terjadi otomatis.","id":"mendengar (secara fisik)"},"listening":{"t":"Listening","d":"Proses mental aktif: menerima, memahami, mengingat, menilai, dan merespons pesan.","id":"menyimak / mendengarkan"},"active-listening":{"t":"Active listening","d":"Mendengarkan dengan perhatian penuh dan menunjukkan kepada pembicara bahwa Anda memahaminya.","id":"mendengar aktif"},"paraphrase":{"t":"Paraphrase","d":"Mengungkapkan kembali gagasan pembicara dengan kata-kata sendiri untuk memastikan pemahaman.","id":"parafrase"},"empathy":{"t":"Empathy","d":"Memahami perasaan orang lain dari sudut pandang orang itu.","id":"empati"},"sympathy":{"t":"Sympathy","d":"Merasa kasihan terhadap orang lain dari sudut pandang diri sendiri.","id":"simpati / rasa iba"},"as-shidqu":{"t":"As Shidqu","d":"Kejujuran dalam ucapan dan perbuatan; salah satu nilai inti Unusida (CPL-1).","id":"kejujuran"}};
const QUOTES=[{"q":"The great enemy of communication, we find, is the illusion of it.","a":"William H. Whyte","s":"\"Is Anybody Listening?\", Fortune, 1950"},{"q":"One cannot not communicate.","a":"Paul Watzlawick, Janet Beavin & Don Jackson","s":"Pragmatics of Human Communication, 1967"},{"q":"Most people do not listen with the intent to understand; they listen with the intent to reply.","a":"Stephen R. Covey","s":"The 7 Habits of Highly Effective People, 1989"},{"q":"Whoever believes in Allah and the Last Day, let him speak good or remain silent.","a":"Prophet Muhammad ﷺ","s":"Sahih al-Bukhari 6018; Sahih Muslim 47"},{"q":"We have two ears and one mouth, so that we may listen more and speak less.","a":"Zeno of Citium","s":"Diogenes Laertius, Lives of Eminent Philosophers, VII.23"}];
const MEETINGS=[{"no":1,"title":"Apa Itu Komunikasi?","subtitle":"Konsep, unsur, model, dan hambatan komunikasi","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 1</span><span>Communication Skill · SI24W32</span></div><h1>Apa Itu Komunikasi?</h1><p class=\"lead\">Konsep, unsur, model, dan hambatan komunikasi</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Program Studi</b>Sistem Informasi, Unusida</div><div><b>Semester</b>1 · 2 SKS</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-1</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan konsep, unsur, model, dan hambatan komunikasi (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian </h3><ol><li>Ketepatan menjelaskan unsur dan proses komunikasi.</li><li>Ketepatan membedakan model komunikasi linier, interaksional, dan transaksional.</li><li>Ketepatan mengidentifikasi hambatan komunikasi pada kasus.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-2</dt><dd>Mahasiswa mampu menyusun dan menyampaikan pesan lisan dan tulisan secara logis, kritis, dan sistematis dengan memperhatikan keberagaman budaya audiens.</dd><dt>CPL-6</dt><dd class=\"id\">Mampu menerapkan pemikiran logis, kritis, sistematis, dan inovatif dalam pengembangan serta implementasi sistem informasi, dengan memperhatikan nilai humaniora dan keberagaman budaya.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Tes Tulis (UTS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta perkuliahan</span><span>16 pertemuan · 2 SKS</span></div><h2>Bagaimana mata kuliah ini berjalan</h2><p>Anda akan <b>berlatih</b> berkomunikasi, bukan hanya membaca teorinya. Nilai akhir terdiri atas empat komponen:</p><div class=\"assess\" role=\"img\" aria-label=\"Penilaian: Tugas 1 30 persen, UTS 20 persen, Tugas 2 30 persen, UAS 20 persen\"><div class=\"a1\" style=\"width:30%\"><b>30%</b>Tugas 1</div><div class=\"a2\" style=\"width:20%\"><b>20%</b>UTS</div><div class=\"a3\" style=\"width:30%\"><b>30%</b>Tugas 2</div><div class=\"a4\" style=\"width:20%\"><b>20%</b>UAS</div></div><div class=\"cols\" style=\"margin-top:.8em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Tugas 1 · Pertemuan 2–7</h3><p>Portofolio praktik kelompok: rekaman <i>role-play</i> interpersonal, notulen simulasi rapat, dan presentasi hasil observasi komunikasi di satu organisasi (UMKM, instansi, atau pesantren).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/></svg>Tugas 2 · Pertemuan 9–15</h3><p>Proyek kelompok bersama mitra nyata: proposal bebas plagiasi, peta pemangku kepentingan, rencana komunikasi, email kepada mitra, dan <i>pitching</i> di depan panel.</p></div></div><div class=\"weeks\" aria-hidden=\"true\"><span class=\"on\">1</span><span class=\"\">2</span><span class=\"\">3</span><span class=\"\">4</span><span class=\"\">5</span><span class=\"\">6</span><span class=\"\">7</span><span class=\"ex\">8</span><span class=\"\">9</span><span class=\"\">10</span><span class=\"\">11</span><span class=\"\">12</span><span class=\"\">13</span><span class=\"\">14</span><span class=\"\">15</span><span class=\"ex\">16</span></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kontrak kuliah</span><span>Kita sepakati bersama</span></div><h2>Kesepakatan kelas kita</h2><div class=\"grid5\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Tepat waktu</h3><p>Hadir sebelum kelas dimulai. Kabari ketua kelas bila terlambat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><path d=\"M12 18h.01\"/></svg>Ponsel</h3><p>Mode senyap. Dipakai hanya untuk aktivitas kelas.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>Saling menghargai</h3><p>Dengarkan dulu. Hormati perbedaan pendapat (<i>tasamuh</i>).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Jujur</h3><p>Kumpulkan karya sendiri. Tidak menyalin-tempel (<i>As Shidqu</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Bertanya</h3><p>Silakan bertanya kapan saja. Tidak ada pertanyaan yang bodoh.</p></div></div><p class=\"muted\" style=\"margin-top:1em\">Ketentuan lain (kehadiran, keterlambatan pengumpulan tugas) mengikuti peraturan akademik Unusida.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Kapan pesan pernah salah dipahami?</h2><div class=\"cols w\"><div><p class=\"lead\">Ingat satu kejadian ketika Anda disalahpahami, atau Anda salah memahami orang lain.</p><ol><li>Apa pesannya?</li><li>Lewat apa pesan dikirim? (tatap muka, WhatsApp, telepon)</li><li>Apa salah pahamnya?</li></ol><p class=\"muted\">Ceritakan kepada pasangan Anda. Lalu 2–3 pasangan berbagi ke kelas.</p></div><div class=\"chat\" aria-label=\"Contoh percakapan\"><div class=\"who\">Grup Kelas SI-1A</div><div class=\"bub\">Besok kuliah jam 7 ya<small>21.04</small></div><div class=\"bub me\">Jam 7 pagi atau malam? 😅<small>21.06</small></div><div class=\"bub\">Pagi lah 🙄<small>21.30</small></div><div class=\"bub me\">Oh kirain online malam<small>21.31</small></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span></div><h2>Apa itu komunikasi?</h2><div class=\"cols w\"><div><p class=\"lead\">Kata <i>communication</i> berasal dari bahasa Latin <i>communis</i>, artinya <b>sama</b> atau <b>milik bersama</b>.</p><div class=\"callout\" style=\"margin:.8em 0\"><span class=\"quote\"><button type=\"button\" class=\"term\" data-term=\"communication\">Communication</button> adalah proses menciptakan <u>makna bersama</u> melalui pesan.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\">Definisi kerja mata kuliah ini</div></div><p>Empat kata kunci:</p><ul><li><b>Proses</b>: terus bergerak dan berubah, bukan satu momen.</li><li><b>Bersama</b>: melibatkan setidaknya dua pihak.</li><li><b>Makna</b>: tujuannya saling paham, bukan sekadar bicara.</li><li><b>Pesan</b>: kata, nada, gerak tubuh, gambar, emoji.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Cek cepat</h3><p>Teman membaca WhatsApp Anda lalu tidak membalas. <b>Apakah ini komunikasi?</b></p><p class=\"muted\">Simpan jawaban Anda. Kita jawab bersama di slide prinsip komunikasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Unsur</span><span>7 bagian</span></div><h2>Unsur-unsur komunikasi <span class=\"cite\">(DeVito, 2019)</span></h2><figure class=\"fig\"><svg viewBox=\"0 0 780 300\" role=\"img\" aria-label=\"Unsur komunikasi: sender menyandikan gagasan menjadi message, message melewati channel menuju receiver yang menafsirkannya, feedback kembali ke sender, noise dapat mengganggu, dan semuanya terjadi di dalam context.\"><defs><marker id=\"ar1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker><marker id=\"ar1w\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"8\" y=\"8\" width=\"764\" height=\"284\" rx=\"18\" class=\"s-dash\"/><text x=\"28\" y=\"34\" class=\"s-hd\">CONTEXT · tempat, waktu, budaya, hubungan</text><rect x=\"40\" y=\"110\" width=\"160\" height=\"76\" rx=\"12\" class=\"s-soft\"/><text x=\"120\" y=\"143\" text-anchor=\"middle\" class=\"s-t\">Sender</text><text x=\"120\" y=\"165\" text-anchor=\"middle\" class=\"s-s\">menyandikan gagasan</text><rect x=\"310\" y=\"110\" width=\"160\" height=\"76\" rx=\"12\" class=\"s-acc\"/><text x=\"390\" y=\"143\" text-anchor=\"middle\" class=\"s-t\">Message</text><text x=\"390\" y=\"165\" text-anchor=\"middle\" class=\"s-s\">melalui channel</text><rect x=\"580\" y=\"110\" width=\"160\" height=\"76\" rx=\"12\" class=\"s-soft\"/><text x=\"660\" y=\"143\" text-anchor=\"middle\" class=\"s-t\">Receiver</text><text x=\"660\" y=\"165\" text-anchor=\"middle\" class=\"s-s\">menafsirkan makna</text><line x1=\"202\" y1=\"148\" x2=\"306\" y2=\"148\" class=\"s-line\" marker-end=\"url(#ar1)\"/><text x=\"254\" y=\"138\" text-anchor=\"middle\" class=\"s-s\">encoding</text><line x1=\"472\" y1=\"148\" x2=\"576\" y2=\"148\" class=\"s-line\" marker-end=\"url(#ar1)\"/><text x=\"524\" y=\"138\" text-anchor=\"middle\" class=\"s-s\">decoding</text><path d=\"M660 188 C660 262 120 262 120 190\" class=\"s-line\" marker-end=\"url(#ar1)\"/><text x=\"390\" y=\"226\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Feedback</text><text x=\"390\" y=\"276\" text-anchor=\"middle\" class=\"s-s\">balasan, anggukan, emoji, bahkan diam</text><polyline points=\"360,50 372,66 386,52 398,68 412,54 424,70\" class=\"s-warnline\"/><line x1=\"392\" y1=\"74\" x2=\"392\" y2=\"104\" class=\"s-warnline\" marker-end=\"url(#ar1w)\"/><text x=\"440\" y=\"66\" class=\"s-tw\">Noise</text><text x=\"440\" y=\"84\" class=\"s-s\">mengganggu pesan</text></svg><figcaption>Unsur-unsur komunikasi, diadaptasi dari DeVito (2019). Komunikasi berhasil bila makna di pihak penerima mendekati makna yang dimaksud pengirim.</figcaption></figure><p style=\"margin-top:.5em\"><button type=\"button\" class=\"term\" data-term=\"sender\">Sender</button> · <button type=\"button\" class=\"term\" data-term=\"encoding\">Encoding</button> · <button type=\"button\" class=\"term\" data-term=\"message\">Message</button> · <button type=\"button\" class=\"term\" data-term=\"channel\">Channel</button> · <button type=\"button\" class=\"term\" data-term=\"receiver\">Receiver</button> · <button type=\"button\" class=\"term\" data-term=\"decoding\">Decoding</button> · <button type=\"button\" class=\"term\" data-term=\"feedback\">Feedback</button> · <button type=\"button\" class=\"term\" data-term=\"noise\">Noise</button> · <button type=\"button\" class=\"term\" data-term=\"context\">Context</button></p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Model</span><span>Dari satu arah ke makna bersama</span></div><h2>Tiga <button type=\"button\" class=\"term\" data-term=\"model\">model</button> komunikasi</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 250\" role=\"img\" aria-label=\"Tiga model komunikasi. Linear: panah satu arah dari A ke B. Interaksional: A dan B bergantian, message satu arah lalu feedback kembali. Transaksional: A dan B beririsan, saling mengirim dan menerima secara bersamaan.\"><defs><marker id=\"ar2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"140\" y=\"26\" text-anchor=\"middle\" class=\"s-hd\">LINEAR · 1949</text><circle cx=\"70\" cy=\"110\" r=\"38\" class=\"s-soft\"/><text x=\"70\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">A</text><circle cx=\"210\" cy=\"110\" r=\"38\" class=\"s-soft\"/><text x=\"210\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">B</text><line x1=\"110\" y1=\"110\" x2=\"168\" y2=\"110\" class=\"s-line\" marker-end=\"url(#ar2)\"/><text x=\"140\" y=\"186\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Satu arah</text><text x=\"140\" y=\"206\" text-anchor=\"middle\" class=\"s-s\">A berbicara, B hanya menerima</text><text x=\"140\" y=\"226\" text-anchor=\"middle\" class=\"s-s\">mis. pengumuman radio</text><line x1=\"300\" y1=\"30\" x2=\"300\" y2=\"230\" class=\"s-dash\"/><text x=\"450\" y=\"26\" text-anchor=\"middle\" class=\"s-hd\">INTERAKSIONAL · 1954</text><circle cx=\"380\" cy=\"110\" r=\"38\" class=\"s-soft\"/><text x=\"380\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">A</text><circle cx=\"520\" cy=\"110\" r=\"38\" class=\"s-soft\"/><text x=\"520\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">B</text><path d=\"M414 94 Q450 70 486 94\" class=\"s-line\" marker-end=\"url(#ar2)\"/><text x=\"450\" y=\"70\" text-anchor=\"middle\" class=\"s-s\">message</text><path d=\"M486 126 Q450 150 414 126\" class=\"s-line\" marker-end=\"url(#ar2)\"/><text x=\"450\" y=\"164\" text-anchor=\"middle\" class=\"s-s\">feedback</text><text x=\"450\" y=\"186\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Bergantian</text><text x=\"450\" y=\"206\" text-anchor=\"middle\" class=\"s-s\">kirim dulu, lalu dibalas</text><text x=\"450\" y=\"226\" text-anchor=\"middle\" class=\"s-s\">mis. chat WhatsApp</text><line x1=\"600\" y1=\"30\" x2=\"600\" y2=\"230\" class=\"s-dash\"/><text x=\"760\" y=\"26\" text-anchor=\"middle\" class=\"s-hd\">TRANSAKSIONAL · 1970</text><circle cx=\"725\" cy=\"110\" r=\"52\" class=\"s-acc\" style=\"fill-opacity:.8\"/><circle cx=\"795\" cy=\"110\" r=\"52\" class=\"s-soft\" style=\"fill-opacity:.8\"/><text x=\"700\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">A</text><text x=\"820\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">B</text><line x1=\"746\" y1=\"96\" x2=\"774\" y2=\"96\" class=\"s-line\" marker-end=\"url(#ar2)\" marker-start=\"url(#ar2)\"/><line x1=\"746\" y1=\"124\" x2=\"774\" y2=\"124\" class=\"s-line\" marker-end=\"url(#ar2)\" marker-start=\"url(#ar2)\"/><text x=\"760\" y=\"186\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Bersamaan</text><text x=\"760\" y=\"206\" text-anchor=\"middle\" class=\"s-s\">saling kirim &amp; terima sekaligus</text><text x=\"760\" y=\"226\" text-anchor=\"middle\" class=\"s-s\">mis. mengobrol tatap muka</text></svg><figcaption>Linear: Shannon &amp; Weaver (1949). Interaksional: Schramm (1954). Transaksional: Barnlund (1970). Dari kiri ke kanan, penerima makin menjadi mitra aktif; pada model transaksional makna dibangun bersama.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Prinsip</span></div><h2>Lima prinsip yang perlu diingat</h2><div class=\"grid5\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Proses</h3><p>Komunikasi terus bergerak dan berubah dari waktu ke waktu.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Tak terhindarkan</h3><p>Kita tidak bisa tidak berkomunikasi. Diam pun mengirim pesan <span class=\"cite\">(Watzlawick dkk., 1967)</span>.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 7v6h6\"/><path d=\"M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13\"/></svg><button type=\"button\" class=\"term\" data-term=\"irreversible\">Irreversible</button></h3><p>Ucapan tidak bisa ditarik kembali. Tangkapan layar tersimpan selamanya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Dua tingkat</h3><p>Ada <b>isi</b> (apa yang dikatakan) dan <b>hubungan</b> (bagaimana kita memandang lawan bicara) <span class=\"cite\">(Watzlawick dkk., 1967)</span>.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/></svg>Kontekstual</h3><p>Kata yang sama bisa bermakna berbeda di tempat dan situasi berbeda.</p></div></div><p class=\"muted\" style=\"margin-top:.9em\">Prinsip-prinsip ini dibahas lebih lengkap dalam DeVito (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Jenis</span><span>Dari satu orang ke jutaan</span></div><h2>Tingkatan komunikasi <span class=\"cite\">(DeVito, 2019)</span></h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Tingkatan</th><th>Siapa</th><th>Contoh dalam konteks kita</th></tr></thead><tbody><tr><td><b><i>Intrapersonal</i></b></td><td>Dengan diri sendiri</td><td>Merencanakan apa yang akan dikatakan sebelum menemui dosen wali</td></tr><tr><td><b><i>Interpersonal</i></b></td><td>Dua orang atau sedikit lebih</td><td>Santri berbicara dengan musyrif</td></tr><tr><td><b><i>Small group</i></b></td><td>Sekitar 3–12 orang dengan tujuan bersama</td><td>Rapat takmir masjid, tim proyek</td></tr><tr><td><b><i>Public</i></b></td><td>Satu pembicara, banyak pendengar</td><td>Sambutan saat wisuda</td></tr><tr><td><b><i>Mass &amp; digital</i></b></td><td>Melalui media ke banyak orang</td><td>UMKM mengunggah promosi di Instagram atau TikTok</td></tr></tbody></table></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Penting</span><span>Hambatan</span></div><h2>Apa yang menghambat komunikasi?</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 5 6 9H2v6h4l5 4V5Z\"/><path d=\"M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14\"/></svg>Fisik</h3><p>Ruangan bising, pengeras suara buruk, posisi terlalu jauh.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Fisiologis</h3><p>Kondisi tubuh: lelah, mengantuk, gangguan pendengaran.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>Psikologis</h3><p>Stres, marah, malu, prasangka terhadap pembicara.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Semantik</h3><p>Kata ambigu, <button type=\"button\" class=\"term\" data-term=\"jargon\">jargon</button>, salah ketik, satu kata bermakna berbeda.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Budaya</h3><p>Norma berbeda: langsung vs tidak langsung, formal vs santai.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76M2 2l20 20\"/></svg>Teknis</h3><p>Sinyal lemah, kuota habis, mikrofon rusak.</p></div></div><div class=\"callout warn\" style=\"margin-top:.8em\">Kebanyakan salah paham melibatkan <b>lebih dari satu</b> hambatan sekaligus.</div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Fisik, fisiologis, psikologis, dan semantik: jenis <i>noise</i> menurut DeVito (2019). Hambatan budaya: Samovar dkk. (2017), dibahas di Pertemuan 11.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Studi kasus</span><span>UMKM · Sidoarjo</span></div><h2>Pesanan yang salah kirim</h2><div class=\"cols w\"><div><p><b>Bu Sari</b> menjual keripik tempe dari rumahnya di Sidoarjo. Sebagian besar pesanan masuk lewat WhatsApp. Suatu malam, pelanggan baru mengirim pesan.</p><p>Bu Sari mengirim <b>10 bungkus kecil rasa original</b>. Pelanggan kecewa: ia butuh <b>10 kg rasa pedas</b> untuk acara pengajian hari Sabtu.</p><p class=\"lead\" style=\"margin-top:.8em\">Tugas kelompok (3 orang, 10 menit):</p><ol><li>Sebutkan sender, message, channel, receiver, dan feedback.</li><li>Hambatan apa saja yang Anda temukan?</li><li>Tulis ulang pesan pelanggan agar jelas.</li></ol></div><div class=\"chat\" aria-label=\"Percakapan WhatsApp antara pelanggan dan Bu Sari\"><div class=\"who\">Keripik Tempe Bu Sari</div><div class=\"bub\">Assalamualaikum bu, pesan keripiknya 10 ya, kirim besok 🙏<small>20.15</small></div><div class=\"bub me\">Waalaikumsalam, siap kak 👍<small>20.40</small></div><div class=\"bub\">...<small>Jumat 09.10</small></div><div class=\"bub\">Lho bu kok cuma segini? Buat acara pengajian 😢<small>Jumat 11.02</small></div></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi</span></div><h2>Mari berdiskusi</h2><ol class=\"lead\"><li>Model mana (linear, interaksional, transaksional) yang paling menggambarkan kuliah daring? Mengapa?</li><li>Berikan satu contoh hambatan semantik dalam keseharian Anda, dalam bahasa Indonesia atau bahasa daerah.</li><li>Bagaimana mahasiswa bisa mengurangi <i>noise</i> saat mengirim pesan WhatsApp kepada dosen?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Komunikasi adalah proses menciptakan <b>makna bersama</b>.</li><li>Tujuh unsur: sender, message, channel, receiver, feedback, noise, context.</li><li>Model berkembang dari <b>linear</b> ke <b>interaksional</b> ke <b>transaksional</b>.</li><li>Kita tidak bisa <i>tidak</i> berkomunikasi, dan ucapan tidak bisa ditarik kembali.</li><li>Hambatan: fisik, fisiologis, psikologis, semantik, budaya, dan teknis.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Hambatan semantik: makna &quot;sebelum Jumat&quot; tidak sama bagi pengirim dan penerima.\"><p class=\"q\">Dosen berkata \"Kumpulkan sebelum Jumat.\" Mahasiswa mengumpulkan pada hari Jumat. Kata \"sebelum\" menimbulkan hambatan…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. fisik</button><button type=\"button\" data-o=\"b\">B. semantik</button><button type=\"button\" data-o=\"c\">C. teknis</button><button type=\"button\" data-o=\"d\">D. budaya</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Transaksional (Barnlund, 1970): kedua pihak menjadi pengirim sekaligus penerima.\"><p class=\"q\">Model mana yang menyatakan kedua pihak mengirim dan menerima pesan pada saat yang sama?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Linear</button><button type=\"button\" data-o=\"b\">B. Interaksional</button><button type=\"button\" data-o=\"c\">C. Transaksional</button><button type=\"button\" data-o=\"d\">D. Broadcast</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"&quot;One cannot not communicate&quot;: diam pun mengirim pesan.\"><p class=\"q\">Teman membaca pesan Anda lalu diam saja. Menurut Watzlawick dkk. (1967), hal ini…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. bukan komunikasi</button><button type=\"button\" data-o=\"b\">B. tetap komunikasi</button><button type=\"button\" data-o=\"c\">C. hanya noise</button><button type=\"button\" data-o=\"d\">D. hanya channel</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab pengantar komunikasi interpersonal dalam DeVito (2019), <i>The Interpersonal Communication Book</i> (edisi ke-15).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menganalisis</h3><p>Tulis satu kasus nyata hambatan komunikasi yang Anda alami atau lihat minggu ini (150–200 kata, bahasa Indonesia). Sebutkan unsur-unsurnya, jenis hambatannya, dan cara memperbaikinya. Bawa ke Pertemuan 2.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Communication</span></dt><dd>Proses menciptakan makna bersama melalui pesan, baik verbal maupun nonverbal. <i>(komunikasi)</i></dd></div><div><dt><span class=\"en\">Sender</span></dt><dd>Pihak yang memulai dan menyampaikan pesan; disebut juga source. <i>(pengirim / komunikator)</i></dd></div><div><dt><span class=\"en\">Message</span></dt><dd>Isi yang ingin disampaikan: kata-kata, nada suara, gerak tubuh, gambar, atau emoji. <i>(pesan)</i></dd></div><div><dt><span class=\"en\">Channel</span></dt><dd>Jalur yang dilalui pesan: tatap muka, telepon, WhatsApp, email. <i>(saluran / media)</i></dd></div><div><dt><span class=\"en\">Receiver</span></dt><dd>Pihak yang menerima lalu menafsirkan pesan. <i>(penerima / komunikan)</i></dd></div><div><dt><span class=\"en\">Feedback</span></dt><dd>Respons penerima yang menunjukkan bagaimana pesan dipahami. <i>(umpan balik)</i></dd></div><div><dt><span class=\"en\">Noise</span></dt><dd>Apa pun yang mengganggu pesan sehingga makna yang diterima berbeda dari yang dimaksud. <i>(gangguan)</i></dd></div><div><dt><span class=\"en\">Context</span></dt><dd>Situasi di sekitar komunikasi: tempat, waktu, budaya, dan hubungan antarpihak. <i>(konteks)</i></dd></div><div><dt><span class=\"en\">Encoding</span></dt><dd>Mengubah gagasan menjadi kata, simbol, atau tindakan. <i>(penyandian)</i></dd></div><div><dt><span class=\"en\">Decoding</span></dt><dd>Mengubah kata, simbol, atau tindakan kembali menjadi makna. <i>(penafsiran pesan)</i></dd></div><div><dt><span class=\"en\">Model</span></dt><dd>Gambaran sederhana tentang cara kerja suatu proses. <i>(model)</i></dd></div><div><dt><span class=\"en\">Irreversible</span></dt><dd>Tidak dapat ditarik kembali. Pesan yang sudah diterima tidak bisa dihapus dari ingatan penerima. <i>(tidak dapat ditarik kembali)</i></dd></div><div><dt><span class=\"en\">Jargon</span></dt><dd>Istilah khusus suatu kelompok atau bidang yang sering tidak dipahami orang luar. <i>(istilah teknis / bahasa khusus)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>DeVito, J. A. (2019). <i>The interpersonal communication book</i> (15th ed.). Pearson.</li><li>Shannon, C. E., &amp; Weaver, W. (1949). <i>The mathematical theory of communication</i>. University of Illinois Press.</li><li>Schramm, W. (1954). How communication works. Dalam W. Schramm (Ed.), <i>The process and effects of mass communication</i>. University of Illinois Press.</li><li>Barnlund, D. C. (1970). A transactional model of communication. Dalam K. K. Sereno &amp; C. D. Mortensen (Eds.), <i>Foundations of communication theory</i>. Harper &amp; Row.</li><li>Watzlawick, P., Beavin, J. H., &amp; Jackson, D. D. (1967). <i>Pragmatics of human communication: A study of interactional patterns, pathologies, and paradoxes</i>. W. W. Norton.</li><li>Samovar, L. A., Porter, R. E., McDaniel, E. R., &amp; Roy, C. S. (2017). <i>Communication between cultures</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Komunikasi Interpersonal (1)","subtitle":"Konsep diri, persepsi, mendengar aktif, dan empati","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Communication Skill · SI24W32</span></div><h1>Komunikasi Interpersonal (1)</h1><p class=\"lead\">Konsep diri, persepsi, mendengar aktif, dan empati</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Belajar + role-play</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menerapkan komunikasi interpersonal yang efektif: mendengar aktif, empati, verbal dan nonverbal, serta asertif (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 4)</span></h3><ol><li>Ketepatan melakukan parafrase dan klarifikasi saat mendengar aktif.</li><li>Keselarasan pesan verbal dan nonverbal. <span class=\"muted\">(Pertemuan 3)</span></li><li>Ketepatan memilih respons asertif dalam simulasi. <span class=\"muted\">(Pertemuan 3)</span></li><li>Kejujuran dan kesantunan dalam berkomunikasi.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menerapkan sikap jujur, amanah, taat norma, dan kolaboratif dalam komunikasi interpersonal, kerja tim, dan ruang digital.</dd><dt>CPL-1</dt><dd class=\"id\">Mampu mengintegrasikan sikap As Shidqu (kejujuran), Al Amanah Wal Wafa Bil Ahdi (bertanggung jawab), Al Adalah (selalu berpedoman pada norma dan peraturan yang berlaku) dan At Taawun (berkolaborasi) dalam perkembangan ilmu pengetahuan dan teknologi.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Praktik / Unjuk Kerja (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Sebutkan tujuh unsur komunikasi.</li><li>Apa beda model interaksional dan transaksional?</li><li>Berikan satu contoh hambatan semantik.</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span></div><h2>Apa itu komunikasi interpersonal?</h2><div class=\"cols w\"><div><div class=\"callout\"><span class=\"quote\"><button type=\"button\" class=\"term\" data-term=\"interpersonal\">Interpersonal communication</button> adalah interaksi verbal dan nonverbal antara dua orang (atau sedikit lebih) yang saling bergantung.</span> <span class=\"cite\">(DeVito, 2019)</span></div><ul style=\"margin-top:.8em\"><li>Membangun dan mengubah <b>hubungan</b>.</li><li>Kedua pihak saling memengaruhi.</li><li>Bisa tatap muka atau daring.</li></ul></div><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Kampus</h3><p>Mahasiswa dan dosen wali</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Pesantren</h3><p>Santri dan musyrif</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>UMKM</h3><p>Admin toko daring dan pelanggan</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01\"/></svg>Rumah</h3><p>Anda dan orang tua</p></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bagian 1</span><span>Mengenal diri</span></div><h2>Konsep diri: cara Anda memandang diri</h2><div class=\"cols\"><div><p><button type=\"button\" class=\"term\" data-term=\"self-concept\">Self-concept</button> Anda membentuk cara Anda berbicara dan mendengar. Sumbernya <span class=\"cite\">(DeVito, 2019)</span>:</p><ul><li><b>Pandangan orang lain</b>: apa kata orang tua, guru, dan teman tentang Anda.</li><li><b>Perbandingan sosial</b>: membandingkan diri dengan orang lain.</li><li><b>Ajaran budaya</b>: nilai dari keluarga, pesantren, dan masyarakat.</li><li><b>Evaluasi diri</b>: cara Anda menilai perbuatan sendiri.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Mengapa penting?</h3><p><button type=\"button\" class=\"term\" data-term=\"self-esteem\">Self-esteem</button> yang rendah bisa membuat Anda diam di kelas, padahal punya ide bagus. Konsep diri yang sehat membantu Anda bicara jelas dan menerima masukan.</p><p class=\"muted\">Coba ganti \"Saya tidak bisa presentasi\" menjadi \"Saya <b>belum</b> terbiasa presentasi\". Kata <i>belum</i> mengubah pesan kepada diri sendiri.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Model</span><span>Johari Window</span></div><h2>Empat area diri</h2><div class=\"cols w\"><div><figure class=\"fig\"><svg viewBox=\"0 0 600 330\" role=\"img\" aria-label=\"Johari Window, kisi dua kali dua. Diketahui diri dan diketahui orang lain: area open. Tidak diketahui diri tetapi diketahui orang lain: area blind. Diketahui diri tetapi tidak diketahui orang lain: area hidden. Tidak diketahui keduanya: area unknown. Meminta feedback memperluas area open ke kanan; self-disclosure memperluasnya ke bawah.\"><defs><marker id=\"ar3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"250\" y=\"22\" text-anchor=\"middle\" class=\"s-hd\">DIKETAHUI DIRI</text><text x=\"454\" y=\"22\" text-anchor=\"middle\" class=\"s-hd\">TIDAK DIKETAHUI DIRI</text><text x=\"138\" y=\"92\" text-anchor=\"end\" class=\"s-hd\">DIKETAHUI</text><text x=\"138\" y=\"108\" text-anchor=\"end\" class=\"s-hd\">ORANG LAIN</text><text x=\"138\" y=\"226\" text-anchor=\"end\" class=\"s-hd\">TIDAK DIKETAHUI</text><text x=\"138\" y=\"242\" text-anchor=\"end\" class=\"s-hd\">ORANG LAIN</text><rect x=\"150\" y=\"34\" width=\"200\" height=\"130\" rx=\"10\" class=\"s-hl\"/><text x=\"250\" y=\"90\" text-anchor=\"middle\" class=\"s-ta\">OPEN</text><text x=\"250\" y=\"112\" text-anchor=\"middle\" style=\"fill:var(--accent-ink);font-size:12.5px;font-family:var(--font)\">nama, hobi saya</text><rect x=\"354\" y=\"34\" width=\"200\" height=\"130\" rx=\"10\" class=\"s-soft\"/><text x=\"454\" y=\"90\" text-anchor=\"middle\" class=\"s-t\">BLIND</text><text x=\"454\" y=\"112\" text-anchor=\"middle\" class=\"s-s\">saya bicara terlalu cepat</text><rect x=\"150\" y=\"168\" width=\"200\" height=\"130\" rx=\"10\" class=\"s-soft\"/><text x=\"250\" y=\"224\" text-anchor=\"middle\" class=\"s-t\">HIDDEN</text><text x=\"250\" y=\"246\" text-anchor=\"middle\" class=\"s-s\">saya gugup di kelas</text><rect x=\"354\" y=\"168\" width=\"200\" height=\"130\" rx=\"10\" class=\"s-box\"/><text x=\"454\" y=\"224\" text-anchor=\"middle\" class=\"s-t\">UNKNOWN</text><text x=\"454\" y=\"246\" text-anchor=\"middle\" class=\"s-s\">bakat yang belum ditemukan</text><line x1=\"300\" y1=\"146\" x2=\"392\" y2=\"146\" class=\"s-line\" marker-end=\"url(#ar3)\"/><text x=\"398\" y=\"150\" class=\"s-s\" style=\"font-weight:700\">feedback</text><line x1=\"176\" y1=\"138\" x2=\"176\" y2=\"194\" class=\"s-line\" marker-end=\"url(#ar3)\"/><text x=\"186\" y=\"196\" class=\"s-s\" style=\"font-weight:700\">self-disclosure</text></svg><figcaption>Johari Window (Luft &amp; Ingham, 1955). Meminta feedback memperluas area open ke kanan (mengecilkan area blind); self-disclosure memperluasnya ke bawah (mengecilkan area hidden).</figcaption></figure></div><div><p>Hubungan yang sehat memperluas <b>area open</b>.</p><ul><li><b>Minta <button type=\"button\" class=\"term\" data-term=\"feedback\">feedback</button></b> untuk mengetahui area blind Anda.</li><li>Lakukan <button type=\"button\" class=\"term\" data-term=\"self-disclosure\">self-disclosure</button> secara bertahap untuk membuka sebagian area hidden.</li><li>Bagikan sedikit demi sedikit, kepada orang yang Anda percaya.</li></ul><div class=\"callout\" style=\"margin-top:.8em\">Coba tanyakan kepada teman: \"Satu kebiasaan apa yang saya lakukan saat presentasi, yang mungkin tidak saya sadari?\"</div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bagian 2</span><span>Persepsi</span></div><h2>Bagaimana kita memaknai orang lain</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 200\" role=\"img\" aria-label=\"Lima tahap persepsi menurut DeVito: stimulation, organization, interpretation-evaluation, memory, recall, dengan contoh teman yang belum membalas pesan WhatsApp.\"><defs><marker id=\"ar4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"20\" width=\"148\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"84\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 1</text><text x=\"84\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Stimulation</text><line x1=\"160\" y1=\"62\" x2=\"178\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar4)\"/><text x=\"84\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">indra menangkap</text><text x=\"84\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">rangsang</text><text x=\"84\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">\"Dibaca. Tak dibalas.\"</text><rect x=\"182\" y=\"20\" width=\"148\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"256\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 2</text><text x=\"256\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Organization</text><line x1=\"332\" y1=\"62\" x2=\"350\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar4)\"/><text x=\"256\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">menyusun rangsang</text><text x=\"256\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">menjadi pola</text><text x=\"256\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">\"Tadi dia keluar call.\"</text><rect x=\"354\" y=\"20\" width=\"148\" height=\"84\" rx=\"12\" class=\"s-acc\"/><text x=\"428\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 3</text><text x=\"428\" y=\"68\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Interpretation–</text><text x=\"428\" y=\"86\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">evaluation</text><line x1=\"504\" y1=\"62\" x2=\"522\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar4)\"/><text x=\"428\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">memberi makna</text><text x=\"428\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">dan menilai</text><text x=\"428\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">\"Dia marah padaku.\"</text><rect x=\"526\" y=\"20\" width=\"148\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"600\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 4</text><text x=\"600\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Memory</text><line x1=\"676\" y1=\"62\" x2=\"694\" y2=\"62\" class=\"s-line\" marker-end=\"url(#ar4)\"/><text x=\"600\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">kesan disimpan</text><text x=\"600\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">dalam ingatan</text><text x=\"600\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">\"Dia sedang marah.\"</text><rect x=\"698\" y=\"20\" width=\"148\" height=\"84\" rx=\"12\" class=\"s-soft\"/><text x=\"772\" y=\"44\" text-anchor=\"middle\" class=\"s-hd\">TAHAP 5</text><text x=\"772\" y=\"74\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Recall</text><text x=\"772\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">kesan dipanggil</text><text x=\"772\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">saat dibutuhkan</text><text x=\"772\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">\"Besok aku menjauh.\"</text></svg><figcaption>Lima tahap persepsi menurut DeVito (2019). Tafsiran yang keliru di tahap 3 ikut tersimpan (tahap 4) dan muncul lagi (tahap 5), sehingga memengaruhi komunikasi berikutnya. Cek dulu sebelum menyimpulkan.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Waspada</span><span>Kesalahan persepsi</span></div><h2>Kesalahan persepsi yang sering terjadi</h2><div class=\"cols\"><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Stereotip</h3><p>\"Mahasiswa dari daerah X pasti malas.\" <button type=\"button\" class=\"term\" data-term=\"stereotype\">Stereotype</button> mengabaikan individu.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Kesan pertama</h3><p><button type=\"button\" class=\"term\" data-term=\"primacy\">Primacy effect</button>: menilai orang hanya dari pertemuan pertama.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Bias melayani diri</h3><p><button type=\"button\" class=\"term\" data-term=\"self-serving\">Self-serving bias</button>: \"Saya gagal karena soalnya sulit; dia gagal karena malas.\"</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Ramalan diri</h3><p><button type=\"button\" class=\"term\" data-term=\"self-fulfilling\">Self-fulfilling prophecy</button>: \"Dia pasti tidak suka saya\", lalu kita bersikap dingin dan dugaan itu jadi nyata.</p></div></div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg><button type=\"button\" class=\"term\" data-term=\"perception-checking\">Cek persepsi</button></h3><ol><li><b>Gambarkan</b> apa yang Anda lihat: \"Tadi kamu keluar dari call lebih awal.\"</li><li><b>Tawarkan dua kemungkinan</b>: \"Mungkin kamu sibuk, atau mungkin kamu kesal.\"</li><li><b>Tanyakan</b>: \"Yang mana, ya?\"</li></ol><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(DeVito, 2019)</span></p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bagian 3</span><span>Mendengarkan</span></div><h2>Mendengar belum tentu menyimak</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0\"/><path d=\"M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4\"/></svg><button type=\"button\" class=\"term\" data-term=\"hearing\">Hearing</button></h3><p>Fisik. Bunyi masuk ke telinga. Terjadi otomatis.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"listening\">Listening</button></h3><p>Mental. Anda memilih untuk memperhatikan, memahami, dan merespons. Butuh usaha.</p></div></div><figure class=\"fig\"><svg viewBox=\"0 0 860 200\" role=\"img\" aria-label=\"Lima tahap listening berurutan: receiving, understanding, remembering, evaluating, responding. Responding kembali ke receiving.\"><defs><marker id=\"ar5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"148\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"84\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Receiving</text><text x=\"84\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">menerima</text><line x1=\"160\" y1=\"70\" x2=\"178\" y2=\"70\" class=\"s-line\" marker-end=\"url(#ar5)\"/><rect x=\"182\" y=\"30\" width=\"148\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"256\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Understanding</text><text x=\"256\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">memahami</text><line x1=\"332\" y1=\"70\" x2=\"350\" y2=\"70\" class=\"s-line\" marker-end=\"url(#ar5)\"/><rect x=\"354\" y=\"30\" width=\"148\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"428\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Remembering</text><text x=\"428\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">mengingat</text><line x1=\"504\" y1=\"70\" x2=\"522\" y2=\"70\" class=\"s-line\" marker-end=\"url(#ar5)\"/><rect x=\"526\" y=\"30\" width=\"148\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"600\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Evaluating</text><text x=\"600\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">menilai</text><line x1=\"676\" y1=\"70\" x2=\"694\" y2=\"70\" class=\"s-line\" marker-end=\"url(#ar5)\"/><rect x=\"698\" y=\"30\" width=\"148\" height=\"80\" rx=\"12\" class=\"s-acc\"/><text x=\"772\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Responding</text><text x=\"772\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">merespons</text><path d=\"M772 112 C772 180 84 180 84 114\" class=\"s-line\" marker-end=\"url(#ar5)\"/><text x=\"430\" y=\"166\" text-anchor=\"middle\" class=\"s-s\">pembicara melanjutkan, Anda menyimak lagi</text></svg><figcaption>Lima tahap listening menurut DeVito (2019). Hearing hanya tahap pertama; listening memerlukan kelima tahap.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Keterampilan</span><span>Active listening</span></div><h2>Empat teknik <button type=\"button\" class=\"term\" data-term=\"active-listening\">active listening</button></h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Teknik</th><th>Yang Anda lakukan</th><th>Contoh kalimat</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"paraphrase\">Paraphrase</button></b></td><td>Ungkapkan kembali gagasan dengan kata-kata sendiri</td><td><span class=\"phrase\">Jadi maksudnya…</span> <span class=\"phrase\">Kalau saya tangkap…</span></td></tr><tr><td><b>Klarifikasi</b></td><td>Tanyakan bagian yang belum jelas</td><td><span class=\"phrase\">Maksudnya … itu bagaimana?</span> <span class=\"phrase\">Boleh contohnya?</span></td></tr><tr><td><b>Meringkas</b></td><td>Kumpulkan poin-poin utama</td><td><span class=\"phrase\">Sejauh ini ada tiga hal…</span></td></tr><tr><td><b>Menunjukkan perhatian</b></td><td>Kontak mata, mengangguk, menghadap pembicara, letakkan ponsel</td><td><span class=\"phrase\">Oh, begitu.</span> <span class=\"phrase\">Terus?</span></td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.6em\">\"Kebanyakan orang tidak mendengar untuk memahami; mereka mendengar untuk membalas.\" <span class=\"cite\">(Covey, 1989, terjemahan bebas)</span></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Keterampilan</span><span>Empati</span></div><h2>Empati, bukan sekadar simpati</h2><p class=\"lead\">Seorang teman berkata: <i>\"Aku gagal kuis. Padahal sudah belajar semalaman.\"</i></p><div class=\"cols c3\" style=\"margin-top:.6em\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Mengabaikan</h3><p>\"Cuma kuis. Santai saja.\"</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg><button type=\"button\" class=\"term\" data-term=\"sympathy\">Sympathy</button></h3><p>\"Kasihan banget kamu.\"</p></div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg><button type=\"button\" class=\"term\" data-term=\"empathy\">Empathy</button></h3><p>\"Kamu sudah belajar keras tapi nilainya belum sesuai. Pasti kecewa sekali, ya.\"</p></div></div><p style=\"margin-top:.8em\">Empati = memahami perasaan <b>dari sudut pandang mereka</b>, lalu menunjukkannya lewat kata-kata <span class=\"cite\">(DeVito, 2019)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Nilai</span><span>As Shidqu · kejujuran</span></div><h2>Jujur saat mendengar, jujur saat bicara</h2><div class=\"cols w\"><div><blockquote class=\"callout\" style=\"margin:0\"><span class=\"quote\">\"Barang siapa beriman kepada Allah dan hari akhir, hendaklah ia berkata baik atau diam.\"</span><div class=\"muted\" style=\"margin-top:.4em\">HR. al-Bukhari no. 6018; Muslim no. 47</div></blockquote><p style=\"margin-top:.8em\">Dalam komunikasi interpersonal, <button type=\"button\" class=\"term\" data-term=\"as-shidqu\">As Shidqu</button> berarti:</p><ul><li>Tidak pura-pura mendengarkan sambil melihat ponsel.</li><li>Berkata \"saya belum paham\" daripada sekadar mengangguk.</li><li>Tidak menyebarkan cerita setengah benar tentang orang lain.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Refleksi</h3><p>Kapan terakhir kali Anda berkata \"iya, paham\" padahal belum benar-benar paham? Apa yang terjadi setelahnya?</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Role-play berpasangan · 25 menit</span></div><h2>Latihan mendengar aktif</h2><div class=\"cols\"><div><p><b>Cara kerja</b> (dua pasangan bergabung menjadi satu grup berempat):</p><ul><li><b>Pasangan A</b> bermain peran: satu sebagai <b>pembicara</b> (menceritakan masalah 2 menit), satu sebagai <b>pendengar</b> (memakai empat teknik dan empati).</li><li><b>Pasangan B</b> menjadi <b>pengamat</b> dan mengisi daftar periksa di slide berikutnya.</li><li>Tukar peran sampai semua orang pernah menjadi pendengar.</li></ul><p class=\"muted\">Gunakan bahasa Indonesia yang santun.</p></div><div class=\"grid4\" style=\"grid-template-columns:1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Skenario A · Pesantren</h3><p>Santri baru bercerita kepada musyrif bahwa ia rindu rumah dan sulit tidur.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Skenario B · UMKM</h3><p>Pelanggan mengeluh kepada admin toko daring: pesanannya terlambat 4 hari.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Skenario C · Kampus</h3><p>Teman sekelas cemas karena anggota kelompok Tugas 1 tidak merespons di grup.</p></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar periksa pengamat</span><span>Umpan balik sejawat</span></div><h2>Apakah pendengar sudah…?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Perilaku</th><th style=\"width:14%\">Ya</th><th style=\"width:14%\">Sebagian</th><th style=\"width:14%\">Belum</th></tr></thead><tbody><tr><td>Melakukan parafrase gagasan utama minimal sekali</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Mengajukan minimal satu pertanyaan klarifikasi</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Menjaga kontak mata dan menghadap pembicara</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Tidak memotong pembicaraan</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Menamai perasaan pembicara (empati)</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Tetap jujur dan santun (tidak pura-pura paham)</td><td>○</td><td>○</td><td>○</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em\">Sampaikan satu hal yang sudah baik dan satu hal yang bisa ditingkatkan. Spesifik dan santun.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Portofolio praktik kelompok</h2><div class=\"cols c3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2M12 19v3\"/></svg>Bagian 1 · Pertemuan 2–3</h3><p>Rekaman <i>role-play</i> komunikasi interpersonal.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Bagian 2 · Pertemuan 4–5</h3><p>Notulen simulasi rapat organisasi.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/></svg>Bagian 3 · Pertemuan 6–7</h3><p>Presentasi kelompok hasil observasi komunikasi di satu organisasi.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Hari ini: bentuk kelompok dan pilih satu organisasi untuk diamati (UMKM, instansi, atau pesantren). Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Komunikasi interpersonal membangun hubungan antara orang yang saling bergantung.</li><li>Konsep diri memengaruhi cara kita berkomunikasi; Johari Window menunjukkan cara memperluas area open.</li><li>Persepsi adalah tafsiran, bukan fakta. Cek dulu sebelum menilai.</li><li>Listening punya lima tahap. Gunakan parafrase, klarifikasi, meringkas, dan perhatian.</li><li>Empati memahami dari sudut pandang orang lain. Kejujuran (As Shidqu) menjaga kepercayaan.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Parafrase: mengungkapkan kembali gagasan pembicara dengan kata-kata sendiri untuk memastikan pemahaman.\"><p class=\"q\">\"Jadi maksudmu tenggatnya terlalu mepet untuk kelompokmu, ya?\" Respons ini adalah contoh…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. klarifikasi</button><button type=\"button\" data-o=\"b\">B. parafrase</button><button type=\"button\" data-o=\"c\">C. meringkas</button><button type=\"button\" data-o=\"d\">D. menilai</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Area blind. Meminta feedback membuat area ini mengecil.\"><p class=\"q\">Dalam Johari Window, hal yang diketahui orang lain tentang Anda tetapi tidak Anda sadari berada di area…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. open</button><button type=\"button\" data-o=\"b\">B. hidden</button><button type=\"button\" data-o=\"c\">C. blind</button><button type=\"button\" data-o=\"d\">D. unknown</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Empati menamai perasaan dari sudut pandang teman.\"><p class=\"q\">Teman: \"Laptopku rusak sehari sebelum deadline.\" Respons mana yang menunjukkan empati?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. \"Pinjam saja punya orang.\"</button><button type=\"button\" data-o=\"b\">B. \"Kasihan banget kamu.\"</button><button type=\"button\" data-o=\"c\">C. \"Pas mau deadline, pasti panik banget ya.\"</button><button type=\"button\" data-o=\"d\">D. \"Laptopku juga pernah rusak tahun lalu.\"</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Jurnal refleksi komunikasi</h3><p>Selama 5 hari, tulis 2–3 kalimat per hari: satu momen ketika Anda mendengarkan dengan baik, dan satu momen ketika tidak. Apa bedanya? Teknik apa yang Anda pakai atau lupakan?</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok</h3><p>Pastikan anggota kelompok dan organisasi yang akan diamati untuk Tugas 1. Mulai susun naskah <i>role-play</i> untuk direkam setelah Pertemuan 3.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Interpersonal communication</span></dt><dd>Interaksi verbal dan nonverbal antara dua orang (atau sedikit lebih) yang saling bergantung. <i>(komunikasi antarpribadi)</i></dd></div><div><dt><span class=\"en\">Self-concept</span></dt><dd>Gambaran yang Anda miliki tentang siapa diri Anda. <i>(konsep diri)</i></dd></div><div><dt><span class=\"en\">Self-esteem</span></dt><dd>Penilaian Anda tentang seberapa berharga diri Anda. <i>(harga diri)</i></dd></div><div><dt><span class=\"en\">Self-disclosure</span></dt><dd>Mengungkapkan informasi tentang diri sendiri yang sebelumnya tidak diketahui orang lain. <i>(pengungkapan diri)</i></dd></div><div><dt><span class=\"en\">Johari Window</span></dt><dd>Model empat area kesadaran diri: open, blind, hidden, dan unknown. <i>(Jendela Johari)</i></dd></div><div><dt><span class=\"en\">Perception</span></dt><dd>Proses memilih, menata, dan menafsirkan apa yang kita lihat dan dengar. <i>(persepsi)</i></dd></div><div><dt><span class=\"en\">Perception checking</span></dt><dd>Memastikan tafsiran kita dengan menggambarkan apa yang diamati lalu menanyakannya langsung. <i>(pengecekan persepsi)</i></dd></div><div><dt><span class=\"en\">Stereotype</span></dt><dd>Gambaran yang tetap dan disederhanakan tentang seluruh anggota suatu kelompok. <i>(stereotip)</i></dd></div><div><dt><span class=\"en\">Primacy effect</span></dt><dd>Kecenderungan informasi yang datang pertama paling kuat memengaruhi penilaian kita. <i>(efek kesan pertama)</i></dd></div><div><dt><span class=\"en\">Self-serving bias</span></dt><dd>Kecenderungan mengaitkan keberhasilan dengan diri sendiri dan kegagalan dengan faktor luar. <i>(bias melayani diri)</i></dd></div><div><dt><span class=\"en\">Self-fulfilling prophecy</span></dt><dd>Dugaan yang menjadi kenyataan karena kita bertindak seolah-olah dugaan itu sudah benar. <i>(ramalan yang memenuhi dirinya sendiri)</i></dd></div><div><dt><span class=\"en\">Active listening</span></dt><dd>Mendengarkan dengan perhatian penuh dan menunjukkan kepada pembicara bahwa Anda memahaminya. <i>(mendengar aktif)</i></dd></div><div><dt><span class=\"en\">Paraphrase</span></dt><dd>Mengungkapkan kembali gagasan pembicara dengan kata-kata sendiri untuk memastikan pemahaman. <i>(parafrase)</i></dd></div><div><dt><span class=\"en\">Empathy</span></dt><dd>Memahami perasaan orang lain dari sudut pandang orang itu. <i>(empati)</i></dd></div><div><dt><span class=\"en\">As Shidqu</span></dt><dd>Kejujuran dalam ucapan dan perbuatan; salah satu nilai inti Unusida (CPL-1). <i>(kejujuran)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>DeVito, J. A. (2019). <i>The interpersonal communication book</i> (15th ed.). Pearson.</li><li>Luft, J., &amp; Ingham, H. (1955). The Johari window, a graphic model of interpersonal awareness. Dalam <i>Proceedings of the Western Training Laboratory in Group Development</i>. University of California, Los Angeles.</li><li>Covey, S. R. (1989). <i>The 7 habits of highly effective people</i>. Simon &amp; Schuster.</li><li>Al-Bukhari, M. I. <i>Sahih al-Bukhari</i>, Kitab al-Adab, hadis no. 6018; Muslim ibn al-Hajjaj. <i>Sahih Muslim</i>, Kitab al-Iman, hadis no. 47.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 3.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":3,"title":"Komunikasi Interpersonal (2)","subtitle":"Pesan verbal dan nonverbal; gaya pasif, agresif, asertif","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 3</span><span>Sub-CPMK-2 (Pertemuan 2–3) · CPMK-1 · CPL-1</span></div><h1>Komunikasi Interpersonal (2)</h1><p class=\"lead\">Pesan verbal dan nonverbal; gaya pasif, agresif, asertif</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu menerapkan komunikasi interpersonal yang efektif: mendengar aktif, empati, verbal dan nonverbal, serta asertif (C3).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":4,"title":"Komunikasi Kelompok & Rapat","subtitle":"Peran dalam tim; agenda, notulen, tindak lanjut","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 4</span><span>Sub-CPMK-3 (Pertemuan 4–5) · CPMK-1 · CPL-1</span></div><h1>Komunikasi Kelompok & Rapat</h1><p class=\"lead\">Peran dalam tim; agenda, notulen, tindak lanjut</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu berkomunikasi dalam kelompok secara kolaboratif, termasuk rapat, musyawarah, dan penyelesaian konflik (C3).</div><p class=\"
