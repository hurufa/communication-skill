<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Communication Skill · SI Unusida</title>
<meta name="description" content="Materi perkuliahan Communication Skill (SI24W32), Program Studi Sistem Informasi, Universitas Nahdlatul Ulama Sidoarjo.">
<link rel="icon" type="image/png" href="https://hurufa.github.io/assets/favicon.png">
<link rel="apple-touch-icon" href="https://hurufa.github.io/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Darker+Grotesque:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --surface-2:#ECF0EF; --ink:#2C2E31; --ink-2:#45474B; --muted:#646A6F;
  --line:#D9DFDD; --primary:#495E57; --primary-ink:#FFFFFF; --primary-soft:#E3EBE8;
  --accent:#F4CE14; --accent-soft:#FCF3C4; --accent-ink:#2C2E31;
  --green:#0F7A45; --warn:#C2410C; --warn-soft:#FDE9DD; --ok:#2E7D4F; --ok-soft:#E1F2E7; --bad:#B42318; --bad-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(35,45,40,.06),0 8px 24px rgba(35,45,40,.08);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:288px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
    --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
    --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
    --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
  --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
  --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
  --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink-2);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.app.collapsed{grid-template-columns:0 1fr}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s ease}
.app.collapsed .side{transform:translateX(-100%);visibility:hidden}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand img{width:44px;height:auto;flex:none}
.brand b{display:block;color:var(--ink);font-size:15px;line-height:1.25}
.brand span{font-size:12px;color:var(--muted)}
.side h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 18px 6px;font-weight:700}
.mlist{list-style:none;margin:0;padding:0 10px 18px;display:grid;gap:2px}
.mbtn{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:10px;cursor:pointer}
.mbtn:hover{background:var(--surface-2)}
.mbtn[aria-current="true"]{background:var(--primary-soft)}
.mbtn .no{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--primary);background:var(--surface-2);border-radius:7px;text-align:center;padding:3px 0}
.mbtn[aria-current="true"] .no{background:var(--primary);color:var(--primary-ink)}
.mbtn .t{font-size:13.5px;line-height:1.3;color:var(--ink)}
.mbtn.soon .t{color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.tag.soon{background:var(--surface-2);color:var(--muted)}
.tag.exam{background:var(--warn-soft);color:var(--warn)}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.side .foot{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* Top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .title{flex:1;min-width:160px;font-weight:700;color:var(--ink);font-size:15px;line-height:1.3}
.top .title small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.ibtn:hover{border-color:var(--primary)}
.ibtn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.ibtn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.seg svg{width:16px;height:16px}

/* Slide mode */
.view{padding:20px 16px 40px;width:100%;max-width:1320px;margin:0 auto}
.stage{container-type:inline-size;position:relative;width:100%;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.stage .slide{position:absolute;inset:0;overflow:auto;font-size:clamp(9px,1.55cqw,30px)}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.ctrl .count{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}
.hint{font-size:12px;color:var(--muted)}
.notes{margin-top:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;padding:12px 16px;color:var(--ink)}
.notes h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.notes p,.notes li{margin:.25em 0;font-size:14.5px}
.notes ul{margin:.2em 0;padding-left:1.2em}
:fullscreen .stage, .stage:fullscreen{border-radius:0;border:0}
.stage:fullscreen{background:var(--surface)}

/* Read mode */
.read{max-width:880px;margin:0 auto;display:grid;gap:18px}
.read .slide{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:16.5px}
.read .notes{margin-top:-8px}

/* Slide content */
.slide{padding:2.6em 3.4em;color:var(--ink-2)}
.slide h1,.slide h2{color:var(--ink);line-height:1.15;text-wrap:balance;margin:0 0 .55em;letter-spacing:-.01em}
.slide h2{font-size:2em;font-weight:800}
.slide h1{font-size:2.9em;font-weight:800}
.slide h3{color:var(--ink);font-size:1.15em;margin:0 0 .35em}
.slide p{margin:.35em 0}
.slide ul,.slide ol{margin:.3em 0;padding-left:1.25em}
.slide li{margin:.32em 0}
.slide li::marker{color:var(--primary);font-weight:700}
.eyebrow{font-family:var(--mono);font-size:.78em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:.6em;display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.eyebrow .chip{background:var(--primary-soft);padding:.15em .6em;border-radius:99px}
.lead{font-size:1.2em;color:var(--ink)}
.muted{color:var(--muted)}
.id{color:var(--muted);font-style:italic}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;align-items:start}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.cols.w{grid-template-columns:1.25fr 1fr}
.card{background:var(--surface-2);border-radius:.8em;padding:.9em 1.1em}
.card h3{display:flex;gap:.45em;align-items:center}
.card p{font-size:.95em}
.card.hl{background:var(--accent-soft)}
.card.warn{background:var(--warn-soft)}
.card.warn h3{color:var(--warn)}
.card.ok{background:var(--ok-soft)}
.ic{width:1.3em;height:1.3em;flex:none;color:var(--primary)}
.warn .ic{color:var(--warn)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:.8em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em}
.big{font-size:1.5em;font-weight:800;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35em 1em;align-items:baseline}
.kv dt{font-family:var(--mono);font-size:.8em;font-weight:600;color:var(--primary);white-space:nowrap}
.kv dd{margin:0}
.callout{border-left:.3em solid var(--accent);background:var(--accent-soft);padding:.7em 1em;border-radius:0 .6em .6em 0;color:var(--ink)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.quote{font-size:1.25em;font-weight:600;color:var(--ink);line-height:1.4}
table.t{border-collapse:collapse;width:100%;font-size:.95em}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.45em .6em;text-align:left;vertical-align:top}
table.t th{color:var(--ink);font-size:.85em;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.phrase{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:.1em .45em;border-radius:.35em;color:var(--ink)}

/* Title slide */
.cover{display:flex;flex-direction:column;justify-content:center;height:100%;gap:.3em;background:
  radial-gradient(60em 30em at 110% -10%,var(--primary-soft),transparent 60%),
  linear-gradient(transparent 0 0)}
.cover .logo{width:5.2em;margin-bottom:1em}
.cover .meta{margin-top:1.6em;display:flex;gap:2.2em;flex-wrap:wrap;font-size:.9em}
.cover .meta b{display:block;color:var(--ink)}
.cover .strip{position:absolute;left:0;right:0;bottom:0;height:.55em;background:linear-gradient(90deg,var(--primary) 0 60%,var(--accent) 60% 100%)}
.read .cover{min-height:26em;position:relative}

/* Figures */
figure.fig{margin:.6em 0 0}
figure.fig svg{width:100%;height:auto;max-height:17em;display:block;color:var(--ink)}
figure.fig figcaption{font-size:.82em;color:var(--muted);margin-top:.4em}
.s-box{fill:var(--surface);stroke:var(--primary);stroke-width:2}
.s-soft{fill:var(--primary-soft);stroke:var(--primary);stroke-width:2}
.s-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.s-hl{fill:var(--accent);stroke:none}
.s-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.s-line{stroke:currentColor;stroke-width:2;fill:none}
.s-dash{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 6;fill:none}
.s-warnline{stroke:var(--warn);stroke-width:2.2;fill:none}
.s-t{fill:currentColor;font-family:var(--font);font-size:15px;font-weight:700}
.s-s{fill:var(--muted);font-family:var(--font);font-size:12.5px;font-weight:500}
.s-tw{fill:var(--warn);font-family:var(--font);font-size:13px;font-weight:700}
.s-ta{fill:var(--accent-ink);font-family:var(--font);font-size:15px;font-weight:800}
.s-hd{fill:var(--primary);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em}

/* Assessment bar */
.assess{display:flex;height:3.4em;border-radius:.6em;overflow:hidden;margin:.6em 0 .4em;font-size:.9em}
.assess div{display:flex;flex-direction:column;justify-content:center;padding:0 .8em;color:var(--primary-ink);min-width:0}
.assess div b{font-size:1.15em}
.assess .a1{background:var(--primary)}
.assess .a2{background:var(--accent);color:var(--accent-ink)}
.assess .a3{background:color-mix(in srgb,var(--primary) 70%,var(--ink))}
.assess .a4{background:var(--warn);color:#fff}
.weeks{display:grid;grid-template-columns:repeat(16,1fr);gap:.25em;margin-top:.8em}
.weeks span{font-family:var(--mono);font-size:.7em;text-align:center;padding:.35em 0;border-radius:.35em;background:var(--surface-2);color:var(--muted)}
.weeks span.ex{background:var(--warn-soft);color:var(--warn);font-weight:700}
.weeks span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* Chat mockup */
.chat{background:var(--surface-2);border-radius:.8em;padding:.8em;display:grid;gap:.45em;font-size:.92em}
.chat .who{font-size:.75em;color:var(--muted);font-weight:700}
.bub{max-width:88%;padding:.45em .7em;border-radius:.8em;background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.bub.me{justify-self:end;background:var(--primary-soft)}
.bub small{display:block;color:var(--muted);font-size:.72em;text-align:right}

/* Glossary term + tooltip */
.term{border-bottom:2px dotted var(--primary);cursor:help;color:inherit;font-weight:600;background:none;padding:0;border-top:0;border-left:0;border-right:0;font-size:inherit;line-height:inherit;font-family:inherit}
.tip{position:fixed;z-index:60;max-width:300px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;box-shadow:var(--shadow);pointer-events:none}
.tip b{display:block;font-size:14px}
.tip i{display:block;color:var(--accent);font-style:normal;font-weight:700;font-size:12.5px;margin-top:4px}
.gl dt{font-weight:700;color:var(--ink)}
.gl dd{margin:0 0 .5em}
.gl dd i{color:var(--primary);font-style:normal;font-weight:600}
.gl{columns:2;column-gap:2em;font-size:.92em}
.gl div{break-inside:avoid}

/* Quiz */
.quiz{display:grid;gap:.5em;margin-bottom:.9em}
.quiz .q{font-weight:700;color:var(--ink);margin:0}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.quiz button{border:1px solid var(--line);background:var(--surface);border-radius:.55em;padding:.45em .7em;text-align:left;cursor:pointer;font-size:.92em}
.quiz button:hover{border-color:var(--primary)}
.quiz button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.quiz button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.quiz .fb{font-size:.88em;margin:0;min-height:1.3em;color:var(--ink)}

/* Placeholder */
.soonbox{display:flex;flex-direction:column;justify-content:center;height:100%}
.soonbox .pill{align-self:flex-start;margin-bottom:1em}

/* Closing */
.closing{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;background:radial-gradient(50em 26em at 50% 120%,var(--accent-soft),transparent 70%)}
.read .closing{min-height:24em}
.closing h1{font-size:3.6em;margin-bottom:.2em}
.closing .qwrap{max-width:34em;min-height:6.5em;position:relative;z-index:2}
.closing .qt{font-size:1.3em;font-weight:600;color:var(--ink);line-height:1.4;transition:opacity .5s}
.closing .qa{margin-top:.5em;color:var(--muted);font-size:.9em;transition:opacity .5s}
.closing .emo{position:absolute;inset:0;pointer-events:none;z-index:1}
.closing .emo span{position:absolute;bottom:-2em;font-size:1.8em;opacity:.8;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14em) translateX(1em) rotate(12deg)}100%{transform:translateY(-30em) translateX(-1em) rotate(-8deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.closing .emo span{animation:none;display:none}.side{transition:none}.bar i{transition:none}}

/* Menu button for phone */
.menu-t{display:none}
@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:50;transform:translateX(-100%);box-shadow:var(--shadow);visibility:hidden}
  .app.open .side{transform:none;visibility:visible}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .top .lbl{display:none}
  .slide{padding:1.8em 2em}
  .read .slide{padding:1.4em 1.2em}
  .cols,.cols.w,.cols.c3{grid-template-columns:1fr}
  .grid5,.grid4{grid-template-columns:1fr 1fr}
  .quiz .opts{grid-template-columns:1fr}
  .gl{columns:1}
}
@media print{.side,.top,.ctrl{display:none}}

/* ===== Revisi v2 ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.cite{color:var(--muted);font-weight:500;font-size:.85em;white-space:nowrap}
.en{font-style:italic}
.notes dl.nt{margin:.2em 0 0;display:grid;gap:.15em}
.notes dl.nt dt{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-top:.55em}
.notes dl.nt dt:first-child{margin-top:.1em}
.notes dl.nt dd{margin:0;font-size:14.5px;line-height:1.55}
.notes dl.nt dd ul,.notes dl.nt dd ol{margin:.2em 0;padding-left:1.2em}
ol.refs{list-style:none;padding:0;margin:.4em 0 0;display:grid;gap:.55em}
ol.refs li{padding-left:2.2em;text-indent:-2.2em;margin:0;line-height:1.45}
.closing .emo span{opacity:.4}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
.grid3>*,.grid4>*,.grid5>*,.cols>*{min-width:0}
.card{overflow-wrap:break-word}
@media (max-width:600px){.grid3,.grid5,.grid4{grid-template-columns:1fr!important}.read .slide{font-size:15.5px}}
.card.obek{font-size:.84em}
.stage .gl{columns:3;column-gap:1.6em;font-size:.8em}
.stage .gl dd{margin-bottom:.35em}
.stage .quiz{gap:.28em;margin-bottom:.45em}
.stage .quiz button{padding:.32em .6em}
.stage .quiz .fb{min-height:1.1em}
.read{grid-template-columns:minmax(0,1fr)}.view{min-width:0}
.notes .nhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.notes .nhead h4{margin:0}
.lockb{display:inline-flex;align-items:center;gap:4px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.lockb svg{width:13px;height:13px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.modal form{width:min(380px,100%);background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.modal h2{margin:0 0 4px;font-size:18px;color:var(--ink);display:flex;gap:8px;align-items:center}
.modal h2 svg{width:18px;height:18px;color:var(--primary)}
.modal p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.modal input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.modal input:focus{outline:3px solid var(--accent);outline-offset:1px}
.modal .err{color:var(--bad);font-size:13px;min-height:1.3em;margin:6px 0 10px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.modal .row button{font:inherit;font-size:13.5px;font-weight:700;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.modal .row button.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* ===== Revisi v3.1 (MPSI): URL panjang di referensi, slide padat ===== */
ol.refs li{overflow-wrap:anywhere}
.stage ol.refs{font-size:.9em;gap:.4em}
.stage .gl{font-size:.74em}


/* ===== Revisi v3.3 (KMO): judul berkata panjang di HP, kuis lebih rapat ===== */
@media (max-width:600px){.read .soonbox h1,.read .cover h1,.read .closing h1{font-size:2.1em;overflow-wrap:break-word;hyphens:auto}}
.stage .quiz{gap:.2em;margin-bottom:.35em}
.stage .quiz .opts{gap:.25em}

/* ===== Tema Brutalism (v4) =====
   Sumber gaya: skill "brutalism" (typeui.sh / awesome-design-skills).
   Koral #DD614C · mustard #DAA144 · tinta #111827 · kertas #F4F1EA.
   Judul: Darker Grotesque · isi: Atkinson Hyperlegible Next · label: JetBrains Mono. */
:root{
  --coral:#DD614C; --mustard:#DAA144; --paper:#F4F1EA;
  --bg:#F4F1EA; --surface:#FFFFFF; --surface-2:#F1ECE1; --ink:#111827; --ink-2:#1F2937; --muted:#4B5563;
  --line:#111827; --rule:#D8D0BF; --hatch:#E7E1D3;
  --primary:#B5412E; --primary-ink:#FFFFFF; --primary-soft:#F9DED7;
  --accent:#DAA144; --accent-soft:#F7E9CC; --accent-ink:#111827;
  --green:#15803D; --warn:#A1350E; --warn-soft:#FBE2D3; --ok:#15803D; --ok-soft:#DDF3E3; --bad:#B91C1C; --bad-soft:#FDE2E2;
  --side-bg:#DAA144; --side-ink:#111827; --side-muted:#2B2B2B;
  --bw:2px; --sh:5px; --r:6px;
  --shadow:var(--sh) var(--sh) 0 var(--line);
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Darker Grotesque","Atkinson Hyperlegible Next",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1C1C1C; --surface-2:#262626; --ink:#F5F3EE; --ink-2:#E7E3DA; --muted:#BDB7AA;
    --line:#F5F3EE; --rule:#3A3A3A; --hatch:#222;
    --primary:#F29482; --primary-ink:#111111; --primary-soft:#3D241E;
    --accent:#DAA144; --accent-soft:#3A2F18; --accent-ink:#111111;
    --green:#6FD39A; --warn:#FFA071; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
    --side-bg:#181818; --side-ink:#F5F3EE; --side-muted:#BDB7AA;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --surface-2:#262626; --ink:#F5F3EE; --ink-2:#E7E3DA; --muted:#BDB7AA;
  --line:#F5F3EE; --rule:#3A3A3A; --hatch:#222;
  --primary:#F29482; --primary-ink:#111111; --primary-soft:#3D241E;
  --accent:#DAA144; --accent-soft:#3A2F18; --accent-ink:#111111;
  --green:#6FD39A; --warn:#FFA071; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
  --side-bg:#181818; --side-ink:#F5F3EE; --side-muted:#BDB7AA;
}
body{background-color:var(--bg);background-image:linear-gradient(var(--hatch) 1px,transparent 1px),linear-gradient(90deg,var(--hatch) 1px,transparent 1px);background-size:32px 32px;font-size:16.5px}
:focus-visible{outline:3px dashed var(--coral);outline-offset:3px;border-radius:2px}

/* Sidebar: blok mustard dengan garis tegas */
.side{background:var(--side-bg);color:var(--side-ink);border-right:3px solid var(--line)}
.brand{border-bottom:3px solid var(--line);background:var(--surface)}
.brand b{font-family:var(--display);font-weight:900;font-size:21px;line-height:.95;text-transform:uppercase;color:var(--ink)}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.side h3{font-family:var(--mono);color:var(--side-ink);letter-spacing:.1em}
.mlist{gap:6px;padding:0 12px 18px}
.mbtn{border:var(--bw) solid transparent;border-radius:4px;padding:6px 8px;color:var(--side-ink)}
.mbtn:hover{background:var(--surface);color:var(--ink);border-color:var(--line)}
.mbtn[aria-current="true"]{background:var(--coral);color:#111827;border-color:#111827;box-shadow:3px 3px 0 #111827}
.mbtn .no{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:2px}
.mbtn[aria-current="true"] .no{background:#111827;color:var(--mustard);border-color:#111827}
.mbtn .t{color:inherit;font-weight:700;font-size:14px}
.mbtn.soon .t{color:var(--side-muted);font-weight:500}
.mbtn[aria-current="true"] .t{color:#111827}
.tag{border-radius:2px;font-family:var(--mono);font-size:9.5px;border:1.5px solid currentColor}
.tag.soon{background:transparent;color:var(--side-muted)}
.tag.exam{background:#111827;color:var(--mustard);border-color:#111827}
.side .foot{border-top:3px solid var(--line);color:var(--side-ink);font-family:var(--mono);font-size:11px}

/* Bilah atas dan tombol */
.top{background:var(--bg);backdrop-filter:none;border-bottom:3px solid var(--line)}
.top .title{font-family:var(--display);font-weight:900;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.005em}
.top .title small{font-family:var(--font);text-transform:none;font-size:12.5px;font-weight:600;margin-top:3px}
.ibtn,.seg{border:var(--bw) solid var(--line);border-radius:4px;background:var(--surface);box-shadow:3px 3px 0 var(--line);font-weight:700}
.ibtn:hover{border-color:var(--line);background:var(--accent-soft)}
.ibtn:active{transform:translate(3px,3px);box-shadow:none}
.ibtn[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--coral);color:#111827;border-color:var(--line)}
.seg{overflow:hidden}
.seg button{border-radius:0;font-weight:700}
.seg button+button{border-left:var(--bw) solid var(--line)}

/* Panggung slide */
.stage{border:3px solid var(--line);border-radius:8px;box-shadow:8px 8px 0 var(--line)}
.ctrl .count{font-weight:700;color:var(--ink)}
.bar{height:12px;border:var(--bw) solid var(--line);border-radius:2px;background:var(--surface)}
.bar i{background:var(--coral);border-radius:0}
.hint{font-family:var(--mono);font-size:11px}
.read .slide{border:3px solid var(--line);border-radius:8px;box-shadow:6px 6px 0 var(--line)}
.notes{background:var(--accent-soft);border:var(--bw) solid var(--line);border-left:10px solid var(--mustard);border-radius:4px}
.notes h4,.notes dl.nt dt{font-family:var(--mono)}
.notes dl.nt dt{color:var(--primary)}
.lockb{border:1.5px solid var(--line);border-radius:3px}

/* Tipografi slide */
.slide{color:var(--ink-2);line-height:1.5}
.slide h1,.slide h2{font-family:var(--display);color:var(--ink);letter-spacing:0;line-height:.92}
.slide h1{font-size:3.6em;font-weight:900;text-transform:uppercase}
.slide h2{font-size:2.55em;font-weight:900;margin-bottom:.45em}
.slide h3{font-weight:700}
.slide li::marker{color:var(--primary)}
.eyebrow{color:var(--ink);font-weight:700}
.eyebrow .chip{background:var(--ink);color:var(--mustard);border-radius:2px;padding:.2em .6em}
.lead{font-weight:500}
.muted{color:var(--muted)}

/* Kartu, callout, tabel */
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:4px 4px 0 var(--line)}
.card.hl{background:var(--accent-soft)}
.card.warn{background:var(--warn-soft)}
.card.ok{background:var(--ok-soft)}
.ic{color:var(--primary)}
.callout{background:var(--accent-soft);border:var(--bw) solid var(--line);border-left:.45em solid var(--coral);border-radius:4px;color:var(--ink)}
.callout.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.quote{font-weight:700}
.kv dt{color:var(--primary);font-weight:700}
table.t{border:var(--bw) solid var(--line)}
table.t th{background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.72em;letter-spacing:.06em;border-bottom:0}
table.t th,table.t td{border-bottom:1px solid var(--rule)}
table.t td+td,table.t th+th{border-left:1px solid var(--rule)}
.phrase{background:var(--accent-soft);border:1px solid var(--line);border-radius:2px}

/* Sampul dan penutup */
.cover{background:linear-gradient(var(--hatch) 1px,transparent 1px) 0 0/2em 2em,linear-gradient(90deg,var(--hatch) 1px,transparent 1px) 0 0/2em 2em,var(--surface)}
.cover .meta b{font-family:var(--mono);font-size:.8em;text-transform:uppercase;letter-spacing:.06em}
.cover .strip{height:.9em;border-top:3px solid var(--line);background:linear-gradient(90deg,var(--coral) 0 55%,var(--mustard) 55% 85%,#111827 85% 100%)}
.closing{background:linear-gradient(var(--hatch) 1px,transparent 1px) 0 0/2em 2em,linear-gradient(90deg,var(--hatch) 1px,transparent 1px) 0 0/2em 2em,var(--surface)}
.closing h1{font-size:4.6em}
.closing .qwrap{background:var(--accent-soft);border:var(--bw) solid var(--line);box-shadow:4px 4px 0 var(--line);padding:.8em 1.1em;border-radius:4px}
.closing .qa{font-family:var(--mono);font-size:.75em}

/* Diagram SVG */
.s-box{fill:var(--surface);stroke:var(--line);stroke-width:2.5}
.s-soft{fill:var(--primary-soft);stroke:var(--line);stroke-width:2.5}
.s-acc{fill:var(--accent-soft);stroke:var(--line);stroke-width:2.5}
.s-hl{fill:var(--mustard)}
.s-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2.5}
.s-dash{stroke:var(--muted)}
.s-hd{fill:var(--ink);font-weight:700}
.s-t{font-weight:700}
.s-s{fill:var(--muted);font-weight:500}

/* Batang penilaian dan minggu */
.assess{border:var(--bw) solid var(--line);border-radius:4px}
.assess div+div{border-left:var(--bw) solid var(--line)}
.assess .a1{background:var(--coral);color:#111827}
.assess .a2{background:var(--mustard);color:#111827}
.assess .a3{background:#111827;color:#F4F1EA}
.assess .a4{background:var(--surface);color:var(--ink)}
.weeks span{border:1.5px solid var(--line);border-radius:2px;background:var(--surface)}
.weeks span.on{background:var(--coral);color:#111827}
.weeks span.ex{background:#111827;color:var(--mustard)}

/* Chat, istilah, kuis */
.chat{background:var(--surface-2);border:var(--bw) solid var(--line);border-radius:6px}
.bub{border:1.5px solid var(--line);box-shadow:none;border-radius:6px}
.bub.me{background:var(--primary-soft)}
.term{border-bottom:2px dotted var(--primary);font-weight:700}
.tip{background:#111827;color:#F4F1EA;border:2px solid var(--mustard);border-radius:4px;box-shadow:4px 4px 0 var(--mustard)}
.tip i{color:var(--mustard)}
.gl dd i{color:var(--primary)}
.quiz .q{font-weight:700}
.quiz button{border:var(--bw) solid var(--line);border-radius:4px;background:var(--surface);box-shadow:3px 3px 0 var(--line);font-weight:600}
.quiz button:hover{background:var(--accent-soft);border-color:var(--line)}
.quiz button.right{background:var(--ok-soft);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.quiz button.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}

/* Kerangka "soon" dan dialog */
.soonbox .pill{font-size:.75em;padding:.3em .7em}
.tag.pill.soon{color:var(--ink)}
.modal form{border:3px solid var(--line);border-radius:6px;box-shadow:8px 8px 0 var(--line)}
.modal h2{font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase}
.modal input{border:var(--bw) solid var(--line);border-radius:4px}
.modal .row button{border:var(--bw) solid var(--line);border-radius:4px;box-shadow:3px 3px 0 var(--line)}
.modal .row button.pri{background:var(--coral);color:#111827;border-color:var(--line)}

@media (max-width:900px){
  .top .title{font-size:18px}
  .side{border-right:3px solid var(--line)}
}
@media (max-width:600px){
  .read .slide{box-shadow:4px 4px 0 var(--line)}
  .card{box-shadow:3px 3px 0 var(--line)}
}
/* Penyesuaian mode gelap dan HP */
.eyebrow .chip{background:#111827;color:var(--mustard)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .eyebrow .chip,:root:not([data-theme="light"]) .tag.exam{background:var(--mustard);color:#111111;border-color:var(--mustard)}
}
:root[data-theme="dark"] .eyebrow .chip,:root[data-theme="dark"] .tag.exam{background:var(--mustard);color:#111111;border-color:var(--mustard)}
@media (max-width:600px){
  .top{gap:6px;padding:8px 12px}
  .top .title{font-size:16px;min-width:0}
  .top .title small{display:none}
  .stage{box-shadow:4px 4px 0 var(--line)}
}

/* ===== Kutipan teks asli + terjemahan (v4.2) ===== */
.qt{margin:0 0 .6em}
.qt:last-child{margin-bottom:0}
.qt .ar{font-family:'Amiri','Noto Naskh Arabic','Scheherazade New',serif;font-size:1.35em;line-height:1.85;direction:rtl;text-align:right;margin:0 0 .3em;color:var(--ink)}
.qt .quote{display:block;margin:0;font-size:1.05em}
.qt .quote[lang="en"]{font-style:italic}
.qt .tr{margin:.35em 0 0;font-size:.95em;color:var(--ink-2)}
.qt .src{margin-top:.4em;font-size:.8em;color:var(--muted)}
.cols.wr{grid-template-columns:1fr 1.3fr}
.slide .qt .quote{font-size:1em;font-weight:600;line-height:1.4}
.slide .qt .quote[lang="en"]{font-weight:500}
.slide .qt .tr{font-size:.92em;line-height:1.45}
@media (max-width:900px){.cols.wr{grid-template-columns:1fr}}
.qh{display:flex;align-items:center;gap:.4em;margin:0 0 .5em}

</style>
</head>

const GLOSSARY={"communication":{"t":"Communication","d":"Proses menciptakan makna bersama melalui pesan, baik verbal maupun nonverbal.","id":"komunikasi"},"sender":{"t":"Sender","d":"Pihak yang memulai dan menyampaikan pesan; disebut juga source.","id":"pengirim / komunikator"},"receiver":{"t":"Receiver","d":"Pihak yang menerima lalu menafsirkan pesan.","id":"penerima / komunikan"},"message":{"t":"Message","d":"Isi yang ingin disampaikan: kata-kata, nada suara, gerak tubuh, gambar, atau emoji.","id":"pesan"},"channel":{"t":"Channel","d":"Jalur yang dilalui pesan: tatap muka, telepon, WhatsApp, email.","id":"saluran / media"},"feedback":{"t":"Feedback","d":"Respons penerima yang menunjukkan bagaimana pesan dipahami.","id":"umpan balik"},"noise":{"t":"Noise","d":"Apa pun yang mengganggu pesan sehingga makna yang diterima berbeda dari yang dimaksud.","id":"gangguan"},"context":{"t":"Context","d":"Situasi di sekitar komunikasi: tempat, waktu, budaya, dan hubungan antarpihak.","id":"konteks"},"encoding":{"t":"Encoding","d":"Mengubah gagasan menjadi kata, simbol, atau tindakan.","id":"penyandian"},"decoding":{"t":"Decoding","d":"Mengubah kata, simbol, atau tindakan kembali menjadi makna.","id":"penafsiran pesan"},"jargon":{"t":"Jargon","d":"Istilah khusus suatu kelompok atau bidang yang sering tidak dipahami orang luar.","id":"istilah teknis / bahasa khusus"},"model":{"t":"Model","d":"Gambaran sederhana tentang cara kerja suatu proses.","id":"model"},"irreversible":{"t":"Irreversible","d":"Tidak dapat ditarik kembali. Pesan yang sudah diterima tidak bisa dihapus dari ingatan penerima.","id":"tidak dapat ditarik kembali"},"interpersonal":{"t":"Interpersonal communication","d":"Interaksi verbal dan nonverbal antara dua orang (atau sedikit lebih) yang saling bergantung.","id":"komunikasi antarpribadi"},"self-concept":{"t":"Self-concept","d":"Gambaran yang Anda miliki tentang siapa diri Anda.","id":"konsep diri"},"self-esteem":{"t":"Self-esteem","d":"Penilaian Anda tentang seberapa berharga diri Anda.","id":"harga diri"},"self-disclosure":{"t":"Self-disclosure","d":"Mengungkapkan informasi tentang diri sendiri yang sebelumnya tidak diketahui orang lain.","id":"pengungkapan diri"},"johari":{"t":"Johari Window","d":"Model empat area kesadaran diri: open, blind, hidden, dan unknown.","id":"Jendela Johari"},"perception":{"t":"Perception","d":"Proses memilih, menata, dan menafsirkan apa yang kita lihat dan dengar.","id":"persepsi"},"perception-checking":{"t":"Perception checking","d":"Memastikan tafsiran kita dengan menggambarkan apa yang diamati lalu menanyakannya langsung.","id":"pengecekan persepsi"},"stereotype":{"t":"Stereotype","d":"Gambaran yang tetap dan disederhanakan tentang seluruh anggota suatu kelompok.","id":"stereotip"},"primacy":{"t":"Primacy effect","d":"Kecenderungan informasi yang datang pertama paling kuat memengaruhi penilaian kita.","id":"efek kesan pertama"},"self-serving":{"t":"Self-serving bias","d":"Kecenderungan mengaitkan keberhasilan dengan diri sendiri dan kegagalan dengan faktor luar.","id":"bias melayani diri"},"self-fulfilling":{"t":"Self-fulfilling prophecy","d":"Dugaan yang menjadi kenyataan karena kita bertindak seolah-olah dugaan itu sudah benar.","id":"ramalan yang memenuhi dirinya sendiri"},"hearing":{"t":"Hearing","d":"Proses fisik ketika bunyi masuk ke telinga. Terjadi otomatis.","id":"mendengar (secara fisik)"},"listening":{"t":"Listening","d":"Proses mental aktif: menerima, memahami, mengingat, menilai, dan merespons pesan.","id":"menyimak / mendengarkan"},"active-listening":{"t":"Active listening","d":"Mendengarkan dengan perhatian penuh dan menunjukkan kepada pembicara bahwa Anda memahaminya.","id":"mendengar aktif"},"paraphrase":{"t":"Paraphrase","d":"Mengungkapkan kembali gagasan pembicara dengan kata-kata sendiri untuk memastikan pemahaman.","id":"parafrase"},"empathy":{"t":"Empathy","d":"Memahami perasaan orang lain dari sudut pandang orang itu.","id":"empati"},"sympathy":{"t":"Sympathy","d":"Merasa kasihan terhadap orang lain dari sudut pandang diri sendiri.","id":"simpati / rasa iba"},"as-shidqu":{"t":"As Shidqu","d":"Kejujuran dalam ucapan dan perbuatan; salah satu nilai inti Unusida (CPL-1).","id":"kejujuran"},"verbal":{"t":"Verbal message","d":"Pesan yang memakai kata-kata, baik lisan maupun tulisan.","id":"pesan verbal"},"nonverbal":{"t":"Nonverbal message","d":"Pesan tanpa kata: ekspresi wajah, tatapan, gerak tubuh, nada suara, jarak, sentuhan, penampilan, dan waktu.","id":"pesan nonverbal"},"denotation":{"t":"Denotation","d":"Makna kamus sebuah kata yang relatif sama bagi semua orang.","id":"makna denotatif"},"connotation":{"t":"Connotation","d":"Makna emosional atau penilaian yang melekat pada kata, bisa berbeda antarorang.","id":"makna konotatif"},"paralanguage":{"t":"Paralanguage","d":"Cara sesuatu diucapkan: nada, volume, tempo, jeda, dan penekanan.","id":"paralinguistik"},"proxemics":{"t":"Proxemics","d":"Kajian tentang penggunaan jarak dan ruang dalam berkomunikasi.","id":"proksemik / jarak komunikasi"},"haptics":{"t":"Haptics","d":"Komunikasi melalui sentuhan, mis. bersalaman.","id":"haptik / komunikasi sentuhan"},"chronemics":{"t":"Chronemics","d":"Makna yang muncul dari penggunaan waktu, mis. ketepatan waktu.","id":"kronemik / komunikasi waktu"},"congruence":{"t":"Congruence","d":"Keselarasan antara pesan verbal dan nonverbal sehingga keduanya membawa makna yang sama.","id":"keselarasan pesan"},"passive":{"t":"Passive style","d":"Gaya yang memendam pendapat dan kebutuhan sendiri demi menghindari konflik.","id":"gaya pasif"},"aggressive":{"t":"Aggressive style","d":"Gaya yang memaksakan kehendak dan mengabaikan hak serta perasaan orang lain.","id":"gaya agresif"},"assertive":{"t":"Assertive style","d":"Gaya yang menyampaikan pendapat dan kebutuhan secara jujur, jelas, dan santun sambil menghormati orang lain.","id":"gaya asertif"},"i-message":{"t":"I-message","d":"Kalimat yang dimulai dari pengalaman dan perasaan diri (\"saya merasa…\"), bukan menuduh (\"kamu selalu…\").","id":"pesan-saya"},"small-group":{"t":"Small group","d":"Sekumpulan kecil orang (sekitar 3–12) yang berinteraksi untuk tujuan bersama dan saling memengaruhi.","id":"kelompok kecil"},"team":{"t":"Team","d":"Kelompok kecil dengan keahlian yang saling melengkapi, berkomitmen pada tujuan dan cara kerja bersama, serta saling bertanggung jawab atas hasilnya.","id":"tim"},"group-development":{"t":"Group development","d":"Tahap-tahap yang dilalui kelompok dari saling mengenal sampai bekerja efektif: forming, storming, norming, performing, adjourning.","id":"perkembangan kelompok"},"task-roles":{"t":"Task roles","d":"Peran yang membantu kelompok menyelesaikan tugas, mis. memberi usul, mencari informasi, merangkum, mencatat.","id":"peran tugas"},"maintenance-roles":{"t":"Maintenance roles","d":"Peran yang menjaga hubungan dan suasana kelompok, mis. menyemangati, menengahi, memberi giliran bicara.","id":"peran pemeliharaan"},"individual-roles":{"t":"Individual roles","d":"Peran yang mementingkan diri sendiri dan menghambat kelompok, mis. mendominasi, menolak tanpa alasan, mencari perhatian.","id":"peran individual (penghambat)"},"agenda":{"t":"Agenda","d":"Daftar butir yang akan dibahas dalam rapat, lengkap dengan tujuan, urutan, dan perkiraan waktu.","id":"agenda / acara rapat"},"minutes":{"t":"Minutes","d":"Catatan resmi rapat yang memuat peserta, pokok bahasan, keputusan, dan tindak lanjut.","id":"notulen / risalah rapat"},"action-item":{"t":"Action item","d":"Tugas hasil rapat yang jelas siapa pelaksananya, apa yang dikerjakan, dan kapan tenggatnya.","id":"butir tindak lanjut"},"facilitator":{"t":"Facilitator","d":"Orang yang memimpin jalannya rapat agar sesuai agenda, adil dalam giliran bicara, dan sampai pada keputusan.","id":"pemimpin rapat / fasilitator"},"timekeeper":{"t":"Timekeeper","d":"Anggota yang menjaga agar setiap butir agenda selesai sesuai waktu yang disepakati.","id":"pengatur waktu"},"at-taawun":{"t":"At Taawun","d":"Sikap saling menolong dan bekerja sama dalam kebaikan; salah satu nilai inti Unusida (CPL-1).","id":"tolong-menolong / kolaborasi"},"al-amanah":{"t":"Al Amanah","d":"Sikap dapat dipercaya dan menunaikan tanggung jawab yang diberikan; bagian dari nilai Al Amanah Wal Wafa Bil Ahdi (CPL-1).","id":"amanah / tanggung jawab"}};
const QUOTES=[{"q":"The great enemy of communication, we find, is the illusion of it.","a":"William H. Whyte","s":"\"Is Anybody Listening?\", Fortune, 1950"},{"q":"One cannot not communicate.","a":"Paul Watzlawick, Janet Beavin & Don Jackson","s":"Pragmatics of Human Communication, 1967"},{"q":"Most people do not listen with the intent to understand; they listen with the intent to reply.","a":"Stephen R. Covey","s":"The 7 Habits of Highly Effective People, 1989"},{"q":"Whoever believes in Allah and the Last Day, let him speak good or remain silent.","a":"Prophet Muhammad ﷺ","s":"Sahih al-Bukhari 6018; Sahih Muslim 47"},{"q":"We have two ears and one mouth, so that we may listen more and speak less.","a":"Zeno of Citium","s":"Diogenes Laertius, Lives of Eminent Philosophers, VII.23"}];
const MEETINGS=[{"no":1,"title":"Apa Itu Komunikasi?","subtitle":"Konsep, unsur, model, dan hambatan komunikasi","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 1</span><span>Communication Skill · SI24W32</span></div><h1>Apa Itu Komunikasi?</h1><p class=\"lead\">Konsep, unsur, model, dan hambatan komunikasi</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Program Studi</b>Sistem Informasi, Unusida</div><div><b>Semester</b>1 · 2 SKS</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-1</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan konsep, unsur, model, dan hambatan komunikasi (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian </h3><ol><li>Ketepatan menjelaskan unsur dan proses komunikasi.</li><li>Ketepatan membedakan model komunikasi linier, interaksional, dan transaksional.</li><li>Ketepatan mengidentifikasi hambatan komunikasi pada kasus.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-2</dt><dd>Mahasiswa mampu menyusun dan menyampaikan pesan lisan dan tulisan secara logis, kritis, dan sistematis dengan memperhatikan keberagaman budaya audiens.</dd><dt>CPL-6</dt><dd class=\"id\">Mampu menerapkan pemikiran logis, kritis, sistematis, dan inovatif dalam pengembangan serta implementasi sistem informasi, dengan memperhatikan nilai humaniora dan keberagaman budaya.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Tes Tulis (UTS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta perkuliahan</span><span>16 pertemuan · 2 SKS</span></div><h2>Bagaimana mata kuliah ini berjalan</h2><p>Anda akan <b>berlatih</b> berkomunikasi, bukan hanya membaca teorinya. Nilai akhir terdiri atas empat komponen:</p><div class=\"assess\" role=\"img\" aria-label=\"Penilaian: Tugas 1 30 persen, UTS 20 persen, Tugas 2 30 persen, UAS 20 persen\"><div class=\"a1\" style=\"width:30%\"><b>30%</b>Tugas 1</div><div class=\"a2\" style=\"width:20%\"><b>20%</b>UTS</div><div class=\"a3\" style=\"width:30%\"><b>30%</b>Tugas 2</div><div class=\"a4\" style=\"width:20%\"><b>20%</b>UAS</div></div><div class=\"cols\" style=\"margin-top:.8em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Tugas 1 · Pertemuan 2–7</h3><p>Portofolio praktik kelompok: rekaman <i>role-play</i> interpersonal, notulen simulasi rapat, dan presentasi hasil observasi komunikasi di satu organisasi (UMKM, instansi, atau pesantren).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/></svg>Tugas 2 · Pertemuan 9–15</h3><p>Proyek kelompok bersama mitra nyata: proposal bebas plagiasi, peta pemangku kepentingan, rencana komunikasi, email kepada mitra, dan <i>pitching</i> di depan panel.</p></div></div><div class=\"weeks\" aria-hidden=\"true\"><span class=\"on\">1</span><span class=\"\">2</span><span class=\"\">3</span><span class=\"\">4</span><span class=\"\">5</span><span class=\"\">6</span><span class=\"\">7</span><span class=\"ex\">8</span><span class=\"\">9</span><span class=\"\">10</span><span class=\"\">11</span><span class=\"\">12</span><span class=\"\">13</span><span class=\"\">14</span><span class=\"\">15</span><span class=\"ex\">16</span></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kontrak kuliah</span><span>Kita sepakati bersama</span></div><h2>Kesepakatan kelas kita</h2><div class=\"grid5\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Tepat waktu</h3><p>Hadir sebelum kelas dimulai. Kabari ketua kelas bila terlambat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><path d=\"M12 18h.01\"/></svg>Ponsel</h3><p>Mode senyap. Dipakai hanya untuk aktivitas kelas.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>Saling menghargai</h3><p>Dengarkan dulu. Hormati perbedaan pendapat (<i>tasamuh</i>).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Jujur</h3><p>Kumpulkan karya sendiri. Tidak menyalin-tempel (<i>As Shidqu</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Bertanya</h3><p>Silakan bertanya kapan saja. Tidak ada pertanyaan yang bodoh.</p></div></div><p class=\"muted\" style=\"margin-top:1em\">Ketentuan lain (kehadiran, keterlambatan pengumpulan tugas) mengikuti peraturan akademik Unusida.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Kapan pesan pernah salah dipahami?</h2><div class=\"cols w\"><div><p class=\"lead\">Ingat satu kejadian ketika Anda disalahpahami, atau Anda salah memahami orang lain.</p><ol><li>Apa pesannya?</li><li>Lewat apa pesan dikirim? (tatap muka, WhatsApp, telepon)</li><li>Apa salah pahamnya?</li></ol><p class=\"muted\">Ceritakan kepada pasangan Anda. Lalu 2–3 pasangan berbagi ke kelas.</p></div><div class=\"chat\" aria-label=\"Contoh percakapan\"><div class=\"who\">Grup Kelas SI-1A</div><div class=\"bub\">Besok kuliah jam 7 ya<small>21.04</small></div><div class=\"bub me\">Jam 7 pagi atau malam? 😅<small>21.06</small></div><div class=\"bub\">Pagi lah 🙄<small>21.30</small></div><div class=\"bub me\">Oh kirain online malam<small>21.31</small></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span></div><h2>Apa itu komunikasi?</h2><div class=\"cols w\"><div><p class=\"lead\">Kata <i>communication</i> berasal dari bahasa Latin <i>communis</i>, artinya <b>sama</b> atau <b>milik bersama</b>.</p><div class=\"callout\" style=\"margin:.8em 0\"><span class=\"quote\"><button type=\"button\" class=\"term\" data-term=\"communication\">Communication</button> adalah proses menciptakan <u>makna bersama</u> melalui pesan.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\">Definisi kerja mata kuliah ini</div></div><p>Empat kata kunci:</p><ul><li><b>Proses</b>: terus bergerak dan berubah, bukan satu momen.</li><li><b>Bersama</b>: melibatkan setidaknya dua pihak.</li><li><b>Makna</b>: tujuannya saling paham, bukan sekadar bicara.</li><li><b>Pesan</b>: kata, nada, gerak tubuh, gambar, emoji.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Cek cepat</h3><p>Teman membaca WhatsApp Anda lalu tidak membalas. <b>Apakah ini komunikasi?</b></p><p class=\"muted\">Simpan jawaban Anda. Kita jawab bersama di slide prinsip komunikasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Unsur</span><span>7 bagian</span></div><h2>Unsur-unsur komunikasi <span class=\"cite\">(DeVito, 2019)</span></h2><figure class=\"fig\"><svg viewBox=\"0 0 780 300\" role=\"img\" aria-label=\"Unsur komunikasi: sender menyandikan gagasan menjadi message, message melewati channel menuju receiver yang menafsirkannya, feedback kembali ke sender, noise dapat mengganggu, dan semuanya terjadi di dalam context.\"><defs><marker id=\"ar1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker><marker id=\"ar1w\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"8\" y=\"8\" width=\"764\" height=\"284\" rx=\"18\" class=\"s-dash\"/><text x=\"28\" y=\"34\" class=\"s-hd\">CONTEXT · tempat, waktu, budaya, hubungan</text><rect x=\"40\" y=\"110\" width=\"160\" height=\"76\" rx=\"12\" class=\"s-soft\"/><text x=\"120\" y=\"143\" text-anchor=\"middle\" class=\"s-t\">Sender</text><text x=\"120\" y=\"165\" text-anchor=\"middle\" class=\"s-s\">menyandikan gagasan</text><rect x=\"310\" y=\"110\" width=\"160\" height=\"76\" rx=\"12\" class=\"s-acc\"/><text x=\"390\" y=\"143\" text-anchor=\"middle\" class=\"s-t\">Message</text><text x=\"390\" y=\"165\" text-anchor=\"middle\" class=\"s-s\">melalui channel</text><rect x=\"580\" y=\"110\" width=\"160\" height=\"76\" rx=\"12\" class=\"s-soft\"/><text x=\"660\" y=\"143\" text-anchor=\"middle\" class=\"s-t\">Receiver</text><text x=\"660\" y=\"165\" text-anchor=\"middle\" class=\"s-s\">menafsirkan makna</text><line x1=\"202\" y1=\"148\" x2=\"306\" y2=\"148\" class=\"s-line\" marker-end=\"url(#ar1)\"/><text x=\"254\" y=\"138\" text-anchor=\"middle\" class=\"s-s\">encoding</text><line x1=\"472\" y1=\"148\" x2=\"576\" y2=\"148\" class=\"s-line\" marker-end=\"url(#ar1)\"/><text x=\"524\" y=\"138\" text-anchor=\"middle\" class=\"s-s\">decoding</text><path d=\"M660 188 C660 262 120 262 120 190\" class=\"s-line\" marker-end=\"url(#ar1)\"/><text x=\"390\" y=\"226\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Feedback</text><text x=\"390\" y=\"276\" text-anchor=\"middle\" class=\"s-s\">balasan, anggukan, emoji, bahkan diam</text><polyline points=\"360,50 372,66 386,52 398,68 412,54 424,70\" class=\"s-warnline\"/><line x1=\"392\" y1=\"74\" x2=\"392\" y2=\"104\" class=\"s-warnline\" marker-end=\"url(#ar1w)\"/><text x=\"440\" y=\"66\" class=\"s-tw\">Noise</text><text x=\"440\" y=\"84\" class=\"s-s\">mengganggu pesan</text></svg><figcaption>Unsur-unsur komunikasi, diadaptasi dari DeVito (2019). Komunikasi berhasil bila makna di pihak penerima mendekati makna yang dimaksud pengirim.</figcaption></figure><p style=\"margin-top:.5em\"><button type=\"button\" class=\"term\" data-term=\"sender\">Sender</button> · <button type=\"button\" class=\"term\" data-term=\"encoding\">Encoding</button> · <button type=\"button\" class=\"term\" data-term=\"message\">Message</button> · <button type=\"button\" class=\"term\" data-term=\"channel\">Channel</button> · <button type=\"button\" class=\"term\" data-term=\"receiver\">Receiver</button> · <button type=\"button\" class=\"term\" data-term=\"decoding\">Decoding</button> · <button type=\"button\" class=\"term\" data-term=\"feedback\">Feedback</button> · <button type=\"button\" class=\"term\" data-term=\"noise\">Noise</button> · <button type=\"button\" class=\"term\" data-term=\"context\">Context</button></p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Model</span><span>Dari satu arah ke makna bersama</span></div><h2>Tiga <button type=\"button\" class=\"term\" data-term=\"model\">model</button> komunikasi</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 250\" role=\"img\" aria-label=\"Tiga model komunikasi. Linear: panah satu arah dari A ke B. Interaksional: A dan B bergantian, message satu arah lalu feedback kembali. Transaksional: A dan B beririsan, saling mengirim dan menerima secara bersamaan.\"><defs><marker id=\"ar2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"140\" y=\"26\" text-anchor=\"middle\" class=\"s-hd\">LINEAR · 1949</text><circle cx=\"70\" cy=\"110\" r=\"38\" class=\"s-soft\"/><text x=\"70\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">A</text><circle cx=\"210\" cy=\"110\" r=\"38\" class=\"s-soft\"/><text x=\"210\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">B</text><line x1=\"110\" y1=\"110\" x2=\"168\" y2=\"110\" class=\"s-line\" marker-end=\"url(#ar2)\"/><text x=\"140\" y=\"186\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Satu arah</text><text x=\"140\" y=\"206\" text-anchor=\"middle\" class=\"s-s\">A berbicara, B hanya menerima</text><text x=\"140\" y=\"226\" text-anchor=\"middle\" class=\"s-s\">mis. pengumuman radio</text><line x1=\"300\" y1=\"30\" x2=\"300\" y2=\"230\" class=\"s-dash\"/><text x=\"450\" y=\"26\" text-anchor=\"middle\" class=\"s-hd\">INTERAKSIONAL · 1954</text><circle cx=\"380\" cy=\"110\" r=\"38\" class=\"s-soft\"/><text x=\"380\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">A</text><circle cx=\"520\" cy=\"110\" r=\"38\" class=\"s-soft\"/><text x=\"520\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">B</text><path d=\"M414 94 Q450 70 486 94\" class=\"s-line\" marker-end=\"url(#ar2)\"/><text x=\"450\" y=\"70\" text-anchor=\"middle\" class=\"s-s\">message</text><path d=\"M486 126 Q450 150 414 126\" class=\"s-line\" marker-end=\"url(#ar2)\"/><text x=\"450\" y=\"164\" text-anchor=\"middle\" class=\"s-s\">feedback</text><text x=\"450\" y=\"186\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Bergantian</text><text x=\"450\" y=\"206\" text-anchor=\"middle\" class=\"s-s\">kirim dulu, lalu dibalas</text><text x=\"450\" y=\"226\" text-anchor=\"middle\" class=\"s-s\">mis. chat WhatsApp</text><line x1=\"600\" y1=\"30\" x2=\"600\" y2=\"230\" class=\"s-dash\"/><text x=\"760\" y=\"26\" text-anchor=\"middle\" class=\"s-hd\">TRANSAKSIONAL · 1970</text><circle cx=\"725\" cy=\"110\" r=\"52\" class=\"s-acc\" style=\"fill-opacity:.8\"/><circle cx=\"795\" cy=\"110\" r=\"52\" class=\"s-soft\" style=\"fill-opacity:.8\"/><text x=\"700\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">A</text><text x=\"820\" y=\"116\" text-anchor=\"middle\" class=\"s-t\">B</text><line x1=\"746\" y1=\"96\" x2=\"774\" y2=\"96\" class=\"s-line\" marker-end=\"url(#ar2)\" marker-start=\"url(#ar2)\"/><line x1=\"746\" y1=\"124\" x2=\"774\" y2=\"124\" class=\"s-line\" marker-end=\"url(#ar2)\" marker-start=\"url(#ar2)\"/><text x=\"760\" y=\"186\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Bersamaan</text><text x=\"760\" y=\"206\" text-anchor=\"middle\" class=\"s-s\">saling kirim &amp; terima sekaligus</text><text x=\"760\" y=\"226\" text-anchor=\"middle\" class=\"s-s\">mis. mengobrol tatap muka</text></svg><figcaption>Linear: Shannon &amp; Weaver (1949). Interaksional: Schramm (1954). Transaksional: Barnlund (1970). Dari kiri ke kanan, penerima makin menjadi mitra aktif; pada model transaksional makna dibangun bersama.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Prinsip</span></div><h2>Lima prinsip yang perlu diingat</h2><div class=\"grid5\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Proses</h3><p>Komunikasi terus bergerak dan berubah dari waktu ke waktu.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Tak terhindarkan</h3><p>Kita tidak bisa tidak berkomunikasi. Diam pun mengirim pesan <span class=\"cite\">(Watzlawick dkk., 1967)</span>.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 7v6h6\"/><path d=\"M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13\"/></svg><button type=\"button\" class=\"term\" data-term=\"irreversible\">Irreversible</button></h3><p>Ucapan tidak bisa ditarik kembali. Tangkapan layar tersimpan selamanya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Dua tingkat</h3><p>Ada <b>isi</b> (apa yang dikatakan) dan <b>hubungan</b> (bagaimana kita memandang lawan bicara) <span class=\"cite\">(Watzlawick dkk., 1967)</span>.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/></svg>Kontekstual</h3><p>Kata yang sama bisa bermakna berbeda di tempat dan situasi berbeda.</p></div></div><p class=\"muted\" style=\"margin-top:.9em\">Prinsip-prinsip ini dibahas lebih lengkap dalam DeVito (2019).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Jenis</span><span>Dari satu orang ke jutaan</span></div><h2>Tingkatan komunikasi <span class=\"cite\">(DeVito, 2019)</span></h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Tingkatan</th><th>Siapa</th><th>Contoh dalam konteks kita</th></tr></thead><tbody><tr><td><b><i>Intrapersonal</i></b></td><td>Dengan diri sendiri</td><td>Merencanakan apa yang akan dikatakan sebelum menemui dosen wali</td></tr><tr><td><b><i>Interpersonal</i></b></td><td>Dua orang atau sedikit lebih</td><td>Santri berbicara dengan musyrif</td></tr><tr><td><b><i>Small group</i></b></td><td>Sekitar 3–12 orang dengan tujuan bersama</td><td>Rapat takmir masjid, tim proyek</td></tr><tr><td><b><i>Public</i></b></td><td>Satu pembicara, banyak pendengar</td><td>Sambutan saat wisuda</td></tr><tr><td><b><i>Mass &amp; digital</i></b></td><td>Melalui media ke banyak orang</td><td>UMKM mengunggah promosi di Instagram atau TikTok</td></tr></tbody></table></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Penting</span><span>Hambatan</span></div><h2>Apa yang menghambat komunikasi?</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 5 6 9H2v6h4l5 4V5Z\"/><path d=\"M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14\"/></svg>Fisik</h3><p>Ruangan bising, pengeras suara buruk, posisi terlalu jauh.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Fisiologis</h3><p>Kondisi tubuh: lelah, mengantuk, gangguan pendengaran.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>Psikologis</h3><p>Stres, marah, malu, prasangka terhadap pembicara.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Semantik</h3><p>Kata ambigu, <button type=\"button\" class=\"term\" data-term=\"jargon\">jargon</button>, salah ketik, satu kata bermakna berbeda.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Budaya</h3><p>Norma berbeda: langsung vs tidak langsung, formal vs santai.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76M2 2l20 20\"/></svg>Teknis</h3><p>Sinyal lemah, kuota habis, mikrofon rusak.</p></div></div><div class=\"callout warn\" style=\"margin-top:.8em\">Kebanyakan salah paham melibatkan <b>lebih dari satu</b> hambatan sekaligus.</div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Fisik, fisiologis, psikologis, dan semantik: jenis <i>noise</i> menurut DeVito (2019). Hambatan budaya: Samovar dkk. (2017), dibahas di Pertemuan 11.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Studi kasus</span><span>UMKM · Sidoarjo</span></div><h2>Pesanan yang salah kirim</h2><div class=\"cols w\"><div><p><b>Bu Sari</b> menjual keripik tempe dari rumahnya di Sidoarjo. Sebagian besar pesanan masuk lewat WhatsApp. Suatu malam, pelanggan baru mengirim pesan.</p><p>Bu Sari mengirim <b>10 bungkus kecil rasa original</b>. Pelanggan kecewa: ia butuh <b>10 kg rasa pedas</b> untuk acara pengajian hari Sabtu.</p><p class=\"lead\" style=\"margin-top:.8em\">Tugas kelompok (3 orang, 10 menit):</p><ol><li>Sebutkan sender, message, channel, receiver, dan feedback.</li><li>Hambatan apa saja yang Anda temukan?</li><li>Tulis ulang pesan pelanggan agar jelas.</li></ol></div><div class=\"chat\" aria-label=\"Percakapan WhatsApp antara pelanggan dan Bu Sari\"><div class=\"who\">Keripik Tempe Bu Sari</div><div class=\"bub\">Assalamualaikum bu, pesan keripiknya 10 ya, kirim besok 🙏<small>20.15</small></div><div class=\"bub me\">Waalaikumsalam, siap kak 👍<small>20.40</small></div><div class=\"bub\">...<small>Jumat 09.10</small></div><div class=\"bub\">Lho bu kok cuma segini? Buat acara pengajian 😢<small>Jumat 11.02</small></div></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi</span></div><h2>Mari berdiskusi</h2><ol class=\"lead\"><li>Model mana (linear, interaksional, transaksional) yang paling menggambarkan kuliah daring? Mengapa?</li><li>Berikan satu contoh hambatan semantik dalam keseharian Anda, dalam bahasa Indonesia atau bahasa daerah.</li><li>Bagaimana mahasiswa bisa mengurangi <i>noise</i> saat mengirim pesan WhatsApp kepada dosen?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Komunikasi adalah proses menciptakan <b>makna bersama</b>.</li><li>Tujuh unsur: sender, message, channel, receiver, feedback, noise, context.</li><li>Model berkembang dari <b>linear</b> ke <b>interaksional</b> ke <b>transaksional</b>.</li><li>Kita tidak bisa <i>tidak</i> berkomunikasi, dan ucapan tidak bisa ditarik kembali.</li><li>Hambatan: fisik, fisiologis, psikologis, semantik, budaya, dan teknis.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Hambatan semantik: makna &quot;sebelum Jumat&quot; tidak sama bagi pengirim dan penerima.\"><p class=\"q\">Dosen berkata \"Kumpulkan sebelum Jumat.\" Mahasiswa mengumpulkan pada hari Jumat. Kata \"sebelum\" menimbulkan hambatan…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. fisik</button><button type=\"button\" data-o=\"b\">B. semantik</button><button type=\"button\" data-o=\"c\">C. teknis</button><button type=\"button\" data-o=\"d\">D. budaya</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Transaksional (Barnlund, 1970): kedua pihak menjadi pengirim sekaligus penerima.\"><p class=\"q\">Model mana yang menyatakan kedua pihak mengirim dan menerima pesan pada saat yang sama?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Linear</button><button type=\"button\" data-o=\"b\">B. Interaksional</button><button type=\"button\" data-o=\"c\">C. Transaksional</button><button type=\"button\" data-o=\"d\">D. Broadcast</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"&quot;One cannot not communicate&quot;: diam pun mengirim pesan.\"><p class=\"q\">Teman membaca pesan Anda lalu diam saja. Menurut Watzlawick dkk. (1967), hal ini…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. bukan komunikasi</button><button type=\"button\" data-o=\"b\">B. tetap komunikasi</button><button type=\"button\" data-o=\"c\">C. hanya noise</button><button type=\"button\" data-o=\"d\">D. hanya channel</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab pengantar komunikasi interpersonal dalam DeVito (2019), <i>The Interpersonal Communication Book</i> (edisi ke-15).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menganalisis</h3><p>Tulis satu kasus nyata hambatan komunikasi yang Anda alami atau lihat minggu ini (150–200 kata, bahasa Indonesia). Sebutkan unsur-unsurnya, jenis hambatannya, dan cara memperbaikinya. Bawa ke Pertemuan 2.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Communication</span></dt><dd>Proses menciptakan makna bersama melalui pesan, baik verbal maupun nonverbal. <i>(komunikasi)</i></dd></div><div><dt><span class=\"en\">Sender</span></dt><dd>Pihak yang memulai dan menyampaikan pesan; disebut juga source. <i>(pengirim / komunikator)</i></dd></div><div><dt><span class=\"en\">Message</span></dt><dd>Isi yang ingin disampaikan: kata-kata, nada suara, gerak tubuh, gambar, atau emoji. <i>(pesan)</i></dd></div><div><dt><span class=\"en\">Channel</span></dt><dd>Jalur yang dilalui pesan: tatap muka, telepon, WhatsApp, email. <i>(saluran / media)</i></dd></div><div><dt><span class=\"en\">Receiver</span></dt><dd>Pihak yang menerima lalu menafsirkan pesan. <i>(penerima / komunikan)</i></dd></div><div><dt><span class=\"en\">Feedback</span></dt><dd>Respons penerima yang menunjukkan bagaimana pesan dipahami. <i>(umpan balik)</i></dd></div><div><dt><span class=\"en\">Noise</span></dt><dd>Apa pun yang mengganggu pesan sehingga makna yang diterima berbeda dari yang dimaksud. <i>(gangguan)</i></dd></div><div><dt><span class=\"en\">Context</span></dt><dd>Situasi di sekitar komunikasi: tempat, waktu, budaya, dan hubungan antarpihak. <i>(konteks)</i></dd></div><div><dt><span class=\"en\">Encoding</span></dt><dd>Mengubah gagasan menjadi kata, simbol, atau tindakan. <i>(penyandian)</i></dd></div><div><dt><span class=\"en\">Decoding</span></dt><dd>Mengubah kata, simbol, atau tindakan kembali menjadi makna. <i>(penafsiran pesan)</i></dd></div><div><dt><span class=\"en\">Model</span></dt><dd>Gambaran sederhana tentang cara kerja suatu proses. <i>(model)</i></dd></div><div><dt><span class=\"en\">Irreversible</span></dt><dd>Tidak dapat ditarik kembali. Pesan yang sudah diterima tidak bisa dihapus dari ingatan penerima. <i>(tidak dapat ditarik kembali)</i></dd></div><div><dt><span class=\"en\">Jargon</span></dt><dd>Istilah khusus suatu kelompok atau bidang yang sering tidak dipahami orang luar. <i>(istilah teknis / bahasa khusus)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>DeVito, J. A. (2019). <i>The interpersonal communication book</i> (15th ed.). Pearson.</li><li>Shannon, C. E., &amp; Weaver, W. (1949). <i>The mathematical theory of communication</i>. University of Illinois Press.</li><li>Schramm, W. (1954). How communication works. Dalam W. Schramm (Ed.), <i>The process and effects of mass communication</i>. University of Illinois Press.</li><li>Barnlund, D. C. (1970). A transactional model of communication. Dalam K. K. Sereno &amp; C. D. Mortensen (Eds.), <i>Foundations of communication theory</i>. Harper &amp; Row.</li><li>Watzlawick, P., Beavin, J. H., &amp; Jackson, D. D. (1967). <i>Pragmatics of human communication: A study of interactional patterns, pathologies, and paradoxes</i>. W. W. Norton.</li><li>Samovar, L. A., Porter, R. E., McDaniel, E. R., &amp; Roy, C. S. (2017). <i>Communication between cultures</i> (9th ed.). Cengage Learning.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Komunikasi Interpersonal (1)","subtitle":"Konsep diri, persepsi, mendengar aktif, dan empati","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Communication Skill · SI24W32</span></div><h1>Komunikasi Interpersonal (1)</h1><p class=\"lead\">Konsep diri, persepsi, mendengar aktif, dan empati</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Belajar + role-play</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menerapkan komunikasi interpersonal yang efektif: mendengar aktif, empati, verbal dan nonverbal, serta asertif (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 4)</span></h3><ol><li>Ketepatan melakukan parafrase dan klarifikasi saat mendengar aktif.</li><li>Keselarasan pesan verbal dan nonverbal. <span class=\"muted\">(Pertemuan 3)</span></li><li>Ketepatan memilih respons asertif dalam simulasi. <span class=\"muted\">(Pertemuan 3)</span></li><li>Kejujuran dan kesantunan dalam berkomunikasi.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menerapkan sikap jujur, amanah, taat norma, dan kolaboratif dalam komunikasi interpersonal, kerja tim, dan ruang digital.</dd><dt>CPL-1</dt><dd class=\"id\">Mampu mengintegrasikan sikap As Shidqu (kejujuran), Al Amanah Wal Wafa Bil Ahdi (bertanggung jawab), Al Adalah (selalu berpedoman pada norma dan peraturan yang berlaku) dan At Taawun (berkolaborasi) dalam perkembangan ilmu pengetahuan dan teknologi.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Praktik / Unjuk Kerja (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Sebutkan tujuh unsur komunikasi.</li><li>Apa beda model interaksional dan transaksional?</li><li>Berikan satu contoh hambatan semantik.</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span></div><h2>Apa itu komunikasi interpersonal?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Interpersonal communication is the verbal and nonverbal interaction between two (or sometimes more than two) interdependent people.\"</p><p class=\"tr\">\"Komunikasi interpersonal adalah interaksi verbal dan nonverbal antara dua (atau kadang lebih dari dua) orang yang saling bergantung.\"</p><div class=\"src\">DeVito (2019); terjemahan harfiah penyusun</div></blockquote><ul style=\"margin-top:.8em\"><li>Membangun dan mengubah <b>hubungan</b>.</li><li>Kedua pihak saling memengaruhi.</li><li>Bisa tatap muka atau daring.</li></ul></div><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Kampus</h3><p>Mahasiswa dan dosen wali</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Pesantren</h3><p>Santri dan musyrif</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>UMKM</h3><p>Admin toko daring dan pelanggan</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01\"/></svg>Rumah</h3><p>Anda dan orang tua</p></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Bagian 1</span><span>Mengenal diri</span></div><h2>Konsep diri: cara Anda memandang diri</h2><div class=\"cols\"><div><p><button type=\"button\" class=\"term\" data-term=\"self-concept\">Self-concept</button> Anda membentuk cara Anda berbicara dan mendengar. Sumbernya <span class=\"cite\">(DeVito, 2019)</span>:</p><ul><li><b>Pandangan orang lain</b>: apa kata orang tua, guru, dan teman tentang Anda.</li><li><b>Perbandingan sosial</b>: membandingkan diri dengan orang lain.</li><li><b>Ajaran budaya</b>: nilai dari keluarga, pesantren, dan masyarakat.</li><li><b>Evaluasi diri</b>: cara Anda menilai perbuatan sendiri.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Mengapa penting?</h3><p><button type=\"button\" class=\"term\" data-term=\"self-esteem\">Self-esteem</button> yang rendah bisa membuat Anda diam di kelas, padahal punya ide bagus. Konsep diri yang sehat membantu Anda bicara jelas dan menerima masukan.</p><p class=\"muted\">Coba ganti \"Saya tidak bisa presentasi\" menjadi \"Saya <b>belum</b> terbiasa presentasi\". Kata <i>belum</i> mengubah pesan kepada diri sendiri.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Model</span><span>Johari Window</span></div><h2>Empat area diri</h
