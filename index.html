rgin-top:.7em\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Belum gagasan sentral</h3><p>\"Komunikasi di UMKM.\" (hanya topik)<br>\"Kami akan membahas hasil observasi.\" (hanya pengumuman)</p></div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Gagasan sentral yang baik</h3><p>Satu kalimat lengkap, spesifik, menyatakan pesan utama, dan bisa dibuktikan dengan data observasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Indikator 1</span><span>Struktur</span></div><h2>Tiga bagian presentasi</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 230\" role=\"img\" aria-label=\"Struktur presentasi tiga bagian. Pembuka sekitar satu menit: tarik perhatian, ungkap topik, bangun kredibilitas, pratinjau isi. Isi sekitar empat menit: dua sampai lima pokok, pola urutan, data pendukung, penghubung. Penutup sekitar satu menit: tanda akhir, tegaskan gagasan sentral.\"><defs><marker id=\"ar9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"20\" width=\"200\" height=\"170\" rx=\"10\" class=\"s-soft\"/><text x=\"110\" y=\"46\" text-anchor=\"middle\" class=\"s-hd\">PEMBUKA · ±1 MENIT</text><text x=\"110\" y=\"82\" text-anchor=\"middle\" class=\"s-s\">tarik perhatian</text><text x=\"110\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">ungkap topik</text><text x=\"110\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">bangun kredibilitas</text><text x=\"110\" y=\"154\" text-anchor=\"middle\" class=\"s-s\">pratinjau isi</text><line x1=\"212\" y1=\"105\" x2=\"236\" y2=\"105\" class=\"s-line\" marker-end=\"url(#ar9)\"/><rect x=\"240\" y=\"20\" width=\"380\" height=\"170\" rx=\"10\" class=\"s-acc\"/><text x=\"430\" y=\"46\" text-anchor=\"middle\" class=\"s-hd\">ISI · ±4 MENIT</text><text x=\"430\" y=\"82\" text-anchor=\"middle\" class=\"s-s\">2–5 pokok utama yang mendukung gagasan sentral</text><text x=\"430\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">disusun dengan pola urutan yang jelas</text><text x=\"430\" y=\"130\" text-anchor=\"middle\" class=\"s-s\">setiap pokok didukung contoh, data, atau kesaksian</text><text x=\"430\" y=\"154\" text-anchor=\"middle\" class=\"s-s\">dihubungkan dengan transisi dan penanda</text><line x1=\"622\" y1=\"105\" x2=\"646\" y2=\"105\" class=\"s-line\" marker-end=\"url(#ar9)\"/><rect x=\"650\" y=\"20\" width=\"200\" height=\"170\" rx=\"10\" class=\"s-soft\"/><text x=\"750\" y=\"46\" text-anchor=\"middle\" class=\"s-hd\">PENUTUP · ±1 MENIT</text><text x=\"750\" y=\"94\" text-anchor=\"middle\" class=\"s-s\">beri tanda akhir</text><text x=\"750\" y=\"118\" text-anchor=\"middle\" class=\"s-s\">tegaskan</text><text x=\"750\" y=\"140\" text-anchor=\"middle\" class=\"s-s\">gagasan sentral</text><text x=\"430\" y=\"218\" text-anchor=\"middle\" class=\"s-s\">alokasi waktu: patokan kerja untuk presentasi 6 menit Tugas 1C (tidak berskala)</text></svg><figcaption>Fungsi pembuka, isi, dan penutup diadaptasi dari Lucas (2020). Alokasi waktu adalah patokan kerja mata kuliah ini.</figcaption></figure><div class=\"callout\" style=\"margin-top:.5em\">Susun <b>isi</b> lebih dulu, baru pembuka dan penutup. Pembuka yang baik baru bisa dirancang setelah Anda tahu apa yang akan dibuka.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Isi</span><span>Pokok, pola, penghubung</span></div><h2>Menyusun isi yang mudah diikuti</h2><div class=\"cols w\"><div><p><b><button type=\"button\" class=\"term\" data-term=\"main-points\">Pokok utama</button></b>: 2–5 pokok, masing-masing mendukung gagasan sentral. Pilih satu <button type=\"button\" class=\"term\" data-term=\"organizational-pattern\">pola urutan</button>:</p><div class=\"tw\"><table class=\"t\"><tbody><tr><td><b>Kronologis</b></td><td>urutan waktu atau langkah</td></tr><tr><td><b>Spasial</b></td><td>urutan tempat atau arah</td></tr><tr><td><b>Sebab-akibat</b></td><td>penyebab lalu dampak</td></tr><tr><td><b>Masalah-solusi</b></td><td>masalah lalu pemecahannya</td></tr><tr><td><b>Topikal</b></td><td>subtopik yang setara</td></tr></tbody></table></div></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg><button type=\"button\" class=\"term\" data-term=\"connective\">Penghubung</button></h3><ul><li><b>Transisi</b>: \"Itu masalahnya. Sekarang, apa solusinya?\"</li><li><b>Pratinjau internal</b>: \"Ada dua rekomendasi kami.\"</li><li><b>Ringkasan internal</b>: \"Jadi, penyebabnya dua: pesan tidak lengkap dan tanpa konfirmasi.\"</li><li><b><button type=\"button\" class=\"term\" data-term=\"signpost\">Penanda</button></b>: \"Pertama…\", \"Yang terpenting…\"</li></ul></div></div><p class=\"muted\" style=\"font-size:.85em;margin-top:.4em\">Pola urutan dan jenis penghubung menurut Lucas (2020).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Indikator 2</span><span>Argumen dan data</span></div><h2>Klaim yang didukung bukti</h2><div class=\"cols\"><div><p>Tiga jenis <button type=\"button\" class=\"term\" data-term=\"supporting-materials\">bahan pendukung</button> (Lucas, 2020):</p><div class=\"card\" style=\"margin-bottom:.5em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Contoh</h3><p>Kejadian nyata atau ilustrasi, mis. satu percakapan pesanan yang keliru.</p></div><div class=\"card\" style=\"margin-bottom:.5em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Statistik</h3><p>Angka dari pengamatan, mis. 9 dari 40 pesanan perlu klarifikasi ulang.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Kesaksian</h3><p>Pernyataan narasumber, mis. kutipan wawancara pemilik usaha.</p></div></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Rumus argumen sederhana</h3><ol><li><b>Klaim</b>: \"Pesanan sering salah paham.\"</li><li><b>Bukti</b>: \"9 dari 40 pesanan selama seminggu perlu ditanyakan ulang; 3 salah kirim.\"</li><li><b>Makna</b>: \"Artinya, hampir satu dari empat pesanan berisiko keliru.\"</li></ol><p class=\"muted\" style=\"font-size:.85em\">Definisi kerja mata kuliah ini. Angka: data ilustrasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Storytelling</span><span>Tekan Play atau klik tiap tahap</span></div><h2>Dari catatan observasi ke alur presentasi</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p6-alur&quot;,&quot;ms&quot;:3400,&quot;steps&quot;:[{&quot;t&quot;:&quot;Kenali audiens&quot;,&quot;en&quot;:&quot;Audience analysis&quot;,&quot;d&quot;:&quot;Teman sekelas dan dosen: sudah paham teori komunikasi, belum mengenal UMKM Bu Sari. Jadi: jangan ulang definisi, langsung ke situasi nyata.&quot;,&quot;ex&quot;:&quot;Catatan: \\&quot;Audiens tahu hambatan semantik (Pertemuan 1).\\&quot;&quot;},{&quot;t&quot;:&quot;Rumuskan gagasan sentral&quot;,&quot;en&quot;:&quot;Central idea&quot;,&quot;d&quot;:&quot;Satu kalimat: salah paham pesanan terjadi karena pesan tidak lengkap dan tanpa konfirmasi ulang; format pesanan dan konfirmasi ulang dapat menguranginya.&quot;,&quot;ex&quot;:&quot;Tujuan umum: menginformasikan dengan rekomendasi.&quot;},{&quot;t&quot;:&quot;Pilih pokok dan pola&quot;,&quot;en&quot;:&quot;Main points · problem-solution&quot;,&quot;d&quot;:&quot;Pola masalah-solusi: (1) cara pesanan masuk lewat WhatsApp, (2) hambatan yang ditemukan, (3) dua rekomendasi.&quot;,&quot;ex&quot;:&quot;Tiga judul slide isi sudah terlihat dari sini.&quot;},{&quot;t&quot;:&quot;Pasang bahan pendukung&quot;,&quot;en&quot;:&quot;Supporting materials&quot;,&quot;d&quot;:&quot;Contoh: satu tangkapan layar chat (nama disamarkan). Statistik: 9 dari 40 pesanan perlu ditanyakan ulang, 3 salah kirim. Kesaksian: kutipan wawancara Bu Sari.&quot;,&quot;ex&quot;:&quot;\\&quot;Saya kira 10 itu bungkus, Mas.\\&quot; (kesaksian, data ilustrasi)&quot;},{&quot;t&quot;:&quot;Rancang pembuka dan penutup&quot;,&quot;en&quot;:&quot;Introduction · conclusion&quot;,&quot;d&quot;:&quot;Pembuka: tampilkan chat \\&quot;pesan keripiknya 10 ya\\&quot; lalu tanya audiens 10 apa. Penutup: kembali ke chat yang sama, kini dengan format pesanan, lalu tegaskan gagasan sentral.&quot;,&quot;ex&quot;:&quot;Cerita pembuka dan penutup saling menjawab.&quot;},{&quot;t&quot;:&quot;Buat slide dan berlatih&quot;,&quot;en&quot;:&quot;Visual aids · rehearsal&quot;,&quot;d&quot;:&quot;Satu pesan per slide, judul berupa kalimat temuan, maksimal 8 slide isi. Latih dengan pengatur waktu 6 menit dan bagi giliran bicara.&quot;,&quot;ex&quot;:&quot;Gladi minimal dua kali; rekam satu kali.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Langkah diadaptasi dari proses penyusunan presentasi dalam Lucas (2020). Kasus UMKM Keripik Tempe Bu Sari: kasus ilustrasi, angka ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Indikator 1</span><span>Pembuka dan penutup</span></div><h2>Buka dengan kuat, tutup dengan jelas</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/></svg>Cara menarik perhatian</h3><ul><li>Kaitkan topik dengan audiens</li><li>Ajukan pertanyaan</li><li>Ceritakan kejadian singkat</li><li>Tampilkan fakta yang mengejutkan</li><li>Bangkitkan rasa ingin tahu</li><li>Kutipan yang relevan</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Penutup yang baik</h3><ul><li>Beri tanda akhir: \"Sebagai penutup…\"</li><li>Ringkas pokok utama</li><li>Tegaskan gagasan sentral</li><li>Kembali ke cerita atau pertanyaan pembuka</li></ul></div></div><div class=\"cols\" style=\"margin-top:.6em\"><div class=\"callout warn\"><b>Hindari</b>: \"Langsung saja ya…\", membaca definisi komunikasi, \"Sekian dari kami, mohon maaf bila ada salah.\"</div><div class=\"callout\"><b>Coba</b>: \"Pesan ini masuk pukul 20.15: <i>pesan keripiknya 10 ya</i>. Menurut Anda, 10 apa?\"</div></div><p class=\"muted\" style=\"font-size:.85em;margin-top:.4em\">Diadaptasi dari pembahasan pembuka dan penutup dalam Lucas (2020).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Indikator 3</span><span>Desain slide</span></div><h2>Slide membantu audiens, bukan naskah pembicara</h2><div class=\"cols w\"><div><p>Pedoman <button type=\"button\" class=\"term\" data-term=\"visual-aid\">alat bantu visual</button> (diadaptasi dari Lucas, 2020):</p><ul><li>Siapkan jauh sebelum tampil</li><li>Buat sederhana: satu pesan per slide</li><li>Cukup besar untuk terbaca dari belakang ruangan</li><li>Huruf dan warna dipakai dengan hemat dan kontras</li><li>Gambar dipilih karena memperjelas, bukan hiasan</li><li>Tampilkan saat dibahas; bicara kepada audiens, bukan kepada layar</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Patokan kerja Tugas 1C</h3><ul><li>Judul slide berupa kalimat temuan</li><li>Isi ±6 baris pendek, tanpa paragraf</li><li>Huruf judul ±32 pt, isi minimal ±24 pt</li><li>Teks gelap di latar terang (atau sebaliknya)</li><li>Sumber data dan gambar ditulis kecil di bawah</li><li>Maksimal 8 slide isi</li></ul><p class=\"muted\" style=\"font-size:.85em\">Definisi kerja mata kuliah ini.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Sebelum dan sesudah</span></div><h2>Memperbaiki satu slide</h2><div class=\"cols\"><div class=\"card warn\" style=\"font-size:.78em\"><div class=\"eyebrow\" style=\"margin:0 0 .4em\"><span class=\"chip\">Sebelum</span></div><h3 style=\"margin:.1em 0 .3em\">HASIL OBSERVASI</h3><p style=\"margin:0;line-height:1.35\">Berdasarkan hasil observasi yang kami lakukan selama satu minggu terhadap pesanan yang masuk melalui WhatsApp, kami menemukan bahwa banyak pesanan yang tidak jelas sehingga penjual harus menanyakan kembali kepada pelanggan, bahkan ada beberapa pesanan yang salah kirim karena penjual salah memahami jumlah, rasa, dan alamat yang dimaksud oleh pelanggan…</p></div><div class=\"card ok\"><div class=\"eyebrow\" style=\"margin:0 0 .4em\"><span class=\"chip\">Sesudah</span></div><h3 style=\"margin:.1em 0 .4em\">Hampir 1 dari 4 pesanan perlu ditanyakan ulang</h3><div role=\"img\" aria-label=\"Diagram batang: 31 pesanan jelas, 9 perlu ditanyakan ulang, dari 40 pesanan\" style=\"display:flex;height:1.6em;border:2px solid var(--line);border-radius:4px;overflow:hidden;font-size:.8em;font-weight:700\"><div style=\"width:77.5%;background:var(--surface-2);display:flex;align-items:center;padding-left:.4em\">31 jelas</div><div style=\"width:22.5%;background:var(--accent);color:#111827;display:flex;align-items:center;justify-content:center\">9</div></div><ul style=\"margin-top:.5em\"><li>Penyebab: jumlah tanpa satuan, rasa, alamat</li><li>3 pesanan salah kirim</li></ul><p class=\"muted\" style=\"font-size:.8em;margin:0\">Sumber: observasi kelompok, 40 pesanan WhatsApp, satu minggu (data ilustrasi).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Nilai</span><span>Qaulan baligha · As Shidqu</span></div><h2>Perkataan yang sampai ke hati, data yang jujur</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"ar\" lang=\"ar\" dir=\"rtl\">…وَعِظْهُمْ وَقُلْ لَّهُمْ فِيْٓ اَنْفُسِهِمْ قَوْلًا ۢ بَلِيْغًا</p><p class=\"quote\">\"…nasihatilah mereka, dan katakanlah kepada mereka perkataan yang membekas pada jiwanya.\"</p><div class=\"src\">QS. An-Nisa' [4]: 63 (potongan) · Terjemahan Kemenag RI (2019)</div></blockquote><p style=\"margin-top:.6em\"><i>Qaulan baligha</i>: pesan yang jelas, tepat sasaran, dan membekas pada pendengarnya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Jujur saat presentasi</h3><p style=\"margin:.2em 0 .4em\">Wujud <button type=\"button\" class=\"term\" data-term=\"as-shidqu\">As Shidqu</button>:</p><ul><li>Angka berasal dari pengamatan sendiri; cara menghitungnya bisa dijelaskan</li><li>Tidak membesar-besarkan temuan</li><li>Nama dan nomor pelanggan disamarkan</li><li>Observasi dan foto dengan izin organisasi</li><li>Sumber gambar dan data dicantumkan</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Workshop + gladi kerangka · 35 menit</span></div><h2>Rancang presentasi Tugas 1C</h2><div class=\"cols w\"><div><p><b>Langkah:</b></p><ol><li><b>10 menit</b>: isi lembar kerangka (kanan).</li><li><b>10 menit</b>: sketsa dua slide: satu slide temuan dan satu slide rekomendasi.</li><li><b>15 menit</b>: dua kelompok bergabung. Masing-masing melakukan gladi <b>2 menit</b>: pembuka, peta isi, dan penutup, sambil menunjukkan sketsa slide. Kelompok lain mengisi penilaian sejawat (slide berikutnya).</li></ol><p class=\"muted\">Setiap anggota ikut berbicara saat gladi.</p></div><div class=\"card hl\" style=\"font-size:.9em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg>Lembar kerangka</h3><ol><li>Audiens: apa yang sudah dan belum mereka ketahui?</li><li>Gagasan sentral (satu kalimat)</li><li>Pola urutan dan 2–5 pokok utama</li><li>Bukti untuk tiap pokok: contoh, angka, kesaksian</li><li>Kalimat pembuka dan kalimat penutup</li><li>Pembagian pembicara dan durasi per bagian</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Umpan balik gladi kerangka</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;p6-sejawat&quot;,&quot;title&quot;:&quot;Penilaian sejawat · Gladi kerangka presentasi (Communication Skill P6)&quot;,&quot;levels&quot;:[&quot;Belum tampak&quot;,&quot;Mulai tampak&quot;,&quot;Tampak&quot;,&quot;Menonjol&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 3 · UMKM keripik&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik yang Anda lihat atau dengar&quot;,&quot;tipLabel&quot;:&quot;Saran (pakai pesan-saya)&quot;,&quot;tipPh&quot;:&quot;\\&quot;Saya sempat bingung saat… akan lebih jelas bila…\\&quot;&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu banyak latihan&quot;},{&quot;min&quot;:10,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:14,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:18,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Pembuka&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Langsung masuk tanpa pengantar, atau hanya membaca definisi.&quot;,&quot;Menyebut topik, tetapi belum menarik perhatian.&quot;,&quot;Menarik perhatian dan menyebut topik dengan jelas.&quot;,&quot;Menarik perhatian, terkait audiens, dan memberi pratinjau isi.&quot;]},{&quot;t&quot;:&quot;Gagasan sentral dan pokok&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Pesan utama tidak terdengar; pokok tidak jelas.&quot;,&quot;Pesan utama ada, tetapi pokok belum berurutan.&quot;,&quot;Gagasan sentral jelas dan pokok mengikuti satu pola.&quot;,&quot;Gagasan sentral tajam; pokok runtut dengan penghubung yang jelas.&quot;]},{&quot;t&quot;:&quot;Dukungan data&quot;,&quot;ind&quot;:&quot;Indikator 2&quot;,&quot;d&quot;:[&quot;Hanya opini, tanpa contoh atau angka.&quot;,&quot;Ada contoh atau angka, tetapi tidak dijelaskan maknanya.&quot;,&quot;Klaim didukung contoh atau angka dari observasi.&quot;,&quot;Klaim, bukti, dan makna lengkap; sumber data jelas.&quot;]},{&quot;t&quot;:&quot;Penutup&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Berhenti tiba-tiba atau hanya \\&quot;sekian dari kami\\&quot;.&quot;,&quot;Ada tanda akhir, tetapi gagasan sentral tidak ditegaskan.&quot;,&quot;Memberi tanda akhir dan menegaskan gagasan sentral.&quot;,&quot;Penutup kuat, mis. kembali ke cerita pembuka, dan mudah diingat.&quot;]},{&quot;t&quot;:&quot;Sketsa slide&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Penuh paragraf atau tidak terbaca.&quot;,&quot;Terbaca, tetapi terlalu banyak teks.&quot;,&quot;Satu pesan per slide, judul jelas, huruf cukup besar.&quot;,&quot;Judul berupa temuan, visual memperjelas angka, sumber dicantumkan.&quot;]}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.5em\">Isian hanya tersimpan di perangkat Anda. Tekan Copy summary, lalu kirim ke kelompok yang dinilai.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1C</span><span>Sub-CPMK-4 · 10%</span></div><h2>Presentasi hasil observasi di Pertemuan 7</h2><div class=\"cols c3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/></svg>Presentasi</h3><p>6 menit presentasi + 2 menit tanya jawab. Setiap anggota berbicara.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Slide</h3><p>Maksimal 8 slide isi (di luar judul dan penutup), .pptx atau .pdf.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg>Ringkasan observasi</h3><p>PDF maksimal 2 halaman: organisasi, cara observasi, temuan, rekomendasi.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Unggah di penugasan <b>Tugas 1C</b> di Elin. Tenggat: <b>Rabu, 4 November 2026, 23.59 WIB</b> (hari presentasi). Rubrik penilaian ada di Elin: struktur, argumen dan data, desain slide, vokal dan bahasa tubuh, serta tanya jawab.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Mulai dari audiens: apa yang mereka tahu, minati, dan butuhkan.</li><li>Rumuskan satu gagasan sentral; setiap pokok dan slide harus mendukungnya.</li><li>Struktur: pembuka menarik, isi 2–5 pokok dengan pola dan penghubung, penutup menegaskan pesan.</li><li>Dukung klaim dengan bukti (contoh, statistik, kesaksian) dan jelaskan maknanya.</li><li>Slide membantu audiens: satu pesan per slide, terbaca, jujur pada data.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · satu per satu</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p6-kuis&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Menurut Lucas (2020), merancang presentasi sebaiknya dimulai dari…&quot;,&quot;o&quot;:[&quot;membuat slide&quot;,&quot;memikirkan audiens&quot;,&quot;memilih kutipan pembuka&quot;,&quot;menghafal naskah&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Pembicara berpusat pada audiens: isi, contoh, bahasa, dan slide dipilih setelah mengenali audiens.&quot;},{&quot;q&quot;:&quot;Mana yang merupakan gagasan sentral, bukan sekadar topik?&quot;,&quot;o&quot;:[&quot;Komunikasi di kantor desa.&quot;,&quot;Kami akan membahas hasil observasi kami.&quot;,&quot;Antrean di kantor desa panjang karena informasi syarat surat tidak diumumkan; papan informasi dan pesan WhatsApp dapat menguranginya.&quot;,&quot;Observasi komunikasi pelayanan publik.&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Gagasan sentral adalah satu kalimat lengkap yang menyatakan pesan utama dan bisa dibuktikan.&quot;},{&quot;q&quot;:&quot;\\&quot;Itu tadi masalahnya. Sekarang, apa yang bisa dilakukan?\\&quot; Kalimat ini adalah…&quot;,&quot;o&quot;:[&quot;transisi&quot;,&quot;statistik&quot;,&quot;kesaksian&quot;,&quot;gagasan sentral&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Transisi menghubungkan satu bagian dengan bagian berikutnya (dari masalah ke solusi).&quot;},{&quot;q&quot;:&quot;\\&quot;9 dari 40 pesanan perlu ditanyakan ulang\\&quot; termasuk bahan pendukung jenis…&quot;,&quot;o&quot;:[&quot;contoh&quot;,&quot;statistik&quot;,&quot;kesaksian&quot;,&quot;kutipan&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Angka hasil pengamatan adalah statistik. Jangan lupa jelaskan maknanya bagi audiens.&quot;},{&quot;q&quot;:&quot;Penutup presentasi yang paling tepat adalah…&quot;,&quot;o&quot;:[&quot;\\&quot;Sekian dari kami, mohon maaf bila ada salah.\\&quot;&quot;,&quot;Menampilkan slide \\&quot;Terima kasih\\&quot; tanpa kata-kata&quot;,&quot;Menyampaikan tanda akhir, menegaskan gagasan sentral, lalu kembali ke cerita pembuka&quot;,&quot;Menambahkan temuan baru yang belum dibahas&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Penutup memberi tanda akhir dan menegaskan gagasan sentral; merujuk kembali ke pembuka membuatnya mudah diingat.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols c3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Menonton dan menganalisis</h3><p>Tonton satu contoh presentasi berbahasa Indonesia (mis. kuliah umum atau talk show edukatif). Catat: cara membuka, gagasan sentral, pola isi, data, penutup, dan slide. Bahasa Indonesia, setengah halaman.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2M12 19v3\"/></svg>Berlatih dan merekam</h3><p>Perbaiki kerangka dan slide Tugas 1C sesuai umpan balik hari ini. Gladi penuh minimal dua kali dengan pengatur waktu 6 menit; rekam satu kali dan tonton bersama kelompok.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Persiapan Pertemuan 7: bab tentang menyampaikan pidato (vokal dan bahasa tubuh) dalam Lucas (2020).</p></div></div><p class=\"muted\" style=\"margin-top:.8em\">Ingat juga tenggat Tugas 1B (rapat kelompok dan rencana kerja Tugas 1C) di Elin.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Audience-centered</span></dt><dd>Sikap pembicara yang menyusun presentasi berdasarkan kebutuhan, pengetahuan, dan minat audiens, bukan hanya keinginan pembicara. <i>(berpusat pada audiens)</i></dd></div><div><dt><span class=\"en\">Audience analysis</span></dt><dd>Kegiatan mengenali siapa audiens: latar belakang, pengetahuan, minat, dan sikap mereka terhadap topik. <i>(analisis audiens)</i></dd></div><div><dt><span class=\"en\">Demographic audience analysis</span></dt><dd>Analisis ciri umum audiens, mis. usia, latar pendidikan, agama, budaya, dan keanggotaan kelompok. <i>(analisis demografis audiens)</i></dd></div><div><dt><span class=\"en\">Situational audience analysis</span></dt><dd>Analisis situasi presentasi: jumlah audiens, tempat, waktu, serta sikap audiens terhadap topik, pembicara, dan acara. <i>(analisis situasional audiens)</i></dd></div><div><dt><span class=\"en\">General purpose</span></dt><dd>Tujuan umum presentasi, mis. menginformasikan atau membujuk. <i>(tujuan umum)</i></dd></div><div><dt><span class=\"en\">Specific purpose</span></dt><dd>Satu kalimat yang menyebut apa yang ingin dicapai pada audiens tertentu setelah presentasi. <i>(tujuan khusus)</i></dd></div><div><dt><span class=\"en\">Central idea</span></dt><dd>Satu kalimat pernyataan yang merangkum pesan utama presentasi. <i>(gagasan sentral)</i></dd></div><div><dt><span class=\"en\">Main points</span></dt><dd>Gagasan pokok (biasanya 2–5) yang mendukung gagasan sentral dan menjadi kerangka isi presentasi. <i>(pokok-pokok utama)</i></dd></div><div><dt><span class=\"en\">Organizational pattern</span></dt><dd>Pola urutan pokok-pokok: kronologis, spasial, sebab-akibat, masalah-solusi, atau topikal. <i>(pola urutan)</i></dd></div><div><dt><span class=\"en\">Connective</span></dt><dd>Kata atau kalimat penghubung antarbagian: transisi, pratinjau internal, ringkasan internal, dan penanda (signpost). <i>(penghubung)</i></dd></div><div><dt><span class=\"en\">Signpost</span></dt><dd>Penanda singkat posisi dalam presentasi, mis. \"pertama\", \"poin kedua\", \"yang terpenting\". <i>(penanda arah)</i></dd></div><div><dt><span class=\"en\">Supporting materials</span></dt><dd>Bahan pendukung gagasan: contoh, statistik, dan kesaksian (testimony). <i>(bahan pendukung)</i></dd></div><div><dt><span class=\"en\">Visual aid</span></dt><dd>Media yang dilihat audiens untuk memperjelas pesan, mis. slide, grafik, foto, atau benda. <i>(alat bantu visual)</i></dd></div><div><dt><span class=\"en\">Storytelling</span></dt><dd>Menyampaikan gagasan dalam alur cerita (situasi, masalah, perubahan) agar mudah diikuti dan diingat. <i>(bercerita)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Bovée, C. L., &amp; Thill, J. V. (2021). <i>Business communication today</i> (15th ed.). Pearson.</li><li>Lucas, S. E. (2020). <i>The art of public speaking</i> (13th ed.). McGraw-Hill Education.</li><li>Kementerian Agama Republik Indonesia. (2019). <i>Al-Qur'an dan terjemahannya</i> (Edisi penyempurnaan 2019). Lajnah Pentashihan Mushaf Al-Qur'an.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 7.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":7,"title":"Public Speaking","subtitle":"Vokal, bahasa tubuh, tanya jawab · presentasi Tugas 1","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 7</span><span>Sub-CPMK-4 (Pertemuan 6–7) · CPMK-2 · CPL-6</span></div><h1>Public Speaking</h1><p class=\"lead\">Vokal, bahasa tubuh, tanya jawab · presentasi Tugas 1</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu merancang dan menyampaikan presentasi lisan yang logis, sistematis, dan didukung media visual (C3–C4).</div><p class=\"m (function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    const slideHTML='<section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section>';
    const restHTML='<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    /* Full screen: keep the same #stage element so the browser stays in full screen; only swap its content */
    const fsEl=document.fullscreenElement;
    if(fsEl&&fsEl.id==='stage'&&fsEl.parentNode===v){
      fsEl.innerHTML=slideHTML;
      Array.from(v.children).forEach(c=>{if(c!==fsEl)c.remove();});
      fsEl.insertAdjacentHTML('afterend',restHTML);
    } else {
      v.innerHTML='<div class="stage" id="stage">'+slideHTML+'</div>'+restHTML;
    }
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  mountW(v); startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});
document.addEventListener('click',e=>{const t=e.target.closest('.term'); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(!e.target.closest('.tip')) hideTip();
  if(e.target.closest('[data-lock]')){lockNotes();return;}
  const qb=e.target.closest('.quiz button'); if(qb){const q=qb.closest('.quiz'); if(q.dataset.done)return; q.dataset.done=1; const ok=qb.dataset.o===q.dataset.ans;
    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea,select'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if((k===' '||k==='Enter')&&e.target.closest&&e.target.closest('button,a,summary'))return; /* let focused buttons work */
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage')&&!e.target.closest('input,textarea,.g2-svg'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Interactive widgets (v4.4) ----------
   Slide HTML holds <div class="sim" data-sim="type" data-cfg="{json}">, made by W() in data.js.
   Built-in types: quizset, stepper, grid2, scenario, peer. Course-specific types: SIMS in data.js.
   UI labels in English; all content comes from cfg (Indonesian). State lives in memory per widget id. */
const WST={};
let wTimers=[];
const WIDGETS={quizset:wQuiz,stepper:wStep,grid2:wGrid,scenario:wScen,peer:wPeer};
function mountW(scope){
  wTimers.forEach(clearInterval); wTimers=[];
  scope.querySelectorAll('[data-sim]').forEach(el=>{
    let cfg={}; try{cfg=JSON.parse(el.getAttribute('data-cfg')||'{}');}catch(e){}
    const id=cfg.id||'w'; if(!WST[id]) WST[id]={};
    const f=WIDGETS[el.dataset.sim]||(typeof SIMS!=='undefined'&&SIMS[el.dataset.sim]);
    if(!f){el.innerHTML='<p class="muted">Unknown widget.</p>';return;}
    try{f(el,cfg,WST[id]);}catch(e){el.innerHTML='<p class="muted">This simulation could not be loaded.</p>';if(window.console)console.error(e);}
  });
}
const kb=e=>e&&e.detail===0; // activated from keyboard
function refocus(el,sel){const b=el.querySelector(sel);if(b)b.focus({preventScroll:true});}

/* Quiz, one question at a time, with score */
function wQuiz(el,cfg,s){
  const Q=cfg.items||[]; if(s.i===undefined){s.i=0;s.ans=[];}
  const L='ABCDEF';
  const draw=()=>{
    if(s.i>=Q.length){
      const ok=Q.filter((q,i)=>s.ans[i]===q.a).length;
      el.innerHTML='<div class="qs-end"><div class="qs-score" aria-live="polite"><b>'+ok+'</b><span>/ '+Q.length+'</span></div><div><p class="qs-msg">'+(ok===Q.length?'Excellent!':ok>=Math.ceil(Q.length*.6)?'Good work.':'Review the material and try again.')+'</p>'+
        '<ol class="qs-rev">'+Q.map((q,i)=>'<li class="'+(s.ans[i]===q.a?'ok':'no')+'"><span>'+q.q+'</span><small>'+L[q.a]+'. '+q.o[q.a]+'</small></li>').join('')+'</ol>'+
        '<button type="button" class="wbtn" data-act="again">↺ Try again</button></div></div>';
      return;
    }
    const q=Q[s.i], a=s.ans[s.i], done=a!==undefined;
    el.innerHTML='<div class="qs-top"><span>Question '+(s.i+1)+' of '+Q.length+'</span><span class="qs-dots" aria-hidden="true">'+
      Q.map((x,i)=>'<i class="'+(i===s.i?'cur ':'')+(s.ans[i]===undefined?'':(s.ans[i]===x.a?'ok':'no'))+'"></i>').join('')+'</span></div>'+
      '<p class="q">'+q.q+'</p><div class="opts">'+q.o.map((o,i)=>'<button type="button" data-o="'+i+'" class="'+(done&&i===q.a?'right':'')+(done&&i===a&&i!==q.a?' wrong':'')+'"'+(done?' aria-disabled="true"':'')+'>'+L[i]+'. '+o+'</button>').join('')+'</div>'+
      '<p class="fb" aria-live="polite">'+(done?(a===q.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.why:'')+'</p>'+
      '<div class="qs-nav"><button type="button" class="wbtn" data-act="prev"'+(s.i?'':' disabled')+'>← Back</button><button type="button" class="wbtn pri" data-act="next"'+(done?'':' disabled')+'>'+(s.i===Q.length-1?'See score':'Next question')+' →</button></div>';
  };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b||b.disabled) return;
    if(b.dataset.o!==undefined){ if(s.ans[s.i]!==undefined) return; s.ans[s.i]=+b.dataset.o; draw(); if(kb(e)) refocus(el,'[data-act=next]'); return; }
    const act=b.dataset.act;
    if(act==='next') s.i++; else if(act==='prev') s.i=Math.max(0,s.i-1); else if(act==='again'){s.i=0;s.ans=[];}
    draw(); if(kb(e)) refocus(el,s.i>=Q.length?'[data-act=again]':'.opts button');
  };
  draw();
}

/* Animated step-by-step process (Play / ← →) */
function wStep(el,cfg,s){
  const S=cfg.steps||[]; if(s.i===undefined) s.i=0;
  el.innerHTML='<ol class="st-row" style="--n:'+S.length+'">'+S.map((x,i)=>'<li><button type="button" data-i="'+i+'"><span class="st-no">'+(i+1)+'</span><span class="st-t">'+x.t+'</span>'+(x.en?'<span class="st-en">'+x.en+'</span>':'')+'</button></li>').join('')+'</ol>'+
    '<div class="st-bar" aria-hidden="true"><i></i></div><div class="st-panel" aria-live="polite"></div>'+
    '<div class="st-nav"><button type="button" class="wbtn" data-act="prev" aria-label="Previous step">←</button><button type="button" class="wbtn pri" data-act="play">▶ Play</button><button type="button" class="wbtn" data-act="next" aria-label="Next step">→</button></div>';
  let timer=null;
  const playBtn=el.querySelector('[data-act=play]');
  const show=()=>{
    el.querySelectorAll('.st-row button').forEach((b,i)=>{b.classList.toggle('on',i===s.i);b.classList.toggle('done',i<s.i);b.setAttribute('aria-current',i===s.i?'step':'false');});
    el.querySelector('.st-bar i').style.width=(S.length>1?s.i/(S.length-1)*100:100)+'%';
    const p=el.querySelector('.st-panel'), x=S[s.i];
    p.classList.remove('in'); void p.offsetWidth;
    p.innerHTML='<h4>'+(s.i+1)+'. '+x.t+(x.en?' <span class="st-en">'+x.en+'</span>':'')+'</h4><p>'+x.d+'</p>'+(x.ex?'<p class="st-ex">'+x.ex+'</p>':'');
    p.classList.add('in');
  };
  const stop=()=>{ if(timer){clearInterval(timer);timer=null;} playBtn.textContent='▶ Play'; };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.i!==undefined){ stop(); s.i=+b.dataset.i; show(); return; }
    const act=b.dataset.act;
    if(act==='prev'){ stop(); s.i=Math.max(0,s.i-1); show(); }
    else if(act==='next'){ stop(); s.i=Math.min(S.length-1,s.i+1); show(); }
    else if(act==='play'){
      if(timer){ stop(); return; }
      if(s.i>=S.length-1){ s.i=0; show(); }
      playBtn.textContent='❚❚ Pause';
      timer=setInterval(()=>{ if(!el.isConnected||s.i>=S.length-1){ stop(); return; } s.i++; show(); }, cfg.ms||2800);
      wTimers.push(timer);
    }
  };
  show();
}

/* Two-axis simulation: sliders (or click/drag) move a point across labelled zones */
function wGrid(el,cfg,s){
  const Z=cfg.zones||[], max=cfg.max||10;
  if(s.x===undefined){ s.x=(cfg.init||[max/2,max/2])[0]; s.y=(cfg.init||[max/2,max/2])[1]; }
  const W=320,H=320,PL=40,PB=40,PT=10,PR=10;
  const X=v=>PL+v/max*(W-PL-PR), Y=v=>H-PB-v/max*(H-PB-PT);
  const zoneOf=()=>Z.find(z=>s.x>=z.r[0]&&s.x<=z.r[1]&&s.y>=z.r[2]&&s.y<=z.r[3])||Z[Z.length-1];
  const rects=Z.slice().reverse().map(z=>{const v=z.v||z.r, x0=X(v[0]),x1=X(v[1]),y0=Y(v[3]),y1=Y(v[2]); /* v: optional visual rect */
    return '<g class="g2-z" data-z="'+z.k+'"><rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'" class="'+(z.cls||'s-box')+'"/><text x="'+((x0+x1)/2)+'" y="'+((y0+y1)/2+4)+'" text-anchor="middle" class="s-t" style="font-size:'+Math.min(13,Math.max(8,(x1-x0-6)/(String(z.en).length*.6))).toFixed(1)+'px">'+z.en+'</text></g>';}).join('');
  el.innerHTML='<div class="g2"><div class="g2-fig"><svg class="g2-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(cfg.aria||'Interactive grid')+'">'+rects+
    '<line x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'" class="s-line"/><line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(H-PB)+'" class="s-line"/>'+
    '<text x="'+((PL+W-PR)/2)+'" y="'+(H-12)+'" text-anchor="middle" class="s-s" style="font-size:12px">'+cfg.x.label+' →</text>'+
    '<text transform="translate(16 '+((PT+H-PB)/2)+') rotate(-90)" text-anchor="middle" class="s-s" style="font-size:12px">'+cfg.y.label+' →</text>'+
    '<text x="'+PL+'" y="'+(H-PB+16)+'" class="s-s" style="font-size:10px">'+(cfg.x.lo||'rendah')+'</text><text x="'+(W-PR)+'" y="'+(H-PB+16)+'" text-anchor="end" class="s-s" style="font-size:10px">'+(cfg.x.hi||'tinggi')+'</text>'+
    '<circle class="g2-dot" r="11" cx="'+X(s.x)+'" cy="'+Y(s.y)+'"/></svg></div>'+
    '<div class="g2-side"><label class="g2-sl"><span>'+cfg.x.label+' <b data-v="x">'+s.x+'</b></span><input type="range" min="0" max="'+max+'" step="1" value="'+s.x+'" data-ax="x" aria-label="'+cfg.x.label+'"></label>'+
    '<label class="g2-sl"><span>'+cfg.y.label+' <b data-v="y">'+s.y+'</b></span><input type="range" min="0" max="'+max+'" step="1" value="'+s.y+'" data-ax="y" aria-label="'+cfg.y.label+'"></label>'+
    '<div class="g2-out" aria-live="polite"></div></div></div>';
  const dot=el.querySelector('.g2-dot'), out=el.querySelector('.g2-out'); let last=null;
  const upd=()=>{
    dot.setAttribute('cx',X(s.x)); dot.setAttribute('cy',Y(s.y));
    el.querySelector('[data-v=x]').textContent=s.x; el.querySelector('[data-v=y]').textContent=s.y;
    el.querySelector('[data-ax=x]').value=s.x; el.querySelector('[data-ax=y]').value=s.y;
    const z=zoneOf(); el.querySelectorAll('.g2-z').forEach(g=>g.classList.toggle('on',g.dataset.z===z.k));
    if(last!==z.k){ last=z.k; out.classList.remove('in'); void out.offsetWidth;
      out.innerHTML='<div class="g2-name">'+z.name+(z.en?' <span>'+z.en+'</span>':'')+'</div>'+(z.tag?'<div class="g2-tag">'+z.tag+'</div>':'')+'<p>'+z.d+'</p>'+(z.ex?'<p class="g2-ex">'+z.ex+'</p>':'');
      out.classList.add('in'); }
  };
  el.oninput=e=>{const r=e.target.closest('input[type=range]'); if(!r) return; s[r.dataset.ax]=+r.value; upd();};
  const svg=el.querySelector('svg'); let drag=false;
  const fromPt=e=>{const m=svg.getScreenCTM(); if(!m) return; const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(m.inverse());
    s.x=Math.max(0,Math.min(max,Math.round((q.x-PL)/(W-PL-PR)*max))); s.y=Math.max(0,Math.min(max,Math.round((H-PB-q.y)/(H-PB-PT)*max))); upd();};
  svg.addEventListener('pointerdown',e=>{drag=true; try{svg.setPointerCapture(e.pointerId);}catch(_){} fromPt(e);});
  svg.addEventListener('pointermove',e=>{if(drag) fromPt(e);});
  svg.addEventListener('pointerup',()=>{drag=false;}); svg.addEventListener('pointercancel',()=>{drag=false;});
  upd();
}

/* Branching scenario: choices lead to feedback and new situations */
function wScen(el,cfg,s){
  const N=cfg.nodes||{};
  if(!s.node){ s.node=cfg.start; s.path=[]; s.fb=null; }
  const draw=()=>{
    const n=N[s.node]; let h='';
    if(s.path.length) h+='<div class="sc-path" aria-label="Choices so far">'+s.path.map((p,i)=>'<span class="sc-tag '+(p.k||'')+'">'+(i+1)+'. '+p.tag+'</span>').join('')+'</div>';
    if(s.fb){
      h+='<div class="sc-fb '+(s.fb.k||'')+'"><div class="sc-fbh">'+(s.fb.k==='good'?'✔':s.fb.k==='bad'?'✖':'◐')+' '+s.fb.tag+'</div><p>'+s.fb.fb+'</p></div><div class="sc-nav"><button type="button" class="wbtn pri" data-act="go">Continue →</button></div>';
    } else {
      h+='<div class="sc-scene">'+(n.text?'<p class="sc-text">'+n.text+'</p>':'')+(n.say||[]).map(b=>'<div class="sc-say"><b>'+b[0]+'</b><span>'+b[1]+'</span></div>').join('')+'</div>';
      if(n.end) h+='<div class="sc-end '+(n.k||'')+'"><div class="sc-fbh">'+n.title+'</div><p>'+n.end+'</p></div><div class="sc-nav"><button type="button" class="wbtn" data-act="restart">↺ Start again</button></div>';
      else h+='<p class="sc-ask">'+(n.ask||cfg.ask||'')+'</p><div class="sc-ch">'+n.ch.map((c,i)=>'<button type="button" data-c="'+i+'">'+c.t+'</button>').join('')+'</div>';
    }
    el.innerHTML=h;
  };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.c!==undefined){ const c=N[s.node].ch[+b.dataset.c]; s.fb={k:c.k,tag:c.tag,fb:c.fb,to:c.to}; s.path.push({tag:c.tag,k:c.k}); draw(); if(kb(e)) refocus(el,'[data-act=go]'); return; }
    if(b.dataset.act==='go'){ s.node=s.fb.to; s.fb=null; }
    else if(b.dataset.act==='restart'){ s.node=cfg.start; s.path=[]; s.fb=null; }
    draw(); if(kb(e)) refocus(el,'.sc-ch button,[data-act=restart]');
  };
  draw();
}

/* Peer assessment (formative): criteria x levels, comments, copyable summary.
   Draft is kept only in this browser (localStorage) and is never sent anywhere. */
function wPeer(el,cfg,s){
  const C=cfg.criteria||[], Lv=cfg.levels||['1','2','3','4'], K='peer:'+cfg.id, maxS=C.length*Lv.length;
  if(!s.v){ const d=store.get(K,null); s.v=d&&typeof d==='object'?d:{who:'',sc:{},good:'',tip:''}; if(!s.v.sc) s.v.sc={}; }
  const save=()=>store.set(K,s.v);
  const total=()=>C.reduce((a,c,i)=>a+(s.v.sc[i]||0),0);
  const filled=()=>C.filter((c,i)=>s.v.sc[i]).length;
  const band=t=>{const b=(cfg.bands||[]).slice().sort((x,y)=>y.min-x.min).find(x=>t>=x.min); return b?b.t:'';};
  const rowHTML=i=>{const c=C[i], v=s.v.sc[i]||0;
    return '<div class="pa-row" data-r="'+i+'"><div class="pa-c"><b>'+c.t+'</b>'+(c.ind?'<small>'+c.ind+'</small>':'')+'</div><div class="pa-lv" role="group" aria-label="'+c.t.replace(/<[^>]+>/g,'')+'">'+
      Lv.map((l,j)=>'<button type="button" data-r="'+i+'" data-l="'+(j+1)+'" aria-pressed="'+(v===j+1)+'" title="'+l+'">'+(j+1)+'</button>').join('')+
      '</div><div class="pa-d">'+(v?'<b>'+Lv[v-1]+':</b> '+c.d[v-1]:'<span class="muted">'+(cfg.pick||'Pick a level.')+'</span>')+'</div></div>';};
  const sumHTML=()=>{const t=total(), f=filled();
    return '<div class="pa-total"><span><b>'+t+'</b> / '+maxS+'</span><div class="pa-meter"><i style="width:'+(t/maxS*100)+'%"></i></div></div><div class="pa-band">'+(f===C.length?band(t):(f+' of '+C.length+' criteria rated'))+'</div>';};
  el.innerHTML='<div class="pa"><div class="pa-grid">'+C.map((c,i)=>rowHTML(i)).join('')+'</div>'+
    '<div class="pa-side"><label class="pa-f"><span>'+(cfg.whoLabel||'Peer')+'</span><input type="text" data-f="who" maxlength="80" value="'+String(s.v.who).replace(/"/g,'&quot;')+'" placeholder="'+(cfg.whoPh||'')+'"></label>'+
    '<label class="pa-f"><span>'+(cfg.goodLabel||'What went well')+'</span><textarea data-f="good" rows="2" maxlength="400" placeholder="'+(cfg.goodPh||'')+'"></textarea></label>'+
    '<label class="pa-f"><span>'+(cfg.tipLabel||'Suggestion')+'</span><textarea data-f="tip" rows="2" maxlength="400" placeholder="'+(cfg.tipPh||'')+'"></textarea></label>'+
    '<div class="pa-sum" aria-live="polite">'+sumHTML()+'</div>'+
    '<div class="pa-act"><button type="button" class="wbtn pri" data-act="copy">Copy summary</button><button type="button" class="wbtn" data-act="clear">Clear</button><span class="pa-msg" aria-live="polite"></span></div></div></div>';
  el.querySelector('[data-f=good]').value=s.v.good||''; el.querySelector('[data-f=tip]').value=s.v.tip||'';
  const msg=t=>{const m=el.querySelector('.pa-msg'); m.textContent=t; setTimeout(()=>{if(m.textContent===t)m.textContent='';},2500);};
  el.oninput=e=>{const f=e.target.dataset&&e.target.dataset.f; if(!f) return; s.v[f]=e.target.value; save();};
  const plain=h=>String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
  const text=()=>[plain(cfg.title||'Peer assessment'),(cfg.whoLabel||'Peer')+': '+(s.v.who||'-')]
    .concat(C.map((c,i)=>'- '+plain(c.t)+': '+(s.v.sc[i]?s.v.sc[i]+' ('+Lv[s.v.sc[i]-1]+')':'-')))
    .concat(['Total: '+total()+' / '+maxS+(filled()===C.length?' · '+plain(band(total())):''),(cfg.goodLabel||'What went well')+': '+(s.v.good||'-'),(cfg.tipLabel||'Suggestion')+': '+(s.v.tip||'-')]).join('\n');
  const copy=()=>{const t=text();
    const fallback=()=>{const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
      let ok=false; try{ok=document.execCommand('copy');}catch(_){} ta.remove(); msg(ok?'Copied.':'Copy failed. Select the text manually.');};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>msg('Copied.'),fallback); else fallback();};
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.l){ const i=+b.dataset.r; s.v.sc[i]=+b.dataset.l; save();
      const r=el.querySelector('.pa-row[data-r="'+i+'"]'); r.outerHTML=rowHTML(i); el.querySelector('.pa-sum').innerHTML=sumHTML();
      if(kb(e)) refocus(el,'.pa-row[data-r="'+i+'"] [data-l="'+b.dataset.l+'"]'); return; }
    if(b.dataset.act==='copy') copy();
    else if(b.dataset.act==='clear'){ s.v={who:'',sc:{},good:'',tip:''}; save(); wPeer(el,cfg,s); msg('Cleared.'); }
  };
}
