"10\" class=\"s-acc\"/><text x=\"710\" y=\"46\" text-anchor=\"middle\" class=\"s-hd\">SESUDAH</text><text x=\"710\" y=\"72\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Tindak lanjut</text><text x=\"710\" y=\"104\" text-anchor=\"middle\" class=\"s-s\">kirim notulen segera</text><text x=\"710\" y=\"128\" text-anchor=\"middle\" class=\"s-s\">pantau butir tindak lanjut</text><text x=\"710\" y=\"152\" text-anchor=\"middle\" class=\"s-s\">evaluasi jalannya rapat</text></svg><figcaption>Siklus rapat efektif, diadaptasi dari pembahasan rapat produktif dalam Bovée &amp; Thill (2021).</figcaption></figure><div class=\"callout\" style=\"margin-top:.5em\">Bila tujuannya hanya membagikan informasi, pertimbangkan cukup lewat pesan atau dokumen bersama, tanpa rapat.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Alat 1</span><span>Agenda</span></div><h2>Contoh <button type=\"button\" class=\"term\" data-term=\"agenda\">agenda</button> rapat</h2><div class=\"cols w\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg>Rapat Panitia Pelatihan Canva untuk UMKM · HIMA SI</h3><p class=\"muted\" style=\"font-size:.85em\">Kamis, 19.30–20.30 · Ruang 2.1 · Tujuan: menetapkan tanggal, pemateri, dan pembagian tugas</p><div class=\"tw\"><table class=\"t\"><thead><tr><th>Butir</th><th>Waktu</th><th>Pemandu</th></tr></thead><tbody><tr><td>1. Pembukaan, cek kehadiran</td><td>5 menit</td><td>Ketua</td></tr><tr><td>2. Penetapan tanggal acara</td><td>15 menit</td><td>Ketua</td></tr><tr><td>3. Usulan pemateri</td><td>15 menit</td><td>Sie Acara</td></tr><tr><td>4. Anggaran konsumsi</td><td>15 menit</td><td>Bendahara</td></tr><tr><td>5. Pembagian tugas, penutup</td><td>10 menit</td><td>Ketua</td></tr></tbody></table></div></div><div><ul><li>Ada <b>tujuan</b> yang jelas.</li><li>Setiap butir punya <b>waktu</b> dan <b>pemandu</b>.</li><li>Dibagikan <b>sebelum</b> rapat agar peserta bersiap.</li><li>Butir yang perlu keputusan didahulukan.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Kasus ilustrasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Alat 2</span><span>Notulen · indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"minutes\">Notulen</button>: catat keputusan, bukan semua ucapan</h2><div class=\"cols\"><div><h3>Komponen notulen</h3><ol><li>Identitas: nama rapat, hari/tanggal, waktu, tempat</li><li>Peserta: hadir, izin, pemimpin rapat, notulis</li><li>Agenda yang dibahas</li><li>Pokok bahasan singkat per butir</li><li><b>Keputusan</b> per butir</li><li><b>Tindak lanjut</b>: siapa, apa, kapan</li></ol></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Contoh satu butir</h3><p><b>Butir 2. Tanggal acara</b><br>Dibahas: dua usulan, 8 atau 15 November. Tanggal 8 bentrok dengan kegiatan kampus.<br><b>Keputusan:</b> acara Sabtu, 15 November.<br><b>Tindak lanjut:</b> Dina mengajukan peminjaman aula paling lambat Senin.</p><p class=\"muted\" style=\"font-size:.85em\">Kasus ilustrasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Alat 3</span><span>Tindak lanjut</span></div><h2>Siapa, apa, kapan</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Siapa</th><th>Apa</th><th>Kapan</th></tr></thead><tbody><tr><td>Dina</td><td>Ajukan peminjaman aula</td><td>Senin, 12.00</td></tr><tr><td>Fajar</td><td>Hubungi dua calon pemateri</td><td>Rabu</td></tr><tr><td>Salsa</td><td>Rincian anggaran konsumsi</td><td>Kamis, sebelum rapat</td></tr></tbody></table></div><div class=\"chat\" aria-label=\"Contoh pesan tindak lanjut di grup\"><div class=\"who\">Grup Panitia Pelatihan Canva</div><div class=\"bub me\">Assalamualaikum. Notulen rapat tadi terlampir. Tindak lanjut: (1) Dina, aula, Senin 12.00; (2) Fajar, pemateri, Rabu; (3) Salsa, anggaran, Kamis. Mohon konfirmasi 👍<small>21.05</small></div><div class=\"bub\">Siap, aula Senin 👍<small>21.07</small></div></div></div><p style=\"margin-top:.6em\">Setiap <button type=\"button\" class=\"term\" data-term=\"action-item\">butir tindak lanjut</button> harus punya <b>satu nama</b>, <b>pekerjaan yang konkret</b>, dan <b>tenggat</b>.</p><p class=\"muted\" style=\"font-size:.85em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Nilai</span><span>At Taawun · Al Amanah</span></div><h2>Bekerja sama dan menunaikan amanah</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"ar\" lang=\"ar\" dir=\"rtl\">…وَتَعَاوَنُوْا عَلَى الْبِرِّ وَالتَّقْوٰىۖ وَلَا تَعَاوَنُوْا عَلَى الْاِثْمِ وَالْعُدْوَانِ…</p><p class=\"quote\">\"…Dan tolong-menolonglah kamu dalam (mengerjakan) kebajikan dan takwa, dan jangan tolong-menolong dalam berbuat dosa dan permusuhan…\"</p><div class=\"src\">QS. Al-Ma'idah [5]: 2 (potongan) · Terjemahan Kemenag RI (2019)</div></blockquote><blockquote class=\"callout qt\"><p class=\"ar\" lang=\"ar\" dir=\"rtl\">اِنَّ اللّٰهَ يَأْمُرُكُمْ اَنْ تُؤَدُّوا الْاَمٰنٰتِ اِلٰٓى اَهْلِهَاۙ…</p><p class=\"quote\">\"Sungguh, Allah menyuruhmu menyampaikan amanat kepada yang berhak menerimanya, …\"</p><div class=\"src\">QS. An-Nisa' [4]: 58 (potongan) · Terjemahan Kemenag RI (2019)</div></blockquote></div><div><ul><li><button type=\"button\" class=\"term\" data-term=\"at-taawun\">At Taawun</button>: membantu anggota yang tertinggal, berbagi informasi, bukan berlomba menonjolkan diri.</li><li>Tolong-menolong dalam kebaikan, <b>bukan</b> dalam keburukan: membantu mengerjakan bagian teman berbeda dengan menutupi teman yang tidak bekerja.</li><li><button type=\"button\" class=\"term\" data-term=\"al-amanah\">Al Amanah</button>: peran dan tugas dari rapat adalah titipan yang harus ditunaikan tepat waktu.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Simulasi rapat · 30 menit · kelompok 6–8 orang</span></div><h2>Simulasi rapat organisasi</h2><div class=\"cols\"><div><p><b>Pilih satu skenario:</b></p><div class=\"card\" style=\"margin-bottom:.6em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>A · Himpunan mahasiswa</h3><p>HIMA SI merencanakan pelatihan desain Canva untuk UMKM sekitar kampus. Tetapkan tanggal, pemateri, anggaran, dan pembagian tugas.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/></svg>B · Takmir masjid</h3><p>Takmir merencanakan kajian rutin remaja masjid dan pendaftarannya lewat formulir daring. Tetapkan jadwal, penanggung jawab, dan cara promosi.</p></div></div><div><p><b>Peran:</b></p><ul><li>Ketua rapat (fasilitator)</li><li>Notulis</li><li>Pengatur waktu</li><li>Peserta, masing-masing mendapat kartu peran fungsional rahasia (mis. penyemangat, pendominasi, penghalang)</li><li>1–2 pengamat dari kelompok lain</li></ul><p class=\"muted\">Langkah: 5 menit menyusun agenda → 20 menit rapat → 5 menit notulis membacakan keputusan dan tindak lanjut.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Lembar observasi</span><span>Untuk pengamat</span></div><h2>Apa yang diamati?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Perilaku yang diamati</th><th style=\"width:14%\">Ya</th><th style=\"width:14%\">Sebagian</th><th style=\"width:14%\">Belum</th></tr></thead><tbody><tr><td>Rapat dibuka dengan tujuan dan agenda yang jelas</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Setiap butir agenda selesai dengan keputusan</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Ketua memberi giliran bicara secara adil</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Peserta menyampaikan usul beserta alasannya</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Ada peserta yang menjalankan peran pemeliharaan (menengahi, menyemangati)</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Notulis mencatat keputusan dan tindak lanjut siapa-apa-kapan</td><td>○</td><td>○</td><td>○</td></tr><tr><td>Peran dan tanggung jawab setelah rapat jelas</td><td>○</td><td>○</td><td>○</td></tr></tbody></table></div><p class=\"muted\" style=\"margin-top:.5em\">Sampaikan satu hal yang sudah baik dan satu yang bisa ditingkatkan, dengan pesan-saya.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1 · Bagian 2</span><span>Notulen simulasi rapat · 10%</span></div><h2>Notulen dan rencana kerja kelompok</h2><div class=\"cols c3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z\"/><path d=\"M15 3v6h6\"/></svg>Notulen</h3><p>Notulen simulasi rapat organisasi dengan komponen lengkap, termasuk keputusan dan tindak lanjut siapa-apa-kapan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Rencana kerja</h3><p>Pembagian peran dan tanggung jawab kelompok Tugas 1 sampai presentasi di Pertemuan 6–7.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Observasi</h3><p>Dosen mengamati kontribusi dan peran Anda selama simulasi rapat di Pertemuan 4–5.</p></div></div><p class=\"muted\" style=\"margin-top:.8em\">Format, tenggat, dan rubrik ada di lembar tugas yang dibagikan terpisah.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Tim berbeda dari kelompok: anggotanya saling bertanggung jawab atas hasil bersama.</li><li>Kelompok berkembang lewat forming, storming, norming, performing, adjourning.</li><li>Kontribusi berkualitas mencakup peran tugas dan peran pemeliharaan; hindari peran individual.</li><li>Rapat efektif punya tiga fase: persiapan (agenda), pelaksanaan, dan tindak lanjut (notulen).</li><li>Setiap tindak lanjut: siapa, apa, kapan. Itu wujud At Taawun dan Al Amanah.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Storming: perbedaan pendapat dan perebutan peran muncul; wajar dan perlu dibicarakan.\"><p class=\"q\">Anggota berselisih soal pembagian tugas. Menurut Tuckman (1965), ini tahap…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. forming</button><button type=\"button\" data-o=\"b\">B. storming</button><button type=\"button\" data-o=\"c\">C. norming</button><button type=\"button\" data-o=\"d\">D. performing</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Peran pemeliharaan (penjaga giliran bicara): menjaga partisipasi dan suasana kelompok.\"><p class=\"q\">\"Kita dengar dulu pendapat Rina, yuk.\" Anggota ini menjalankan peran…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. tugas</button><button type=\"button\" data-o=\"b\">B. pemeliharaan</button><button type=\"button\" data-o=\"c\">C. individual</button><button type=\"button\" data-o=\"d\">D. notulis</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Notulen bukan transkrip. Keputusan dan tindak lanjut membuat semua orang tahu apa yang harus dikerjakan.\"><p class=\"q\">Bagian notulen terpenting bagi anggota yang tidak hadir adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. seluruh ucapan peserta</button><button type=\"button\" data-o=\"b\">B. keputusan dan tindak lanjut siapa-apa-kapan</button><button type=\"button\" data-o=\"c\">C. pendapat pribadi notulis</button><button type=\"button\" data-o=\"d\">D. daftar hadir saja</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols c3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Rapikan notulen</h3><p>Notulis tiap kelompok merapikan notulen simulasi hari ini dengan komponen lengkap. Anggota lain memeriksa dan memberi masukan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Rencana kerja Tugas 1</h3><p>Adakan rapat kelompok (tatap muka atau daring) dengan agenda tertulis. Hasilkan pembagian peran dan jadwal kerja sampai Pertemuan 7, lengkap dengan notulennya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian tentang rapat yang produktif dalam Bovée &amp; Thill (2021), <i>Business Communication Today</i>.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Small group</span></dt><dd>Sekumpulan kecil orang (sekitar 3–12) yang berinteraksi untuk tujuan bersama dan saling memengaruhi. <i>(kelompok kecil)</i></dd></div><div><dt><span class=\"en\">Team</span></dt><dd>Kelompok kecil dengan keahlian yang saling melengkapi, berkomitmen pada tujuan dan cara kerja bersama, serta saling bertanggung jawab atas hasilnya. <i>(tim)</i></dd></div><div><dt><span class=\"en\">Group development</span></dt><dd>Tahap-tahap yang dilalui kelompok dari saling mengenal sampai bekerja efektif: forming, storming, norming, performing, adjourning. <i>(perkembangan kelompok)</i></dd></div><div><dt><span class=\"en\">Task roles</span></dt><dd>Peran yang membantu kelompok menyelesaikan tugas, mis. memberi usul, mencari informasi, merangkum, mencatat. <i>(peran tugas)</i></dd></div><div><dt><span class=\"en\">Maintenance roles</span></dt><dd>Peran yang menjaga hubungan dan suasana kelompok, mis. menyemangati, menengahi, memberi giliran bicara. <i>(peran pemeliharaan)</i></dd></div><div><dt><span class=\"en\">Individual roles</span></dt><dd>Peran yang mementingkan diri sendiri dan menghambat kelompok, mis. mendominasi, menolak tanpa alasan, mencari perhatian. <i>(peran individual (penghambat))</i></dd></div><div><dt><span class=\"en\">Agenda</span></dt><dd>Daftar butir yang akan dibahas dalam rapat, lengkap dengan tujuan, urutan, dan perkiraan waktu. <i>(agenda / acara rapat)</i></dd></div><div><dt><span class=\"en\">Minutes</span></dt><dd>Catatan resmi rapat yang memuat peserta, pokok bahasan, keputusan, dan tindak lanjut. <i>(notulen / risalah rapat)</i></dd></div><div><dt><span class=\"en\">Action item</span></dt><dd>Tugas hasil rapat yang jelas siapa pelaksananya, apa yang dikerjakan, dan kapan tenggatnya. <i>(butir tindak lanjut)</i></dd></div><div><dt><span class=\"en\">Facilitator</span></dt><dd>Orang yang memimpin jalannya rapat agar sesuai agenda, adil dalam giliran bicara, dan sampai pada keputusan. <i>(pemimpin rapat / fasilitator)</i></dd></div><div><dt><span class=\"en\">Timekeeper</span></dt><dd>Anggota yang menjaga agar setiap butir agenda selesai sesuai waktu yang disepakati. <i>(pengatur waktu)</i></dd></div><div><dt><span class=\"en\">At Taawun</span></dt><dd>Sikap saling menolong dan bekerja sama dalam kebaikan; salah satu nilai inti Unusida (CPL-1). <i>(tolong-menolong / kolaborasi)</i></dd></div><div><dt><span class=\"en\">Al Amanah</span></dt><dd>Sikap dapat dipercaya dan menunaikan tanggung jawab yang diberikan; bagian dari nilai Al Amanah Wal Wafa Bil Ahdi (CPL-1). <i>(amanah / tanggung jawab)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Benne, K. D., &amp; Sheats, P. (1948). Functional roles of group members. <i>Journal of Social Issues, 4</i>(2), 41–49.</li><li>Bovée, C. L., &amp; Thill, J. V. (2021). <i>Business communication today</i> (15th ed.). Pearson.</li><li>Katzenbach, J. R., &amp; Smith, D. K. (1993). <i>The wisdom of teams: Creating the high-performance organization</i>. Harvard Business School Press.</li><li>Kementerian Agama Republik Indonesia. (2019). <i>Al-Qur'an dan terjemahannya</i> (Edisi penyempurnaan 2019). Lajnah Pentashihan Mushaf Al-Qur'an.</li><li>Tuckman, B. W. (1965). Developmental sequence in small groups. <i>Psychological Bulletin, 63</i>(6), 384–399.</li><li>Tuckman, B. W., &amp; Jensen, M. A. C. (1977). Stages of small-group development revisited. <i>Group &amp; Organization Studies, 2</i>(4), 419–427.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 5.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":5,"title":"Musyawarah & Manajemen Konflik","subtitle":"Musyawarah mufakat, penyelesaian konflik, At Taawun & Al Amanah","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 5</span><span>Sub-CPMK-3 (Pertemuan 4–5) · CPMK-1 · CPL-1</span></div><h1>Musyawarah & Manajemen Konflik</h1><p class=\"lead\">Musyawarah mufakat, penyelesaian konflik, At Taawun & Al Amanah</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu berkomunikasi dalam kelompok secara kolaboratif, termasuk rapat, musyawarah, dan penyelesaian konflik (C3).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":6,"title":"Merancang Presentasi","subtitle":"Analisis audiens, struktur, storytelling, desain slide","status":"soon","slides":[{"cls":"","html":"<div c /* ============ RUNTIME (UI in English; content in Indonesian) ============ */
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    const slideHTML='<section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section>';
    const restHTML='<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    /* Full screen: keep the same #stage element so the browser stays in full screen; only swap its content */
    const fsEl=document.fullscreenElement;
    if(fsEl&&fsEl.id==='stage'&&fsEl.parentNode===v){
      fsEl.innerHTML=slideHTML;
      Array.from(v.children).forEach(c=>{if(c!==fsEl)c.remove();});
      fsEl.insertAdjacentHTML('afterend',restHTML);
    } else {
      v.innerHTML='<div class="stage" id="stage">'+slideHTML+'</div>'+restHTML;
    }
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});
document.addEventListener('click',e=>{const t=e.target.closest('.term'); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(!e.target.closest('.tip')) hideTip();
  if(e.target.closest('[data-lock]')){lockNotes();return;}
  const qb=e.target.closest('.quiz button'); if(qb){const q=qb.closest('.quiz'); if(q.dataset.done)return; q.dataset.done=1; const ok=qb.dataset.o===q.dataset.ans;
    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Init ---------- */
$('#brandLogo').src=LOGO;
$('#bMenu').innerHTML=ic('menu','');
$('#bMode1').innerHTML=ic('slides','')+'<span class="lbl">Slides</span>';
$('#bMode2').innerHTML=ic('book','')+'<span class="lbl">Read</span>';
$('#bMenu').onclick=()=>toggleMenu(); $('#scrim').onclick=()=>toggleMenu(false);
$('#bMode1').onclick=()=>setMode('slide'); $('#bMode2').onclick=()=>setMode('read');
$('#bNotes').onclick=toggleNotes; $('#bTheme').onclick=toggleTheme;
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();const pw=$('#pw').value;if(pw)tryUnlock(pw,false);});
$('#pwCancel').onclick=closeUnlock;
$('#unlock').addEventListener('click',e=>{if(e.target.id==='unlock')closeUnlock();});
if(store.get('collapsed',false)&&!window.matchMedia('(max-width:900px)').matches)$('#app').classList.add('collapsed');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
buildSide(); readHash(); paintTheme(); render();
const saved=sess.get('pw'); if(saved) tryUnlock(saved,true);
window.addEventListener('hashchange',()=>{readHash();render();});
})();

</script>
</body>
